<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constellation · Nova 星图</title>
<style>
  :root {
    --space-deep: #050818;
    --space-1: #0a0e27;
    --space-2: #1a1a3e;
    --space-3: #252550;
    --star-gold: #ffd76b;
    --star-cyan: #6bd5ff;
    --star-white: #e8f0ff;
    --line-soft: rgba(107, 213, 255, 0.18);
    --line-mid: rgba(107, 213, 255, 0.4);
    --core-color: #ffd76b;
    --core-glow: rgba(255, 215, 107, 0.6);
    --text: #e8f0ff;
    --text-soft: #a8b4d4;
    --text-mute: #6b7299;
    --panel-bg: rgba(15, 18, 45, 0.92);
    --panel-border: rgba(107, 213, 255, 0.25);
    --accent: #6bd5ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--space-deep);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  /* 深空背景 */
  .space-bg {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(80, 60, 160, 0.35) 0%, transparent 45%),
      radial-gradient(ellipse at 75% 70%, rgba(40, 80, 180, 0.3) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, var(--space-2) 0%, var(--space-1) 40%, var(--space-deep) 100%);
    z-index: 0;
  }

  /* 星云雾漂移层 */
  .nebula {
    position: fixed;
    inset: -10%;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(circle at 20% 30%, rgba(120, 80, 200, 0.12) 0%, transparent 25%),
      radial-gradient(circle at 80% 60%, rgba(60, 120, 200, 0.1) 0%, transparent 30%),
      radial-gradient(circle at 50% 80%, rgba(200, 100, 180, 0.08) 0%, transparent 25%);
    animation: nebulaDrift 60s ease-in-out infinite alternate;
    will-change: transform;
  }
  @keyframes nebulaDrift {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-3%, 2%) scale(1.05); }
    100% { transform: translate(2%, -3%) scale(1.02); }
  }

  /* 背景星点 - 用多层box-shadow生成 */
  .starfield {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }
  .starfield::before, .starfield::after {
    content: '';
    position: absolute;
    width: 2px; height: 2px;
    border-radius: 50%;
    background: transparent;
  }
  .starfield::before {
    box-shadow:
      120px 80px white, 340px 200px #ccd, 580px 120px white, 800px 320px #aaf,
      200px 450px white, 450px 600px #ddf, 700px 500px white, 950px 700px #ccd,
      150px 750px white, 380px 850px #aaf, 620px 780px white, 880px 880px #ddf,
      1080px 150px white, 1200px 380px #ccd, 1340px 250px white, 1100px 550px #aaf,
      1280px 680px white, 1450px 800px #ddf, 60px 300px #ccd, 1180px 920px white,
      250px 950px #aaf, 520px 980px white, 780px 950px #ccd, 1380px 60px white,
      100px 550px #ddf, 1150px 480px white, 330px 350px #ccd, 1050px 880px #aaf;
    animation: twinkle 4s ease-in-out infinite;
  }
  .starfield::after {
    box-shadow:
      80px 160px 1px #eef, 420px 280px 1px white, 660px 200px 1px #aaf,
      920px 400px 1px #ddf, 280px 520px 1px white, 540px 680px 1px #ccd,
      760px 580px 1px white, 1020px 760px 1px #aaf, 180px 680px 1px #ddf,
      400px 780px 1px white, 680px 860px 1px #ccd, 980px 920px 1px white,
      1240px 200px 1px #aaf, 1380px 420px 1px #ddf, 1120px 620px 1px white,
      1280px 780px 1px #ccd, 40px 420px 1px white, 1160px 100px 1px #aaf,
      220px 880px 1px #ddf, 500px 920px 1px white, 820px 980px 1px #ccd;
    animation: twinkle 6s ease-in-out infinite reverse;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  /* 视差容器 */
  .parallax-wrap {
    position: fixed;
    inset: 0;
    z-index: 2;
    will-change: transform;
    transition: transform 0.4s ease-out;
  }

  /* 星图SVG */
  .constellation {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* 星辰 */
  .star {
    position: absolute;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 5;
  }
  .star-core {
    border-radius: 50%;
    background: radial-gradient(circle, var(--star-white) 0%, var(--star-cyan) 40%, transparent 70%);
    box-shadow:
      0 0 12px var(--star-cyan),
      0 0 24px rgba(107, 213, 255, 0.4),
      0 0 48px rgba(107, 213, 255, 0.2);
    animation: starBreathe 4s ease-in-out infinite;
  }
  .star.large .star-core {
    background: radial-gradient(circle, #fff 0%, var(--star-gold) 40%, transparent 70%);
    box-shadow:
      0 0 16px var(--star-gold),
      0 0 32px rgba(255, 215, 107, 0.5),
      0 0 64px rgba(255, 215, 107, 0.25);
  }
  .star.medium .star-core {
    background: radial-gradient(circle, #fff 0%, var(--star-cyan) 50%, transparent 70%);
    box-shadow:
      0 0 10px var(--star-cyan),
      0 0 20px rgba(107, 213, 255, 0.4);
  }
  .star:hover {
    transform: scale(1.4);
    z-index: 15;
  }
  .star:hover .star-core {
    animation-play-state: paused;
    filter: brightness(1.4);
  }
  .star.dimmed {
    opacity: 0.25;
    filter: grayscale(0.6);
  }
  .star.dimmed .star-core { animation-play-state: paused; }

  @keyframes starBreathe {
    0%, 100% { transform: scale(1); opacity: 0.95; }
    50% { transform: scale(1.12); opacity: 1; }
  }

  .star-label {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-top: 6px;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-soft);
    white-space: nowrap;
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
    pointer-events: none;
    letter-spacing: 0.5px;
  }
  .star:hover .star-label {
    color: var(--star-cyan);
    font-weight: 600;
  }

  /* 星辰tooltip */
  .star-tooltip {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%) translateY(-8px);
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(16px);
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 11px;
    color: var(--text);
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .star:hover .star-tooltip { opacity: 1; }
  .star-tooltip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: var(--panel-bg);
  }

  /* 中心Agent核心 */
  .agent-core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 8;
    cursor: pointer;
  }
  .core-orb {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, var(--core-color) 35%, #ff9d4a 70%, transparent 100%);
    box-shadow:
      0 0 40px var(--core-glow),
      0 0 80px rgba(255, 215, 107, 0.4),
      0 0 120px rgba(255, 157, 74, 0.2);
    animation: corePulse 3s ease-in-out infinite;
    position: relative;
  }
  .core-orb::before, .core-orb::after {
    content: '';
    position: absolute;
    inset: -20px;
    border-radius: 50%;
    border: 1px solid rgba(255, 215, 107, 0.3);
    animation: coreRing 3s ease-out infinite;
  }
  .core-orb::after {
    inset: -40px;
    animation-delay: 1.5s;
    border-color: rgba(255, 215, 107, 0.15);
  }
  @keyframes corePulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 40px var(--core-glow), 0 0 80px rgba(255, 215, 107, 0.4), 0 0 120px rgba(255, 157, 74, 0.2); }
    50% { transform: scale(1.08); box-shadow: 0 0 60px var(--core-glow), 0 0 100px rgba(255, 215, 107, 0.5), 0 0 160px rgba(255, 157, 74, 0.3); }
  }
  @keyframes coreRing {
    0% { opacity: 1; transform: scale(0.8); }
    100% { opacity: 0; transform: scale(1.6); }
  }
  .core-label {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-top: 20px;
    text-align: center;
    white-space: nowrap;
  }
  .core-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--core-color);
    letter-spacing: 2px;
    text-shadow: 0 0 12px rgba(255, 215, 107, 0.5);
  }
  .core-sub {
    font-size: 10px;
    color: var(--text-mute);
    margin-top: 2px;
    letter-spacing: 1px;
  }

  /* 连线SVG */
  .constellation-lines {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 3;
  }
  .const-line {
    stroke: var(--line-soft);
    stroke-width: 1;
    fill: none;
    transition: stroke 0.4s, opacity 0.4s;
  }
  .const-line.highlight {
    stroke: var(--line-mid);
    stroke-width: 1.5;
  }
  .const-line.dimmed { opacity: 0.15; }

  /* 顶部信息条 */
  .top-info {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 28px;
    pointer-events: none;
  }
  .info-chip {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(16px);
    padding: 10px 18px;
    border-radius: 24px;
    font-size: 13px;
    color: var(--text);
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .info-chip .chip-label {
    color: var(--text-mute);
    font-size: 11px;
  }
  .info-chip .chip-value {
    font-weight: 700;
    color: var(--accent);
  }
  .info-chip.center {
    padding: 8px 20px;
  }
  .info-chip.center .agent-badge {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--star-gold), var(--star-cyan));
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 13px;
    color: var(--space-deep);
    box-shadow: 0 0 12px var(--core-glow);
  }
  .info-chip.center .agent-title {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  /* 功能面板 */
  .ability-panel {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.85);
    width: min(440px, 90vw);
    max-height: 75vh;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(24px);
    border-radius: 24px;
    padding: 28px;
    z-index: 40;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 60px rgba(107, 213, 255, 0.1);
    overflow-y: auto;
  }
  .ability-panel.open {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
  }
  .ability-panel::-webkit-scrollbar { width: 4px; }
  .ability-panel::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 2px; }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .panel-title-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .panel-icon {
    width: 40px; height: 40px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, rgba(107, 213, 255, 0.2), rgba(255, 215, 107, 0.15));
    border: 1px solid var(--panel-border);
    font-size: 20px;
  }
  .panel-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }
  .panel-subtitle {
    font-size: 11px;
    color: var(--text-mute);
    margin-top: 2px;
  }
  .panel-close {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--panel-border);
    color: var(--text-soft);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .panel-close:hover { background: rgba(255,107,107,0.15); color: #ff6b6b; border-color: #ff6b6b; }

  .panel-desc {
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-soft);
    margin-bottom: 18px;
    padding: 12px 14px;
    background: rgba(107, 213, 255, 0.06);
    border-radius: 12px;
    border-left: 2px solid var(--accent);
  }

  .panel-input {
    width: 100%;
    padding: 14px 16px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    resize: none;
    outline: none;
    min-height: 100px;
    transition: border-color 0.2s;
    user-select: text;
  }
  .panel-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(107, 213, 255, 0.1); }
  .panel-input::placeholder { color: var(--text-mute); }

  .panel-actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  .panel-btn {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
    font-family: inherit;
  }
  .panel-btn-primary {
    background: linear-gradient(135deg, var(--accent), #4ab8e8);
    color: var(--space-deep);
  }
  .panel-btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(107, 213, 255, 0.3); }
  .panel-btn-ghost {
    background: rgba(255,255,255,0.05);
    color: var(--text-soft);
    border: 1px solid var(--panel-border);
  }
  .panel-btn-ghost:hover { background: rgba(255,255,255,0.1); color: var(--text); }

  .panel-output {
    margin-top: 16px;
    padding: 14px;
    background: rgba(0,0,0,0.25);
    border-radius: 12px;
    border: 1px solid var(--panel-border);
    font-size: 13px;
    line-height: 1.7;
    color: var(--text);
    white-space: pre-wrap;
    display: none;
  }
  .panel-output.show { display: block; animation: fadeIn 0.4s; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .panel-quick {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .quick-tag {
    padding: 6px 12px;
    background: rgba(107, 213, 255, 0.08);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    font-size: 12px;
    color: var(--text-soft);
    cursor: pointer;
    transition: all 0.2s;
  }
  .quick-tag:hover { background: rgba(107, 213, 255, 0.18); color: var(--accent); }

  /* 底部输入框 */
  .bottom-input {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: min(560px, 92vw);
    z-index: 30;
  }
  .input-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(16px);
    padding: 8px 8px 8px 20px;
    border-radius: 28px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-wrap:focus-within {
    border-color: var(--accent);
    box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 0 3px rgba(107, 213, 255, 0.12);
  }
  .input-icon {
    color: var(--text-mute);
    flex-shrink: 0;
  }
  .input-field {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 8px 0;
    user-select: text;
  }
  .input-field::placeholder { color: var(--text-mute); }
  .input-send {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--accent), #4ab8e8);
    color: var(--space-deep);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .input-send:hover { transform: scale(1.08); box-shadow: 0 4px 16px rgba(107, 213, 255, 0.4); }
  .input-send:active { transform: scale(0.95); }

  /* 发现新能力按钮 */
  .discover-btn {
    position: fixed;
    bottom: 90px;
    right: 24px;
    z-index: 30;
    background: linear-gradient(135deg, rgba(255, 215, 107, 0.2), rgba(255, 157, 74, 0.15));
    border: 1px solid rgba(255, 215, 107, 0.4);
    backdrop-filter: blur(16px);
    color: var(--star-gold);
    padding: 12px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    animation: discoverPulse 2.5s ease-in-out infinite;
  }
  @keyframes discoverPulse {
    0%, 100% { box-shadow: 0 8px 24px rgba(0,0,0,0.3), 0 0 0 0 rgba(255, 215, 107, 0.4); }
    50% { box-shadow: 0 8px 24px rgba(0,0,0,0.3), 0 0 0 12px rgba(255, 215, 107, 0); }
  }
  .discover-btn:hover { transform: translateY(-2px); background: linear-gradient(135deg, rgba(255, 215, 107, 0.3), rgba(255, 157, 74, 0.25)); }
  .discover-btn svg { animation: spin 8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 新星诞生动画 */
  .new-star-burst {
    position: absolute;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: white;
    pointer-events: none;
    z-index: 20;
  }
  .new-star-burst::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    background: radial-gradient(circle, white, var(--star-gold), transparent);
    animation: starBurst 1.2s ease-out forwards;
  }
  @keyframes starBurst {
    0% { transform: scale(0); opacity: 1; }
    100% { transform: scale(40); opacity: 0; }
  }

  /* 提示 */
  .toast {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(16px);
    color: var(--text);
    padding: 12px 22px;
    border-radius: 24px;
    font-size: 13px;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.4);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast .toast-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--star-gold);
    box-shadow: 0 0 8px var(--star-gold);
  }

  @media (max-width: 640px) {
    .top-info { padding: 14px; flex-wrap: wrap; gap: 8px; }
    .info-chip { padding: 8px 14px; font-size: 12px; }
    .info-chip.center .agent-title { font-size: 13px; }
    .ability-panel { padding: 22px 20px; }
    .panel-title { font-size: 16px; }
    .discover-btn { padding: 10px 14px; font-size: 12px; bottom: 84px; right: 16px; }
    .star-label { font-size: 10px; }
    .core-orb { width: 64px; height: 64px; }
  }
</style>
</head>
<body>

<!-- 深空背景层 -->
<div class="space-bg"></div>
<div class="nebula"></div>
<div class="starfield"></div>

<!-- 视差容器 -->
<div class="parallax-wrap" id="parallaxWrap">
  <svg class="constellation-lines" id="linesSvg"></svg>
  <div class="constellation" id="constellation">
    <!-- 星辰由JS生成 -->
    <!-- 中心Agent核心 -->
    <div class="agent-core" id="agentCore">
      <div class="core-orb"></div>
      <div class="core-label">
        <div class="core-name">NOVA</div>
        <div class="core-sub">AGENT CORE</div>
      </div>
    </div>
  </div>
</div>

<!-- 顶部信息 -->
<header class="top-info">
  <div class="info-chip">
    <span class="chip-label">已掌握能力</span>

// 星座连线（能力关联）
const CONSTELLATIONS = [
  ['chat', 'writing'], ['writing', 'creation'], ['chat', 'analysis'],
  ['analysis', 'data'], ['memory', 'chat'], ['memory', 'knowledge'],
  ['search', 'knowledge'], ['creation', 'code'], ['schedule', 'memory'],

const CORE = { x: 50, y: 50 };

// 渲染星辰
function renderStars() {
  const container = document.getElementById('constellation');
  STARS.forEach((star, i) => {
    const el = document.createElement('div');
    el.className = `star ${star.size}`;
    el.dataset.id = star.id;
    // 尺寸
    const sizeMap = { large: 22, medium: 16, small: 12 };
    const s = sizeMap[star.size];
    el.style.left = `${star.x}%`;
    el.style.top = `${star.y}%`;
    el.style.transform = 'translate(-50%, -50%)';
    el.style.animationDelay = `${i * 0.3}s`;

    el.innerHTML = `
      <div class="star-core" style="width:${s}px;height:${s}px;animation-delay:${i * 0.4}s"></div>
      <div class="star-label">${star.name}</div>
      <div class="star-tooltip">${star.desc.substring(0, 30)}...</div>
    `;

    el.addEventListener('click', (e) => {
      e.stopPropagation();
      openAbility(star);
    });

    container.appendChild(el);
  });
}

// 渲染连线
function renderLines() {
  const svg = document.getElementById('linesSvg');
  svg.setAttribute('viewBox', '0 0 100 100');
  svg.setAttribute('preserveAspectRatio', 'none');

  CONSTELLATIONS.forEach(([a, b]) => {
    const starA = a === 'core' ? CORE : STARS.find(s => s.id === a);
    const starB = b === 'core' ? CORE : STARS.find(s => s.id === b);
    if (!starA || !starB) return;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', starA.x);
    line.setAttribute('y1', starA.y);
    line.setAttribute('x2', starB.x);
    line.setAttribute('y2', starB.y);
    line.setAttribute('class', 'const-line');
    line.dataset.from = a;
    line.dataset.to = b;
    svg.appendChild(line);
  });
}

// 高亮相关星辰与连线
function highlightStar(starId) {
  document.querySelectorAll('.star').forEach(s => {
    const connected = CONSTELLATIONS.some(([a, b]) =>
      (a === starId && b === s.dataset.id) || (b === starId && a === s.dataset.id)
    ) || s.dataset.id === starId;
    s.classList.toggle('dimmed', !connected);
  });
  document.querySelectorAll('.const-line').forEach(l => {
    const involved = l.dataset.from === starId || l.dataset.to === starId;
    l.classList.toggle('highlight', involved);
    l.classList.toggle('dimmed', !involved);
  });
}

function resetHighlight() {
  document.querySelectorAll('.star').forEach(s => s.classList.remove('dimmed'));
  document.querySelectorAll('.const-line').forEach(l => {
    l.classList.remove('highlight', 'dimmed');
  });
}

  document.getElementById('panelSubtitle').textContent = `Nova · ${star.name}能力`;

  document.getElementById('panelInput').value = '';
  document.getElementById('panelInput').placeholder = star.placeholder;
  document.getElementById('panelOutput').classList.remove('show');

  const quickWrap = document.getElementById('panelQuick');
  quickWrap.innerHTML = star.quicks.map(q => `<span class="quick-tag">${q}</span>`).join('');

    tag.addEventListener('click', () => {
      document.getElementById('panelInput').value = star.quicks[i];
      document.getElementById('panelInput').focus();
    });
  });

  panel.dataset.currentStar = star.id;
  panel.classList.add('open');
  highlightStar(star.id);
  interactCount++;
  document.getElementById('interactCount').textContent = interactCount;
}

// 星辰轨道微漂移
function orbitStars() {
  document.querySelectorAll('.star').forEach((el, i) => {
    const baseLeft = parseFloat(el.style.left);
    const baseTop = parseFloat(el.style.top);
    // 用CSS变量记录基准位置
    if (!el.dataset.baseX) {
      el.dataset.baseX = baseLeft;
      el.dataset.baseY = baseTop;
    }
  });
}

let orbitT = 0;
function animateOrbit() {
  orbitT += 0.005;
  document.querySelectorAll('.star').forEach((el, i) => {
    if (!el.dataset.baseX) return;
    const bx = parseFloat(el.dataset.baseX);
    const by = parseFloat(el.dataset.baseY);
    const amp = 0.8;
    const dx = Math.sin(orbitT + i * 0.7) * amp;
    const dy = Math.cos(orbitT + i * 0.9) * amp;
    el.style.left = `${bx + dx}%`;
    el.style.top = `${by + dy}%`;
  });
  // 更新连线
  document.querySelectorAll('.const-line').forEach(line => {
    const starA = line.dataset.from === 'core' ? CORE : STARS.find(s => s.id === line.dataset.from);
    const starB = line.dataset.to === 'core' ? CORE : STARS.find(s => s.id === line.dataset.to);
    if (starA) {
      const elA = line.dataset.from === 'core' ? null : document.querySelector(`.star[data-id="${line.dataset.from}"]`);
      const ax = elA ? parseFloat(elA.style.left) : starA.x;
      const ay = elA ? parseFloat(elA.style.top) : starA.y;
      line.setAttribute('x1', ax);
      line.setAttribute('y1', ay);
    }
    if (starB) {
      const elB = line.dataset.to === 'core' ? null : document.querySelector(`.star[data-id="${line.dataset.to}"]`);
      const bx = elB ? parseFloat(elB.style.top) : starB.x;
      const by = elB ? parseFloat(elB.style.top) : starB.y;
      if (elB) {
        line.setAttribute('x2', parseFloat(elB.style.left));
        line.setAttribute('y2', parseFloat(elB.style.top));
      } else {
        line.setAttribute('x2', starB.x);
        line.setAttribute('y2', starB.y);
      }
    }
  });
  requestAnimationFrame(animateOrbit);
}
