<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星群 SWARM — 多智能体编排</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0b1020;color:#dbe4f5;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
header{
  display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
  padding:22px 30px;border-bottom:1px solid #1a2340;
  position:sticky;top:0;background:rgba(11,16,32,.9);backdrop-filter:blur(10px);z-index:5;
}
header .brand{font-size:20px;font-weight:800;letter-spacing:.14em}
header .brand span{color:#ff7a45}
header .meta{display:flex;gap:26px;align-items:center;font-family:"Courier New",monospace;font-size:11px;letter-spacing:.2em;color:#7a88b0}
header .meta b{color:#ff7a45;font-weight:400}
.ring{
  width:52px;height:52px;border-radius:50%;
  background:conic-gradient(#ff7a45 calc(var(--p) * 1%), #1a2340 0);
  display:flex;align-items:center;justify-content:center;
}
.ring::after{content:"";width:40px;height:40px;border-radius:50%;background:#0b1020;position:absolute}
.ring i{position:relative;z-index:1;font-style:normal;font-size:11px;font-family:"Courier New",monospace;color:#ff7a45}
.ring{position:relative}
main{display:grid;grid-template-columns:1fr 300px;min-height:calc(100vh - 90px)}
.board{position:relative;padding:24px 20px;min-height:640px}
.lanes{
  position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);
  padding:96px 20px 20px;
}
.lane{border-left:1px dashed #1c2547;padding:0 14px;position:relative}
.lane:first-child{border-left:none}
.lane h3{
  position:absolute;top:-64px;left:14px;
  font-size:12px;letter-spacing:.3em;color:#7a88b0;font-weight:400;
  display:flex;align-items:center;gap:8px;
}
.lane h3 .n{
  width:20px;height:20px;border-radius:6px;background:#151d3a;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;color:#7a88b0;font-family:"Courier New",monospace;
}
.boardhead{
  position:absolute;top:22px;left:20px;right:20px;display:flex;justify-content:space-between;
  font-family:"Courier New",monospace;font-size:11px;letter-spacing:.24em;color:#7a88b0;
}
.card{
  position:absolute;width:calc(25% - 24px);
  background:linear-gradient(160deg, #161f42, #10162e);
  border:1px solid #27335e;border-left:3px solid var(--c,#4d7cff);
  border-radius:14px;padding:14px 16px;
  transition:transform .9s cubic-bezier(.25,.8,.25,1), opacity .5s;
  z-index:2;
  box-shadow:0 8px 30px rgba(0,0,0,.35);
}
.card .ag{display:flex;align-items:center;gap:8px;font-size:12px;color:#9fb0dc}
.card .ag .ic{
  width:22px;height:22px;border-radius:7px;background:#1c2750;
  display:inline-flex;align-items:center;justify-content:center;font-size:12px;
}
.card .task{font-size:14px;margin-top:10px;color:#eef3ff;line-height:1.5}
.card .bar{height:4px;background:#1c2750;border-radius:2px;margin-top:12px;overflow:hidden}
.card .bar i{display:block;height:100%;width:0;background:var(--c,#4d7cff);border-radius:2px}
.card.done{opacity:.35;transform-origin:center}
.card.fade{opacity:0;transform:scale(.8)}
.side{
  border-left:1px solid #1a2340;padding:22px 20px;
  display:flex;flex-direction:column;gap:20px;
}
.side h3{font-size:12px;letter-spacing:.3em;color:#7a88b0;font-weight:400}
.log{
  font-family:"Courier New",monospace;font-size:11.5px;line-height:2;
  color:#8fa0c8;flex:1;overflow:hidden;
}
.log .t{color:#4d7cff}.log .ok{color:#4de3a1}.log .warn{color:#ffb454}
.log div{animation:tin .4s both}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kpi{display:flex;gap:12px}
.kpi .k{flex:1;background:#111838;border:1px solid #1c2547;border-radius:12px;padding:12px;text-align:center}
.kpi .k b{display:block;font-size:20px;color:#ff7a45;font-family:"Courier New",monospace}
.kpi .k span{font-size:10px;letter-spacing:.2em;color:#7a88b0}
.legend{font-size:11px;line-height:2;color:#7a88b0}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px}
</style>
</head>
<body>
<header>
  <div class="brand">星群 <span>SWARM</span></div>
  <div class="meta">
    <span>编排者 ORCA <b>●</b> 在线</span>
    <span>编队 <b id="cnt">8</b> 体</span>
    <span>今日完成 <b id="done">0</b></span>
    <div class="ring" id="ring" style="--p:0"><i id="ringv">0%</i></div>
  </div>
</header>
<main>
  <div class="board" id="board">
    <div class="boardhead">
      <span>MISSION BOARD · 并行工作流</span>
      <span id="boardclock"></span>
    </div>
    <div class="lanes">
      <div class="lane"><h3><span class="n">01</span>队列 QUEUE</h3></div>
      <div class="lane"><h3><span class="n">02</span>推理 REASON</h3></div>
      <div class="lane"><h3><span class="n">03</span>执行 EXEC</h3></div>
      <div class="lane"><h3><span class="n">04</span>完成 DONE</h3></div>
    </div>
  </div>
  <aside class="side">
    <h3>活动流 EVENT STREAM</h3>
    <div class="log" id="log"></div>
    <h3>编队状态</h3>
    <div class="kpi">
      <div class="k"><b id="k1">0</b><span>推理中</span></div>
      <div class="k"><b id="k2">0</b><span>执行中</span></div>
      <div class="k"><b id="k3">0</b><span>待命</span></div>
    </div>
    <div class="legend">
      <i style="background:#4d7cff"></i>研究员 · 检索与推理<br>
      <i style="background:#ff7a45"></i>执行体 · 工具调用<br>
      <i style="background:#4de3a1"></i>文案体 · 生成创作<br>
      <i style="background:#c98cff"></i>哨兵 · 监控校验
    </div>
  </aside>
</main>
<script>
const board = document.getElementById('board');
const logEl = document.getElementById('log');
let done = 0, active = 0;
const agents = [
  {n:'研究员', ic:'⚙', c:'#4d7cff'},
  {n:'执行体', ic:'⚡', c:'#ff7a45'},
  {n:'文案体', ic:'✎', c:'#4de3a1'},
  {n:'哨兵',   ic:'🛰', c:'#c98cff'}
];
const tasks = [
  '检索量子计算综述','整理竞品分析','起草周报','审查数据管道','生成产品文案',
  '监控服务健康','编写测试用例','汇总用户反馈','分析市场趋势','生成封面图提示词',
  '校验引用来源','重写技术文档','提取会议要点','构建知识图谱','压力测试接口'
];
function log(type, text){
  const d = document.createElement('div');
  d.innerHTML = '<span class="' + type + '">[' + new Date().toTimeString().slice(0,8) + ']</span> ' + text;
  logEl.prepend(d);
  while (logEl.children.length > 14) logEl.removeChild(logEl.lastChild);
}
function laneX(l){ return board.offsetLeft + 20 + l * (board.clientWidth - 40) / 4 + 14; }
function spawn(){
  const a = agents[Math.floor(Math.random() * agents.length)];
  const t = tasks[Math.floor(Math.random() * tasks.length)];
  const card = document.createElement('div');
  card.className = 'card';
  card.style.setProperty('--c', a.c);
  card.innerHTML = '<div class="ag"><span class="ic">' + a.ic + '</span>' + a.n + '·' + String(Math.floor(Math.random()*90)+10) + '</div>' +
                   '<div class="task">' + t + '</div>' +
                   '<div class="bar"><i></i></div>';
  const x0 = laneX(0);
  card.style.left = x0 + 'px';
  card.style.top = (100 + Math.random() * (board.clientHeight - 300)) + 'px';
  board.appendChild(card);
  const prog = card.querySelector('.bar i');
  let stage = 0, p = 0;
  active++;
  updateKpi();
  log('t', a.n + ' 接取任务 → ' + t);
  const iv = setInterval(() => {
    p += 2 + Math.random() * 4;
    prog.style.width = Math.min(100, p) + '%';
    if (p >= 100){
      clearInterval(iv);
      stage++;
      if (stage < 3){
        card.style.left = laneX(stage) + 'px';
        card.style.top = (100 + Math.random() * (board.clientHeight - 300)) + 'px';
        p = 0;
        log(stage === 1 ? 'warn' : 't', a.n + (stage === 1 ? ' 进入执行 → ' : ' 进入推理 → ') + t);
      } else {
        card.style.left = laneX(3) + 'px';
        card.style.top = (100 + Math.random() * (board.clientHeight - 300)) + 'px';
        card.classList.add('done');
        log('ok', '✓ ' + a.n + ' 完成 → ' + t);
        done++; active--;
        document.getElementById('done').textContent = done;
        const pct = Math.min(100, done * 7);
        document.getElementById('ring').style.setProperty('--p', pct);
        document.getElementById('ringv').textContent = pct + '%';
        updateKpi();
        setTimeout(() => { card.classList.add('fade'); setTimeout(() => card.remove(), 600); }, 1600);
      }
    }
  }, 60);
}
function updateKpi(){
  document.getElementById('k1').textContent = Math.round(active * .4);
  document.getElementById('k2').textContent = Math.round(active * .45);
  document.getElementById('k3').textContent = 8 - active;
  document.getElementById('cnt').textContent = 8 - active + Math.min(done, 40);
}
setInterval(spawn, 2600);
for (let i = 0; i < 4; i++) setTimeout(spawn, i * 500);
setInterval(() => {
  document.getElementById('boardclock').textContent = new Date().toTimeString().slice(0, 8) + ' · 事件 ' + String(done * 3).padStart(4, '0');
  if (Math.random() < .4){
    const r = ['向量库心跳正常','上下文窗口 64%','工具池同步完成','记忆压缩完成','发现新数据源，已入队'];
    log('t', r[Math.floor(Math.random() * r.length)]);
  }
}, 3000);
</script>
</body>
</html>
