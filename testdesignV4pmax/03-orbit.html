<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星域 ORBIT — 在纵深中导航</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#02030a;color:#dfe8ff;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
canvas#stars{position:fixed;inset:0;z-index:0}
.scene{
  position:fixed;inset:0;z-index:1;
  display:flex;align-items:center;justify-content:center;
  transform:scale(var(--zoom,1));
  transition:transform .5s cubic-bezier(.2,.8,.2,1);
}
.core{
  position:relative;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%, #fff, #9fd8ff 22%, #3b6bff 52%, rgba(30,40,120,.9) 78%);
  box-shadow:0 0 90px 20px rgba(90,150,255,.45), 0 0 260px 90px rgba(80,60,255,.22);
  animation:breathe 5s ease-in-out infinite;
}
@keyframes breathe{50%{box-shadow:0 0 130px 34px rgba(90,150,255,.6), 0 0 340px 120px rgba(80,60,255,.3)}}
.core .label{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:15px;letter-spacing:.34em;white-space:nowrap;color:#eaf2ff;
}
.orbit{
  position:absolute;left:50%;top:50%;
  border:1px solid rgba(140,180,255,.16);
  border-radius:50%;
}
.orbit::before{
  content:"";position:absolute;inset:-1px;border-radius:50%;
  border-top:1px solid rgba(160,200,255,.5);
  animation:orbitSpin var(--t) linear infinite;
}
@keyframes orbitSpin{to{transform:rotate(360deg)}}
.o1{width:300px;height:300px;transform:translate(-50%,-50%) scaleY(.34);--t:26s}
.o2{width:480px;height:480px;transform:translate(-50%,-50%) scaleY(.34);--t:40s}
.o3{width:680px;height:680px;transform:translate(-50%,-50%) scaleY(.34);--t:58s}
.o4{width:900px;height:900px;transform:translate(-50%,-50%) scaleY(.34);--t:80s}
.node{
  position:absolute;left:50%;top:50%;
  width:0;height:0;
  animation:orbitSpin var(--t) linear infinite;
}
.node .dot{
  position:absolute;left:calc(var(--w) / -2 - 8px);top:-8px;
  width:16px;height:16px;border-radius:50%;
  background:var(--c);box-shadow:0 0 16px var(--c);
  transform:scaleY(2.94);
  cursor:pointer;
  transition:transform .25s, box-shadow .25s;
}
.node .dot:hover{transform:scaleY(2.94) scale(1.5);box-shadow:0 0 30px var(--c)}
.node .name{
  position:absolute;
  left:calc(var(--w) / -2 - 74px);top:6px;
  font-size:12px;letter-spacing:.3em;color:rgba(200,215,255,.75);
  animation:counterSpin var(--t) linear infinite;
  pointer-events:none;
}
@keyframes counterSpin{
  from{transform:scaleY(2.94) rotate(0)}
  to{transform:scaleY(2.94) rotate(-360deg)}
}
.n1{--t:26s;--w:300px;--c:#4de3ff}
.n2{--t:40s;--w:480px;--c:#ff5fb0}
.n3{--t:58s;--w:680px;--c:#7dffa0}
.n4{--t:80s;--w:900px;--c:#ffb454}

.hud{position:fixed;z-index:3;pointer-events:none;
  font-family:"Courier New",monospace;font-size:11px;letter-spacing:.24em;color:rgba(170,190,235,.6)}
.hud.tl{top:28px;left:32px}
.hud.tr{top:28px;right:32px;text-align:right}
.hud.bl{bottom:28px;left:32px}
.hud.br{bottom:28px;right:32px}
.title{
  position:fixed;left:50%;top:13%;transform:translateX(-50%);z-index:3;
  text-align:center;pointer-events:none;
}
.title h1{font-size:clamp(34px,4.6vw,56px);letter-spacing:.3em;font-weight:300;color:#eaf2ff;text-shadow:0 0 40px rgba(120,160,255,.4)}
.title p{font-family:"Courier New",monospace;font-size:11px;letter-spacing:.42em;color:rgba(170,190,235,.6);margin-top:12px}
.panel{
  position:fixed;left:50%;bottom:56px;transform:translateX(-50%) translateY(160px);z-index:3;
  min-width:340px;max-width:80vw;padding:22px 28px;border-radius:18px;
  background:rgba(10,14,34,.72);border:1px solid rgba(120,160,255,.28);
  backdrop-filter:blur(18px);
  transition:transform .5s cubic-bezier(.2,.8,.2,1);
}
.panel.show{transform:translateX(-50%) translateY(0)}
.panel h3{font-size:18px;letter-spacing:.2em;margin-bottom:8px}
.panel p{font-size:13px;line-height:1.8;color:rgba(200,215,255,.75)}
.panel .close{position:absolute;top:12px;right:16px;cursor:pointer;color:rgba(200,215,255,.5);font-family:"Courier New",monospace}
.hint{bottom:28px;right:32px}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="title">
  <h1>星 域</h1>
  <p>ORBIT · AGENT AS CELESTIAL BODY</p>
</div>
<div class="scene" id="scene">
  <div class="core"><span class="label">ORB-0</span></div>
  <div class="orbit o1"></div>
  <div class="orbit o2"></div>
  <div class="orbit o3"></div>
  <div class="orbit o4"></div>
  <div class="node n1" data-name="感知"><span class="dot" data-name="感知"></span><span class="name">感知 · PERCEIVE</span></div>
  <div class="node n2" data-name="研究"><span class="dot" data-name="研究"></span><span class="name">研究 · RESEARCH</span></div>
  <div class="node n3" data-name="创作"><span class="dot" data-name="创作"></span><span class="name">创作 · CREATE</span></div>
  <div class="node n4" data-name="执行"><span class="dot" data-name="执行"></span><span class="name">执行 · EXECUTE</span></div>
</div>
<div class="hud tl" id="coords">X 0000 · Y 0000</div>
<div class="hud tr" id="depth">深度 · 1.0 AU</div>
<div class="hud bl">ORBIT SYSTEM · 稳定轨道 4</div>
<div class="hud br hint">滚轮下潜 · 移动定轨 · 点击节点</div>
<div class="panel" id="panel">
  <span class="close" id="close">✕</span>
  <h3 id="pname"></h3>
  <p id="pdesc"></p>
</div>
<script>
const sc = document.getElementById('stars'), sx = sc.getContext('2d');
let SW, SH;
function rs(){ SW = sc.width = innerWidth; SH = sc.height = innerHeight; }
rs(); addEventListener('resize', rs);
const stars = Array.from({length: 240}, () => ({
  x: Math.random(), y: Math.random(), r: Math.random() * 1.4 + .3,
  z: Math.random() * .8 + .2, tw: Math.random() * Math.PI * 2
}));
let mx = 0, my = 0;
addEventListener('mousemove', e => { mx = (e.clientX / innerWidth - .5); my = (e.clientY / innerHeight - .5); });
(function drawStars(){
  sx.clearRect(0, 0, SW, SH);
  const t = Date.now() / 1000;
  for (const s of stars){
    const px = ((s.x + mx * s.z * .08 + 1) % 1) * SW;
    const py = ((s.y + my * s.z * .08 + 1) % 1) * SH;
    const a = .3 + .7 * (0.5 + Math.sin(t * 1.6 + s.tw) / 2);
    sx.fillStyle = `rgba(190,215,255,${a * s.z})`;
    sx.beginPath(); sx.arc(px, py, s.r, 0, 7); sx.fill();
  }
  requestAnimationFrame(drawStars);
})();

const scene = document.getElementById('scene');
const depthEl = document.getElementById('depth');
const coords = document.getElementById('coords');
let zoom = 1;
addEventListener('wheel', e => {
  e.preventDefault();
  zoom = Math.min(1.6, Math.max(.65, zoom - e.deltaY * 0.0012));
  scene.style.setProperty('--zoom', zoom);
  depthEl.textContent = '深度 · ' + zoom.toFixed(1) + ' AU';
}, {passive: false});
scene.addEventListener('mousemove', () => {
  coords.textContent = 'X ' + String(Math.round(mx * 180)).padStart(4, '0') + ' · Y ' + String(Math.round(my * 180)).padStart(4, '0');
});

const info = {
  '感知': '多模态输入处理：文本、图像、环境信号。实时建立对当前情境的理解。',
  '研究': '深度检索与推理：在文献与数据中航行，输出可验证的结论链。',
  '创作': '生成式内容生产：文字、图像、代码、音乐，全部从你的意图出发。',
  '执行': '工具调用与行动闭环：调度外部系统，完成任务并回报结果。'
};
const panel = document.getElementById('panel');
document.querySelectorAll('.node .dot').forEach(d => {
  d.addEventListener('click', () => {
    document.getElementById('pname').textContent = d.dataset.name + '模块';
    document.getElementById('pdesc').textContent = info[d.dataset.name];
    panel.classList.add('show');
  });
});
document.getElementById('close').addEventListener('click', () => panel.classList.remove('show'));
</script>
</body>
</html>
