<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent 35 · LEDGER AI 账房</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  overflow:hidden;
  font-family:Georgia,'Times New Roman','Songti SC',SimSun,serif;color:#33301f;
  background:
    repeating-linear-gradient(92deg,rgba(0,0,0,.13) 0 2px,transparent 2px 90px),
    linear-gradient(180deg,#4a3a28,#33261685,#2c2013);
}
.book{
  width:min(1180px,95vw);height:calc(100vh - 44px);margin:22px auto;
  background:
    repeating-linear-gradient(to bottom,transparent 0 35px,#e6e0d0 35px 36px),
    #fdfcf7;
  border:1px solid #d5cebb;
  box-shadow:0 22px 55px rgba(0,0,0,.55),inset 0 0 60px rgba(150,120,70,.07);
  padding:22px 34px 14px 34px;
  display:flex;flex-direction:column;position:relative;
}
.red-margin{position:absolute;top:0;bottom:0;left:114px;width:2px;background:#c0392b;opacity:.7;pointer-events:none}
/* ============ 表头 ============ */
.ledger-head{flex:none;display:flex;justify-content:space-between;align-items:flex-start;
  padding-bottom:12px;border-bottom:3px double #8a8060}
.ledger-head h1{font-size:25px;letter-spacing:.28em;font-weight:bold}
.lh-sub{font-size:11.5px;color:#8a8060;letter-spacing:.22em;margin-top:5px}
.lh-right{display:flex;align-items:center;gap:16px}
.lh-meta{text-align:right;font-family:'Courier New',monospace;font-size:12px;color:#5a5344;line-height:1.8}
.lh-meta b{font-family:Georgia,'Songti SC',serif;color:#33301f}
/* 算盘 */
#abacus .bead{transition:transform .25s ease}
#abacus.counting .bead.up{animation:beadUpJ .3s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes beadUpJ{to{transform:translateY(9px)}}
#abacus.counting .bead.dn{animation:beadDnJ .3s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes beadDnJ{to{transform:translateY(-9px)}}
#abacus .bead.blink{animation:beadBlink .5s ease}
@keyframes beadBlink{40%{transform:translateY(6px)}}
/* ============ 列头 ============ */
.cols-head{
  flex:none;display:grid;grid-template-columns:72px 150px 1fr 1.35fr;gap:18px;
  padding:8px 0 6px;border-bottom:2px solid #33301f;
  font-size:12px;letter-spacing:.3em;color:#33301f;font-weight:bold;
}
.cols-head span:nth-child(3){color:#b03a2e}
.cols-head span:nth-child(4){color:#1f3a93}
/* ============ 账目行 ============ */
.ledger-rows{flex:1;overflow-y:auto;min-height:0;padding:4px 0}
.ledger-rows::-webkit-scrollbar{width:8px}
.ledger-rows::-webkit-scrollbar-thumb{background:#c9c2ae;border-radius:4px}
.entry{
  display:grid;grid-template-columns:72px 150px 1fr 1.35fr;gap:18px;
  padding:8px 0;align-items:baseline;
  font-family:'Courier New',Consolas,monospace;font-size:13px;line-height:1.7;
  animation:entryIn .4s ease both;transition:background .25s;
}
.entry:hover{background:rgba(200,160,60,.07)}
@keyframes entryIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.e-date{color:#8a8471;font-size:12px}
.e-abs{color:#5a5344;font-size:12.5px;font-family:'Kaiti SC',KaiTi,serif;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.e-debit{color:#b03a2e;word-break:break-all}
.e-credit{color:#1f3a93;word-break:break-all}
.e-credit.pending{color:#9a927d;font-style:italic;animation:pulseSoft 1.1s ease-in-out infinite}
@keyframes pulseSoft{50%{opacity:.45}}
.num{color:#b03a2e;font-weight:bold;text-decoration:underline;
  text-decoration-color:#b03a2e;text-underline-offset:3px;animation:numIn .35s ease both}
@keyframes numIn{from{opacity:0;transform:scale(1.4)}to{opacity:1;transform:scale(1)}}
.dcursor{display:inline-block;width:8px;height:14px;background:#1f3a93;vertical-align:-2px;
  margin-left:2px;animation:blinkB .6s steps(1) infinite}
@keyframes blinkB{50%{opacity:0}}
/* ============ 余额 & 结算 ============ */
.balance-bar{flex:none;display:flex;align-items:center;gap:10px;margin-top:8px;
  padding:12px 4px 10px;border-top:1px solid #b8b09a}
.b-label{font-size:14px;letter-spacing:.3em;font-weight:bold}
.b-amt{font-family:'Courier New',monospace;font-size:26px;font-weight:bold;color:#8a1c12;min-width:150px}
.b-unit{font-size:13px;color:#5a5344}
.settle-btn{
  margin-left:auto;cursor:pointer;background:none;border:2px solid #8a1c12;color:#8a1c12;
  font-family:inherit;font-size:13px;letter-spacing:.24em;padding:7px 18px 7px 22px;
  border-radius:3px;transition:all .2s;
}
.settle-btn:hover{background:#8a1c12;color:#fdfcf7}
.hint{font-size:11.5px;color:#8a8060;font-family:'Kaiti SC',KaiTi,serif;letter-spacing:.1em;
  opacity:0;transition:opacity .4s}
.hint.show{opacity:1}
/* 结算区 */
.settle-zone{flex:none;position:relative;height:6px;overflow:visible;transition:height .5s ease}
.settle-zone.done{height:168px}
.rule-lines{position:absolute;left:6px;right:6px;top:22px}
.rule-lines i{display:block;height:3px;background:#c0392b;width:0;margin-bottom:8px;transition:width .8s ease}
.rule-lines i:last-child{height:2px}
.settle-zone.done .rule-lines i:first-child{width:100%}
.settle-zone.done .rule-lines i:last-child{width:100%;transition-delay:.2s}
.stamp{
  position:absolute;right:64px;top:36px;width:126px;height:126px;
  border:4px double #c0392b;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Songti SC',SimSun,serif;font-size:32px;font-weight:bold;color:#c0392b;
  letter-spacing:.12em;text-indent:.12em;
  transform:rotate(-12deg) scale(3);opacity:0;
  box-shadow:inset 0 0 16px rgba(192,57,43,.22);pointer-events:none;
}
.stamp::after{content:'AI 账 房 之 印';position:absolute;bottom:8px;font-size:8.5px;
  letter-spacing:.28em;opacity:.7;font-weight:normal}
.settle-zone.done .stamp{animation:stampIn .4s cubic-bezier(.2,1.8,.4,1) 1s forwards}
@keyframes stampIn{from{transform:rotate(-26deg) scale(3);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:.92}}
.book.shake{animation:bookShake .35s ease 1.22s}
@keyframes bookShake{
  0%,100%{transform:none}
  30%{transform:translate(2px,3px) rotate(.2deg)}
  60%{transform:translate(-2px,1px) rotate(-.15deg)}
}
/* ============ 记账输入行 ============ */
.entry-bar{
  flex:none;display:grid;grid-template-columns:72px 150px 1fr auto;gap:18px;align-items:center;
  padding:10px 0 8px;border-top:2px solid #33301f;
}
.c-date{font-family:'Courier New',monospace;font-size:12px;color:#8a8471}
.c-abs{font-size:12.5px;color:#5a5344;font-family:'Kaiti SC',KaiTi,serif;letter-spacing:.1em}
.entry-bar input{
  width:100%;border:none;border-bottom:1.5px solid #b8a97e;background:transparent;
  font-family:'Courier New',monospace;font-size:14px;color:#33301f;outline:none;
  padding:7px 2px;caret-color:#b03a2e;
}
.entry-bar input::placeholder{color:#b3ab94;font-family:'Kaiti SC',KaiTi,serif}
.entry-bar input:focus{border-bottom-color:#8a1c12}
.c-btn{
  cursor:pointer;background:#33301f;color:#fdfcf7;border:none;border-radius:3px;
  font-family:inherit;font-size:13.5px;letter-spacing:.3em;padding:9px 20px 9px 24px;
  transition:all .18s;box-shadow:0 3px 8px rgba(40,32,16,.35);
}
.c-btn:hover{background:#5a4d2e;transform:translateY(-1px)}
.c-btn:active{transform:translateY(1px)}
@media (max-width:960px){
  .entry,.cols-head{grid-template-columns:60px 90px 1fr 1.2fr;gap:10px}
  .entry-bar{grid-template-columns:60px 90px 1fr auto;gap:10px}
  .e-abs{display:none}.cols-head span:nth-child(2){display:none}.c-abs{display:none}
  .red-margin{left:92px}
  .book{padding:16px 18px 10px}
  .ledger-head h1{font-size:19px;letter-spacing:.16em}
}
</style>
</head>
<body>
<div class="book" id="book">
  <div class="red-margin"></div>
  <header class="ledger-head">
    <div>
      <h1>AI 账房 · 流水台账</h1>
      <div class="lh-sub">本号童叟无欺 · 概不赊账 · 灵感计两</div>
    </div>
    <div class="lh-right">
      <svg id="abacus" width="132" height="76" viewBox="0 0 132 76">
        <rect x="1.5" y="1.5" width="129" height="73" rx="6" fill="#8b5a2b" stroke="#5a3a18" stroke-width="2"/>
        <rect x="8" y="8" width="116" height="60" rx="3" fill="#f6ecd2" stroke="#a08040" stroke-width="1"/>
        <line x1="8" y1="31" x2="124" y2="31" stroke="#5a3a18" stroke-width="2.2"/>
      </svg>
      <div class="lh-meta">
        <div id="todayStr"></div>
        <div>第 <b id="pageNo">壹</b> 页</div>
      </div>
    </div>
  </header>

  <div class="cols-head">
    <span>日 期</span><span>摘 要</span><span>借方（客问）</span><span>贷方（号答）</span>
  </div>

  <main class="ledger-rows" id="rows"></main>

  <div class="balance-bar">
    <span class="b-label">灵感余额</span>
    <span class="b-amt" id="balance">1,024.00</span><span class="b-unit">两</span>
    <button class="settle-btn" id="settleBtn">结算闭卷</button>
    <span class="hint" id="hint"></span>
  </div>

  <div class="settle-zone" id="settleZone">
    <div class="rule-lines"><i></i><i></i></div>
    <div class="stamp">已结清</div>
  </div>

  <footer class="entry-bar">
    <span class="c-date" id="todayCell"></span>
    <span class="c-abs">灵感问询</span>
    <input id="qInput" placeholder="在下方空行落笔，向账房先生提问……" autocomplete="off">
    <button class="c-btn" id="sendBtn">落 笔</button>
  </footer>
</div>
<script>
const $=s=>document.querySelector(s);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const rows=$('#rows'), input=$('#qInput'), abacus=$('#abacus'), hintEl=$('#hint');

/* ============ 日期 ============ */
const today=new Date();
const P=n=>String(n).padStart(2,'0');
const dateStr=`${today.getFullYear()} 年 ${today.getMonth()+1} 月 ${today.getDate()} 日`;
$('#todayStr').textContent=dateStr;
$('#todayCell').textContent=`${P(today.getMonth()+1)}/${P(today.getDate())}`;

/* ============ 算盘（idle 偶动 / 思考拨动） ============ */
const beads=[];
(function buildAbacus(){
  const NS='http://www.w3.org/2000/svg';
  const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};
  [22,45,68,91,114].forEach((x,pi)=>{
    /* 上珠一颗：随机贴顶或贴梁 */
    const upY=Math.random()<.5?13.5:26;
    const up=mk('rect',{x:x-8,y:upY,width:16,height:10,rx:4,fill:'#b07a3e',stroke:'#6a4415','stroke-width':1.2,class:'bead up'});
    up.style.setProperty('--d',(Math.random()*.3).toFixed(2)+'s');
    abacus.appendChild(up);beads.push(up);
    /* 下珠两颗：随机分布 */
    const spots=[35,47,58.5];
    const pick=spots.sort(()=>Math.random()-.5).slice(0,2);
    pick.forEach(y=>{
      const dn=mk('rect',{x:x-8,y,width:16,height:10,rx:4,fill:'#c98d4d',stroke:'#6a4415','stroke-width':1.2,class:'bead dn'});
      dn.style.setProperty('--d',(Math.random()*.3).toFixed(2)+'s');
      abacus.appendChild(dn);beads.push(dn);
    });
  });
})();
/* idle：算珠偶尔轻碰 */
setInterval(()=>{
  if(busy)return;
  const b=beads[Math.floor(Math.random()*beads.length)];
  b.classList.remove('blink');void b.getBoundingClientRect();
  b.classList.add('blink');
  setTimeout(()=>b.classList.remove('blink'),600);
},4200);

/* ============ 回复数据（[[n]] = 红色下划线数字） ============ */
const REPLIES=[
 {delta:8.8,text:'客官此问，本号已拨珠三遍，核得明白——入账灵感[[8.8]]两。所问之事，依账房旧例：借方记"疑"，贷方记"明"，一借一贷，账目自平。他日携新问再来，柜上常备热茶，分文不取。'},
 {delta:12.6,text:'这笔账好算。贵客所问，市面行情约值灵感[[12.6]]两，本号念其诚恳，全数入账。答案已在贷方誊清，字字过秤，两两核讫，绝无短少。本号童叟无欺，[[300]]年口碑为证。'},
 {delta:6.4,text:'问得刁钻，账房喜欢。此问绕了三个弯，本号随它绕了三圈算盘，拨得珠响如雨。核讫：值灵感[[6.4]]两。谜底已录于贷方，附红笔圈点一处，请贵客过目，恕不赊账。'},
 {delta:-3.3,text:'实不相瞒：此问先前已有人问过，且付过账了。依本号规矩，重问照记，但灵感如数退还——故本笔反出[[3.3]]两，算是旧账余荫。答案照誊不误，童叟无欺。'},
 {delta:15.2,text:'贵客这一问，问在了行情的刀刃上。本号连夜翻了[[3]]本旧册，核出灵感[[15.2]]两，数目虽巨，来路干净。已在贷方立字为据，红笔数字，格外分明。'},
];
let replyIdx=0, busy=false, balanceVal=1024, settled=false, page=1;
const CN=['壹','贰','叁','肆','伍','陆','柒','捌','玖','拾'];

function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function hint(t){
  hintEl.textContent=t;hintEl.classList.add('show');
  setTimeout(()=>hintEl.classList.remove('show'),2200);
}
/* ============ 打字（打印式记账） ============ */
async function typeDebit(box,text){
  for(const ch of text){
    box.insertAdjacentText('beforeend',ch);
    rows.scrollTop=rows.scrollHeight;
    await wait(26+Math.random()*20);
  }
}
function parseTokens(t){
  const parts=[];const re=/\[\[(.+?)\]\]/g;let m,last=0;
  while((m=re.exec(t))){
    if(m.index>last)parts.push({t:t.slice(last,m.index)});
    parts.push({num:m[1]});
    last=m.index+m[0].length;
  }
  if(last<t.length)parts.push({t:t.slice(last)});
  return parts;
}
async function typeCredit(box,text){
  const cur=document.createElement('span');cur.className='dcursor';
  box.appendChild(cur);
  for(const p of parseTokens(text)){
    if(p.num!==undefined){
      const s=document.createElement('span');
      s.className='num';s.textContent=p.num;
      box.insertBefore(s,cur);
      rows.scrollTop=rows.scrollHeight;
      await wait(200);
    }else{
      for(const ch of p.t){
        cur.insertAdjacentText('beforebegin',ch);
        rows.scrollTop=rows.scrollHeight;
        let d=20+Math.random()*18;
        if('，、；：'.includes(ch))d+=90;
        if('。！？'.includes(ch))d+=210;
        await wait(d);
      }
    }
  }
  cur.remove();
}
/* ============ 余额滚动（标志性瞬间） ============ */
let balanceDisplay=1024;
function tweenBalance(to){
  const from=balanceDisplay;
  balanceVal=to;
  const elB=$('#balance');const t0=performance.now();const dur=950;
  (function f(t){
    const k=Math.min(1,(t-t0)/dur);
    const e=1-Math.pow(1-k,3);
    const v=from+(to-from)*e;
    elB.textContent=v.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
    if(k<1)requestAnimationFrame(f);
    else balanceDisplay=to;
  })(t0);
}
/* ============ 主流程 ============ */
async function onSend(){
  if(busy)return;
  const q=input.value.trim();
  if(!q)return;
  busy=true;input.value='';
  const r=REPLIES[replyIdx++%REPLIES.length];
  const entry=document.createElement('div');
  entry.className='entry';
  entry.innerHTML=`
    <span class="e-date">${P(today.getMonth()+1)}/${P(today.getDate())}</span>
    <span class="e-abs">${escapeHtml(q.length>7?q.slice(0,7)+'…':q)}</span>
    <span class="e-debit"></span>
    <span class="e-credit pending">计核中……</span>`;
  rows.appendChild(entry);
  rows.scrollTop=rows.scrollHeight;
  /* 借方先行记账 */
  await typeDebit(entry.querySelector('.e-debit'),q);
  await wait(250);
  /* 思考：算盘拨动 */
  abacus.classList.add('counting');
  await wait(1550+Math.random()*650);
  abacus.classList.remove('counting');
  /* 贷方记账 */
  const credit=entry.querySelector('.e-credit');
  credit.classList.remove('pending');credit.textContent='';
  await typeCredit(credit,r.text);
  /* 余额滚动 */
  tweenBalance(balanceVal+r.delta);
  await wait(300);
  busy=false;input.focus();
}
/* ============ 结算 / 开新页 ============ */
const settleZone=$('#settleZone'), settleBtn=$('#settleBtn'), book=$('#book');
settleBtn.addEventListener('click',()=>{
  if(!rows.children.length){hint('账上尚无一笔，急什么？');return}
  if(!settled){
    settled=true;
    settleZone.classList.add('done');
    book.classList.remove('shake');void book.offsetWidth;
    book.classList.add('shake');
    settleBtn.textContent='开新账页';
    hint('今日账目，两讫。慢走，客官。');
  }else{
    /* 开新账页 */
    rows.innerHTML='';
    settled=false;
    settleZone.classList.remove('done');
    settleBtn.textContent='结算闭卷';
    page++;
    $('#pageNo').textContent=CN[Math.min(page-1,9)];
    balanceVal=1024;tweenBalance(1024);
    hint('新账页已开，请落笔。');
  }
});
$('#sendBtn').addEventListener('click',onSend);
input.addEventListener('keydown',e=>{if(e.key==='Enter')onSend()});
input.focus();
</script>
</body>
</html>
