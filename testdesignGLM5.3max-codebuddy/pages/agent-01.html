<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CYGNUS · 天鹅座 — 深海探测智能体</title>
<style>
:root{--cyan:#5eead4;--violet:#a78bfa}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  overflow:hidden;
  background:linear-gradient(180deg,#020810 0%,#02101f 38%,#031b2e 72%,#052941 100%);
  color:#cdeee6;
  font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(1,6,12,.55) 100%)}
#sea{position:fixed;inset:0;z-index:0}
/* 顶部极慢微光 */
.godray{position:fixed;top:-14vh;left:50%;transform:translateX(-50%);width:150vmin;height:72vmin;
  pointer-events:none;z-index:1;
  background:radial-gradient(ellipse at 50% 0%,rgba(94,234,212,.08),transparent 62%);
  animation:ray 26s ease-in-out infinite alternate}
@keyframes ray{from{opacity:.4}to{opacity:1}}
header{position:fixed;top:36px;left:48px;z-index:6}
.brand{font-size:15px;letter-spacing:.55em;color:var(--cyan);text-shadow:0 0 18px rgba(94,234,212,.5)}
.brand em{display:block;font-style:normal;font-size:11px;letter-spacing:.4em;color:#3e6f77;margin-top:9px}
.meta{margin-top:14px;font-size:10.5px;letter-spacing:.22em;color:#41707d;font-family:Consolas,"Courier New",monospace}
.status{position:fixed;top:40px;right:48px;z-index:6;text-align:right;
  font-size:10px;letter-spacing:.3em;color:#52818c;font-family:Consolas,monospace}
.status .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cyan);
  margin-right:9px;vertical-align:1px;box-shadow:0 0 10px var(--cyan);
  animation:blink 3.4s ease-in-out infinite;transition:background .6s,box-shadow .6s}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
.status b{display:block;margin-top:8px;font-size:12px;font-weight:400;letter-spacing:.42em;color:#8fd8cc}
/* 深度标尺 */
.ruler{position:fixed;right:30px;top:50%;transform:translateY(-50%);height:50vh;z-index:2;
  display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;
  border-right:1px solid rgba(94,234,212,.16);padding-right:12px;pointer-events:none}
.ruler i{font-style:normal;font-size:9px;color:#2f5a64;font-family:Consolas,monospace;letter-spacing:.12em}
.sphere-label{position:fixed;left:50%;top:57.5%;transform:translateX(-50%);z-index:2;text-align:center;pointer-events:none}
.sphere-label .name{font-size:11.5px;letter-spacing:.62em;color:#67c8ba;text-indent:.62em}
.sphere-label .depth{margin-top:10px;font-size:10.5px;letter-spacing:.3em;color:#3f7480;font-family:Consolas,monospace}
/* 对话：气泡自球体下方浮起 */
#chat{position:fixed;left:50%;top:63%;transform:translateX(-50%);width:min(680px,88vw);
  z-index:5;text-align:center;pointer-events:none}
.msg{margin-bottom:24px;opacity:0;transform:translateY(36px) scale(.96);
  animation:bubup 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes bubup{to{opacity:1;transform:none}}
.msg.user{font-size:12.5px;color:#5b8b95;letter-spacing:.14em}
.msg.user::before{content:"◦ "}
.msg.ai{font-size:16.5px;line-height:2.05;color:#dcf8f1;text-shadow:0 2px 22px rgba(94,234,212,.28)}
.msg.ai span{opacity:0;display:inline-block;transform:translateY(9px);filter:brightness(2.4);
  transition:opacity .7s ease,transform .7s ease,filter 1.6s ease}
.msg.ai span.on{opacity:1;transform:none;filter:brightness(1)}
.msg.gone{animation:sink 1s ease forwards}
@keyframes sink{to{opacity:0;transform:translateY(-30px);filter:blur(5px)}}
#hint{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:5;
  font-size:10px;letter-spacing:.5em;color:#3a626d;text-indent:.5em;transition:opacity 1s;pointer-events:none}
/* 声呐胶囊输入条 */
#ask{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:8;
  display:flex;align-items:center;width:min(580px,90vw);height:58px;padding:0 8px 0 30px;
  border-radius:999px;background:rgba(6,26,40,.55);border:1px solid rgba(94,234,212,.22);
  box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 0 24px rgba(94,234,212,.05);
  backdrop-filter:blur(10px);transition:border-color .5s,box-shadow .5s}
#ask:focus-within{border-color:rgba(94,234,212,.6);
  box-shadow:0 18px 60px rgba(0,0,0,.55),0 0 36px rgba(94,234,212,.14),inset 0 0 28px rgba(94,234,212,.09)}
#ask input{flex:1;min-width:0;background:none;border:0;outline:0;color:#e6fffa;
  font:15px/1 "Songti SC","SimSun",serif;letter-spacing:.08em;caret-color:var(--cyan)}
#ask input::placeholder{color:#3e6f7a;letter-spacing:.22em}
#ask button{width:42px;height:42px;flex:none;border-radius:50%;
  border:1px solid rgba(94,234,212,.35);background:rgba(94,234,212,.08);cursor:pointer;
  display:grid;place-items:center;transition:background .4s,box-shadow .4s,transform .4s}
#ask button:hover{background:rgba(94,234,212,.2);box-shadow:0 0 18px rgba(94,234,212,.4);transform:translateY(-1px)}
#ask button svg{width:16px;height:16px;stroke:var(--cyan);fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
/* 两端声呐波纹 */
.end{position:relative;width:8px;height:8px;flex:none}
.end::before,.end::after{content:"";position:absolute;inset:0;border-radius:50%;
  border:1px solid var(--cyan);opacity:0}
#ask:focus-within .end::before{animation:sonar 2.2s ease-out infinite}
#ask:focus-within .end::after{animation:sonar 2.2s .8s ease-out infinite}
.end.left{margin-right:16px}.end.right{margin-left:12px}
@keyframes sonar{0%{transform:scale(.5);opacity:.9}100%{transform:scale(3.6);opacity:0}}
@media (max-width:720px){
  header{left:20px;top:20px}.status{right:20px;top:22px}.ruler{display:none}
  .msg.ai{font-size:14px}#chat{top:60%}
}
</style>
</head>
<body>
<canvas id="sea"></canvas>
<div class="godray"></div>

<header>
  <div class="brand">CYGNUS<em>天鹅座 · 深海探测智能体</em></div>
  <div class="meta">BIOLUMINESCENT ENGINE v3.2</div>
</header>

<div class="status"><span class="dot" id="dot"></span>DEEP LINK<b id="statusLab">深渊巡航中</b></div>

<aside class="ruler" aria-hidden="true"><i>0m</i><i>-1000</i><i>-2000</i><i>-3000</i><i>-4000</i><i>-5000</i></aside>

<div class="sphere-label">
  <div class="name">发 光 体 中 枢</div>
  <div class="depth" id="depthLab">DEPTH 4,267 M</div>
</div>

<main id="chat" aria-live="polite"></main>
<div id="hint">回车发送 · 与深渊对话</div>

<form id="ask" autocomplete="off">
  <div class="end left"></div>
  <input id="q" type="text" maxlength="60" placeholder="向深渊提问…">
  <button type="submit" aria-label="发送声呐"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  <div class="end right"></div>
</form>

<script>
'use strict';
const TAU=Math.PI*2;
const $=s=>document.querySelector(s);
const canvas=$('#sea'),ctx=canvas.getContext('2d');
const chat=$('#chat'),form=$('#ask'),input=$('#q');
const statusLab=$('#statusLab'),dot=$('#dot'),depthLab=$('#depthLab'),hint=$('#hint');

let W=0,H=0;
function resize(){
  const d=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  canvas.width=W*d;canvas.height=H*d;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(d,0,0,d,0,0);
}
addEventListener('resize',resize);resize();

/* 预渲染发光粒子贴图（青 / 紫罗兰） */
function sprite(r,g,b){
  const s=document.createElement('canvas');s.width=s.height=64;
  const c=s.getContext('2d');
  const gr=c.createRadialGradient(32,32,0,32,32,30);
  gr.addColorStop(0,`rgba(${r},${g},${b},1)`);
  gr.addColorStop(.28,`rgba(${r},${g},${b},.5)`);
  gr.addColorStop(1,`rgba(${r},${g},${b},0)`);
  c.fillStyle=gr;c.fillRect(0,0,64,64);
  return s;
}
const SP_CY=sprite(94,234,212),SP_VI=sprite(167,139,250);

/* 斐波那契球面粒子（950 个） */
const N=950,pts=[],GA=Math.PI*(3-Math.sqrt(5));
for(let i=0;i<N;i++){
  const y=1-2*i/(N-1),rad=Math.sqrt(Math.max(0,1-y*y)),th=GA*i;
  pts.push({x:Math.cos(th)*rad,y,z:Math.sin(th)*rad,tw:Math.random()*TAU,sp:.5+Math.random()});
}
/* 思考态连线：预计算近邻对 */
const pairs=[];
for(let i=0;i<N;i+=7){
  const a=pts[i],cd=[];
  for(let j=0;j<N;j++){
    if(j===i)continue;
    const b=pts[j];
    cd.push([(a.x-b.x)**2+(a.y-b.y)**2+(a.z-b.z)**2,j]);
  }
  cd.sort((u,v)=>u[0]-v[0]);
  pairs.push([i,cd[0][1]],[i,cd[1][1]]);
}

/* 浮游生物光点 */
const plank=[];
for(let i=0;i<64;i++){
  plank.push({x:Math.random(),y:Math.random(),s:.7+Math.random()*1.7,
    vx:(Math.random()-.5)*.01,vy:(Math.random()-.5)*.008,
    ph:Math.random()*TAU,sp:.4+Math.random()*.8});
}

const S={mode:'idle',think:0,rot:0,px:0,py:0,tx:0,ty:0,wave:null,ripple:0,flash:0,busy:false,t0:performance.now()};
addEventListener('mousemove',e=>{S.tx=(e.clientX/W-.5)*22;S.ty=(e.clientY/H-.5)*14;});

function setStatus(m){
  statusLab.textContent={idle:'深渊巡航中',send:'声呐发射',think:'解析回波中',reply:'回应上浮中'}[m];
  if(m==='think'){dot.style.background='#a78bfa';dot.style.boxShadow='0 0 10px #a78bfa';}
  else{dot.style.background='#5eead4';dot.style.boxShadow='0 0 10px #5eead4';}
}

/* 深度读数缓慢漂移（idle 呼吸感） */
let depth=4267;
setInterval(()=>{
  if(S.mode==='idle'){
    depth+=Math.round((Math.random()-.42)*6);
    depthLab.textContent='DEPTH '+depth.toLocaleString()+' M';
  }
},1600);

/* ---------- 对话 ---------- */
const REPLIES=[
  '深渊并非空无。在阳光止步的四千米之下，生命正用自己的光书写语言。你要找的答案，也许一直沉在你心里最深的地方，等一次下潜。',
  '声呐回波显示：你的问题像一颗石子，正坠向记忆的海沟。给我一点时间，我会潜下去把它捞上来——连同那些被遗忘的、发光的小东西。',
  '海底热泉的温度有三百八十度，但管虫依然在那里蓬勃生长。所以，是的：压力最大的地方，往往也是能量最集中的地方。',
  '我曾在海沟记录到一段持续十七秒的低频鸣叫，至今无法解释。有些问题的价值不在答案，而在于你愿意一直、一直听下去。',
  '潮汐被月球牵引，而你的思绪正被某件远方的事牵引着。放轻松，让问题像洋流一样流动，答案会在某个安静的湾口慢慢沉淀。'
];
let ri=0;

function trim(){
  if(chat.children.length>3){
    const el=chat.firstChild;
    el.classList.add('gone');
    setTimeout(()=>el.remove(),950);
  }
}
function addUser(t){
  const d=document.createElement('div');
  d.className='msg user';d.textContent=t;
  chat.appendChild(d);trim();
}
function addAI(t){
  const d=document.createElement('div');d.className='msg ai';
  const sp=[];
  for(const ch of t){const s=document.createElement('span');s.textContent=ch;d.appendChild(s);sp.push(s);}
  chat.appendChild(d);trim();
  sp.forEach((s,i)=>setTimeout(()=>s.classList.add('on'),140+i*46));
  return 140+t.length*46+800;
}

form.addEventListener('submit',e=>{
  e.preventDefault();
  const v=input.value.trim();
  if(!v||S.busy)return;
  S.busy=true;input.value='';hint.style.opacity='0';
  addUser(v);setStatus('send');
  /* 声呐波：从输入条向球体扩散 */
  const sc={x:W/2+S.px,y:H*.38+S.py},ic={x:W/2,y:H-73};
  const dist=Math.hypot(sc.x-ic.x,sc.y-ic.y);
  S.wave={r:0,cx:ic.x,cy:ic.y,max:dist+30,sp:(dist+30)/.8};
});

function waveArrived(){
  /* 标志性瞬间：球体接收声呐后泛起涟漪 */
  S.ripple=1;S.flash=1;
  S.mode='think';setStatus('think');
  setTimeout(()=>{
    S.mode='reply';setStatus('reply');
    const dur=addAI(REPLIES[ri++%REPLIES.length]);
    setTimeout(()=>{S.mode='idle';setStatus('idle');S.busy=false;},dur);
  },1600+Math.random()*1300);
}

/* ---------- 渲染循环 ---------- */
const SX=new Float32Array(N),SY=new Float32Array(N);
let last=performance.now();
function tick(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  const t=(now-S.t0)/1000;
  S.px+=(S.tx-S.px)*.03;S.py+=(S.ty-S.py)*.03;
  const thinkT=S.mode==='think'?1:0;
  S.think+=(thinkT-S.think)*Math.min(1,dt*3);
  S.rot+=dt*(.14+S.think*.55);
  ctx.clearRect(0,0,W,H);

  const cx=W/2+S.px,cy=H*.38+S.py,R=Math.min(W,H)*.165;
  const breath=Math.sin(t/6*TAU);          /* 6 秒呼吸周期 */
  const b=1+.062*breath;

  /* 浮游生物 */
  for(const p of plank){
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.x<-.02)p.x=1.02;if(p.x>1.02)p.x=-.02;
    if(p.y<-.02)p.y=1.02;if(p.y>1.02)p.y=-.02;
    const a=.14+.22*Math.abs(Math.sin(t*p.sp+p.ph));
    ctx.globalAlpha=a;ctx.fillStyle='#9defd9';
    ctx.beginPath();ctx.arc(p.x*W,p.y*H,p.s,0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;

  /* 球体环境光晕（青→紫罗兰混合） */
  const ga=.10+.05*breath+.07*S.think+.14*S.flash;
  let g=ctx.createRadialGradient(cx,cy,R*.15,cx,cy,R*2.4);
  g.addColorStop(0,`rgba(94,234,212,${ga*(1-S.think*.7)})`);
  g.addColorStop(.5,`rgba(94,234,212,${ga*.35*(1-S.think)})`);
  g.addColorStop(1,'rgba(94,234,212,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*2.4,0,TAU);ctx.fill();
  if(S.think>.02){
    g=ctx.createRadialGradient(cx,cy,R*.15,cx,cy,R*2.4);
    g.addColorStop(0,`rgba(167,139,250,${ga*S.think})`);
    g.addColorStop(.55,`rgba(167,139,250,${ga*.3*S.think})`);
    g.addColorStop(1,'rgba(167,139,250,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*2.4,0,TAU);ctx.fill();
  }

  /* 粒子球（旋转 + 呼吸 + 深度明暗） */
  const rot=S.rot,cos=Math.cos(rot),sin=Math.sin(rot);
  for(let i=0;i<N;i++){
    const p=pts[i];
    const x=p.x*cos-p.z*sin,z=p.x*sin+p.z*cos;
    SX[i]=cx+x*R*b;SY[i]=cy+p.y*R*b*.94;
    const dep=(z+1)/2;
    const size=(1.4+dep*3.2)*(1+S.flash*.4);
    const al=(.22+dep*.62)*(.75+.25*Math.sin(t*p.sp+p.tw))*(1+S.flash*1.2);
    const al2=Math.min(1,al);
    ctx.globalAlpha=al2*(1-S.think);
    ctx.drawImage(SP_CY,SX[i]-size*2,SY[i]-size*2,size*4,size*4);
    if(S.think>.01){
      ctx.globalAlpha=al2*S.think;
      ctx.drawImage(SP_VI,SX[i]-size*2,SY[i]-size*2,size*4,size*4);
    }
  }
  ctx.globalAlpha=1;

  /* 思考态：粒子间连线 */
  if(S.think>.02){
    ctx.strokeStyle=`rgba(167,139,250,${.3*S.think})`;
    ctx.lineWidth=.7;ctx.beginPath();
    for(const[i,j]of pairs){ctx.moveTo(SX[i],SY[i]);ctx.lineTo(SX[j],SY[j]);}
    ctx.stroke();
  }

  /* 涟漪（接收声呐后） */
  if(S.ripple>0){
    S.ripple=Math.max(0,S.ripple-dt*1.1);
    const rp=1-S.ripple;
    ctx.strokeStyle=`rgba(94,234,212,${.5*S.ripple})`;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(cx,cy,R*(1+rp*.5),0,TAU);ctx.stroke();
    ctx.strokeStyle=`rgba(167,139,250,${.35*S.ripple})`;
    ctx.beginPath();ctx.arc(cx,cy,R*(1+rp*1.1),0,TAU);ctx.stroke();
  }
  S.flash=Math.max(0,S.flash-dt*1.6);

  /* 声呐波 */
  if(S.wave){
    const wv=S.wave;wv.r+=wv.sp*dt;
    for(let k=0;k<3;k++){
      const rr=wv.r-k*26;
      if(rr>0){
        ctx.strokeStyle=`rgba(94,234,212,${(.5-k*.14)*Math.max(0,1-wv.r/wv.max)})`;
        ctx.lineWidth=1.2;ctx.beginPath();
        ctx.arc(wv.cx,wv.cy,rr,Math.PI*1.15,Math.PI*1.85);ctx.stroke();
      }
    }
    if(wv.r>=wv.max){S.wave=null;waveArrived();}
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
