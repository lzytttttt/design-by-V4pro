<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent 34 · CARTOGRAPHER 制图师</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  overflow:hidden;font-family:Georgia,'Times New Roman','Songti SC',SimSun,serif;color:#4a3a20;
  background:
    radial-gradient(rgba(120,96,66,.24) 1px,transparent 1.3px),
    repeating-linear-gradient(to right,rgba(120,96,66,.13) 0 1px,transparent 1px 96px),
    repeating-linear-gradient(to bottom,rgba(120,96,66,.13) 0 1px,transparent 1px 96px),
    #e8dfc8;
  background-size:20px 20px,auto,auto,auto;
}
svg.layer{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
/* 经纬标注 */
.coord-top{position:fixed;top:5px;left:0;right:0;height:16px;pointer-events:none}
.coord-left{position:fixed;left:6px;top:0;bottom:0;width:40px;pointer-events:none}
.coord-top span{position:absolute;top:0;transform:translateX(-50%);
  font-family:'Courier New',monospace;font-size:10px;color:#8b7355;letter-spacing:.05em}
.coord-left span{position:absolute;left:0;transform:translateY(-50%);
  font-family:'Courier New',monospace;font-size:10px;color:#8b7355;writing-mode:vertical-rl}
/* 罗盘 */
.compass{position:fixed;top:26px;right:26px;width:186px;height:186px;z-index:20;
  filter:drop-shadow(0 6px 14px rgba(80,60,30,.3))}
#needle{transform-box:view-box;transform-origin:50% 50%;
  animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.compass.thinking #needle{animation:spinNeedle .45s linear infinite}
@keyframes spinNeedle{to{transform:rotate(360deg)}}
.compass-txt{font-family:Georgia,'Times New Roman',serif;fill:#5a4632}
/* 比例尺 */
.scalebar{position:fixed;left:26px;bottom:24px;z-index:20}
/* 海域图腾 */
.sea-deco{position:fixed;z-index:12;pointer-events:none;text-align:center}
.sea-deco svg{display:block;margin:0 auto}
.sea-deco span{display:block;font-size:11px;font-style:italic;color:#8b7355;letter-spacing:.3em;margin-top:3px}
/* 地图元素 */
.pin-drop{animation:pinDrop .55s cubic-bezier(.3,1.6,.4,1) both}
@keyframes pinDrop{from{opacity:0;transform:translateY(-46px)}70%{opacity:1;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.label-in{animation:labelIn .8s ease both}
@keyframes labelIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.place-name{font:italic 600 17px Georgia,'Songti SC',SimSun,serif;fill:#5a4632}
.place-line{stroke:#8b7355;stroke-width:1}
.fog-clear{transition:opacity 1.1s ease}
/* ============ 航海日志 ============ */
.logbook{
  position:fixed;right:28px;bottom:28px;width:min(410px,92vw);max-height:62vh;z-index:30;
  display:flex;flex-direction:column;transform:rotate(.3deg);
  background:linear-gradient(160deg,#f6efdc,#efe4c6);
  border:1px solid #c9b98e;
  box-shadow:0 12px 34px rgba(60,40,10,.35),inset 0 0 46px rgba(150,120,70,.16);
  padding:15px 18px 11px;
}
.log-head{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:2px solid #a08a5a;padding-bottom:6px;margin-bottom:9px}
.log-title{font-size:15px;letter-spacing:.22em;font-weight:bold;color:#4a3a20}
.log-date{font-family:'Courier New',monospace;font-size:11px;color:#8b7355}
.log-entries{overflow-y:auto;flex:1;min-height:120px;
  font-family:'Kaiti SC',KaiTi,STKaiti,'FangSong',serif;font-size:13.5px;line-height:2.15;color:#4a3a24}
.log-entries::-webkit-scrollbar{width:6px}
.log-entries::-webkit-scrollbar-thumb{background:#c9b98e;border-radius:3px}
.log-entry{margin-bottom:11px;animation:entryIn .5s ease both}
@keyframes entryIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.le-date{font-family:'Courier New',monospace;font-size:10.5px;color:#8b7355;letter-spacing:.06em}
.le-q{color:#7c5a2e;margin:1px 0}
.le-q::before{content:'问：'}
.le-a{color:#4a3a24}
.le-a::before{content:'记：'}
.tcursor{display:inline-block;width:2px;height:1em;background:#7c5a2e;margin-left:1px;
  vertical-align:-2px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
/* 日志输入 */
.log-input{display:flex;gap:8px;align-items:center;border-top:1px dashed #b8a273;
  padding-top:9px;margin-top:4px}
.log-input label{flex:none;font-size:12px;color:#6b4f2e;font-family:'Kaiti SC',KaiTi,serif;letter-spacing:.08em}
.log-input input{flex:1;min-width:0;border:none;border-bottom:1px solid #a08a5a;background:transparent;
  font-family:'Kaiti SC',KaiTi,serif;font-size:13.5px;color:#4a3a24;outline:none;padding:3px 2px}
.log-input input::placeholder{color:#b3a685}
.log-input input:focus{border-bottom-color:#8b5e34}
.sail-btn{flex:none;cursor:pointer;background:#5a4632;color:#f6efdc;border:none;border-radius:3px;
  font-family:inherit;font-size:12.5px;letter-spacing:.24em;padding:7px 15px 7px 18px;
  transition:all .18s;box-shadow:0 3px 8px rgba(60,40,10,.3)}
.sail-btn:hover{background:#7c5a2e;transform:translateY(-1px)}
.sail-btn:active{transform:translateY(1px)}
/* 图上总标题 */
.map-brand{position:fixed;top:22px;left:28px;z-index:15;pointer-events:none}
.map-brand h1{font-size:21px;letter-spacing:.3em;color:#5a4632;font-weight:bold}
.map-brand small{display:block;font-size:10px;letter-spacing:.42em;color:#8b7355;margin-top:4px;
  font-family:'Courier New',monospace}
@media (max-width:900px){
  .compass{width:130px;height:130px;top:14px;right:14px}
  .logbook{right:12px;bottom:12px;left:12px;width:auto;max-height:48vh}
  .sea-deco{display:none}
}
</style>
</head>
<body>
<div class="map-brand"><h1>制 图 师</h1><small>CARTOGRAPHER · EXPLORATION CHART</small></div>

<div class="coord-top" id="coordTop"></div>
<div class="coord-left" id="coordLeft"></div>

<svg class="layer" id="trail" viewBox="0 0 1440 900" preserveAspectRatio="none">
  <defs>
    <radialGradient id="fogGrad">
      <stop offset="0%" stop-color="#e8dfc8" stop-opacity=".97"/>
      <stop offset="55%" stop-color="#e8dfc8" stop-opacity=".82"/>
      <stop offset="100%" stop-color="#e8dfc8" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>

<svg class="layer" viewBox="0 0 1440 900" preserveAspectRatio="none" style="z-index:11;opacity:.55">
  <g fill="none" stroke="#a08a5c" stroke-width="1">
    <path d="M 150 690 C 240 560 470 600 520 700 C 570 810 320 850 220 800 C 140 760 100 770 150 690 Z"/>
    <path d="M 230 660 C 300 590 430 620 470 690 C 510 770 330 800 260 770 C 200 745 180 720 230 660 Z"/>
    <path d="M 850 160 C 930 80 1120 100 1180 190 C 1240 290 1080 350 970 320 C 870 295 790 240 850 160 Z"/>
    <path d="M 920 180 C 970 120 1090 130 1130 200 C 1170 270 1060 310 980 290 C 905 270 870 240 920 180 Z"/>
    <path d="M 600 420 C 660 350 810 360 860 440 C 915 530 780 590 690 560 C 610 535 550 490 600 420 Z"/>
    <path d="M 660 445 C 700 395 800 400 835 455 C 870 520 770 560 700 540 C 640 522 615 495 660 445 Z"/>
    <path d="M 60 300 C 160 240 300 250 380 320 C 450 380 420 470 320 480 C 210 490 90 430 60 350 Z"/>
    <path d="M 100 1080 M 100 150 C 200 110 330 130 400 200"/>
    <path d="M 1050 700 C 1120 650 1240 660 1300 720 C 1360 780 1290 850 1190 840 C 1100 830 1030 770 1050 700 Z"/>
  </g>
</svg>

<svg class="compass" id="compass" viewBox="0 0 200 200"></svg>

<div class="sea-deco" style="top:190px;left:70px">
  <svg width="58" viewBox="0 0 60 50" fill="none" stroke="#8b7355" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 38 Q30 46 50 38 L46 32 L14 32 Z"/>
    <line x1="30" y1="32" x2="30" y2="6"/>
    <path d="M30 8 L46 28 L30 28 Z"/><path d="M28 10 L16 26 L28 26 Z"/>
    <path d="M4 44 q6 -5 12 0 t 12 0 t 12 0 t 12 0"/>
  </svg>
  <span>未知海域</span>
</div>
<div class="sea-deco" style="bottom:150px;left:300px">
  <svg width="66" viewBox="0 0 70 52" fill="none" stroke="#8b7355" stroke-width="1.6" stroke-linecap="round">
    <path d="M6 46 q7 -6 14 0 t 14 0 t 14 0 t 14 0"/>
    <path d="M6 40 q7 -6 14 0 t 14 0 t 14 0 t 14 0" opacity=".6"/>
    <path d="M42 44 C 42 30 56 32 56 20 C 56 10 48 10 46 15"/>
    <circle cx="45" cy="13" r="3.5"/><circle cx="46" cy="12" r=".8" fill="#8b7355"/>
  </svg>
  <span>海有巨怪</span>
</div>

<svg class="scalebar" width="230" height="48" viewBox="0 0 230 48">
  <g font-family="'Courier New',monospace" font-size="11" fill="#5a4632">
    <rect x="10" y="22" width="60" height="8" fill="#5a4632"/>
    <rect x="70" y="22" width="60" height="8" fill="#f6efdc" stroke="#5a4632" stroke-width="1.4"/>
    <rect x="130" y="22" width="60" height="8" fill="#5a4632"/>
    <rect x="190" y="22" width="2.5" height="8" fill="#5a4632"/>
    <text x="10" y="14">0</text><text x="40" y="14" text-anchor="middle">50</text>
    <text x="100" y="14" text-anchor="middle">100</text><text x="160" y="14" text-anchor="middle">150</text>
    <text x="212" y="14">里</text>
    <text x="10" y="44" font-size="9" fill="#8b7355" letter-spacing="2">SCALE OF ANSWERS</text>
  </g>
</svg>

<div class="logbook">
  <div class="log-head">
    <span class="log-title">航 海 日 志</span>
    <span class="log-date" id="logDate"></span>
  </div>
  <div class="log-entries" id="logEntries"></div>
  <div class="log-input">
    <label for="qInput">新航程登记</label>
    <input id="qInput" placeholder="写下你的问题，即刻启航……" autocomplete="off">
    <button class="sail-btn" id="sailBtn">启航</button>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const NS='http://www.w3.org/2000/svg';
const el=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};
const trail=$('#trail'), compass=$('#compass'), entries=$('#logEntries'), input=$('#qInput');

/* ============ 罗盘玫瑰 ============ */
function buildCompass(){
  const cx=100,cy=100;
  compass.appendChild(el('circle',{cx,cy,r:95,fill:'#f3ecd8',stroke:'#8b7355','stroke-width':2.5}));
  compass.appendChild(el('circle',{cx,cy,r:86,fill:'none',stroke:'#b8a273','stroke-width':1}));
  for(let i=0;i<32;i++){
    const a=i*11.25*Math.PI/180;
    const r1=i%4===0?76:i%2===0?80:83;
    compass.appendChild(el('line',{
      x1:cx+Math.cos(a)*r1,y1:cy+Math.sin(a)*r1,
      x2:cx+Math.cos(a)*89,y2:cy+Math.sin(a)*89,
      stroke:'#8b7355','stroke-width':i%4===0?1.6:.8}));
  }
  /* 16方位星：8长菱形 + 8短菱形 */
  for(let i=0;i<16;i++){
    const a=i*22.5*Math.PI/180;
    const long=i%2===0;
    const R1=long?70:48,R2=long?13:9;
    const g=el('g',{transform:`rotate(${i*22.5} ${cx} ${cy})`});
    g.appendChild(el('path',{
      d:`M ${cx} ${cy-R1} L ${cx+R2} ${cy} L ${cx} ${cy+R1} L ${cx-R2} ${cy} Z`,
      fill:long?(i%4===0?'#5a4632':'#a08a5c'):'#d8c9a8',
      stroke:'#5a4632','stroke-width':.9}));
    compass.appendChild(g);
  }
  const dirs=[['N',100,52],['E',152,104],['S',100,158],['W',48,104]];
  dirs.forEach(([t,x,y])=>{
    const tx=el('text',{x,y,'text-anchor':'middle',class:'compass-txt','font-size':15,'font-weight':'bold'});
    tx.textContent=t;compass.appendChild(tx);
  });
  const needleG=el('g',{id:'needleG'});
  const needle=el('g',{id:'needle'});
  needle.appendChild(el('path',{d:'M100 32 L108 100 L100 114 L92 100 Z',fill:'#c0392b',stroke:'#8f2318','stroke-width':1}));
  needle.appendChild(el('path',{d:'M100 168 L108 100 L100 86 L92 100 Z',fill:'#6b7b8c',stroke:'#4a5a6b','stroke-width':1}));
  needleG.appendChild(needle);
  compass.appendChild(needleG);
  compass.appendChild(el('circle',{cx,cy,r:6.5,fill:'#4a3a20',stroke:'#f3ecd8','stroke-width':2}));
}
/* ============ 经纬标注 ============ */
function buildCoords(){
  const top=$('#coordTop'),left=$('#coordLeft');
  for(let k=0;k<8;k++){
    const s=document.createElement('span');
    s.style.left=(96+192*k)+'px';
    s.textContent=(110+k)+'°E';
    top.appendChild(s);
    const s2=document.createElement('span');
    s2.style.top=(96+192*k)+'px';
    s2.textContent=(32-k)+'°N';
    left.appendChild(s2);
  }
}
/* ============ 探索数据 ============ */
const SPOTS=[
  [190,190],[360,130],[540,210],[720,150],[900,240],
  [1080,170],[250,400],[430,350],[620,440],[810,380],
  [960,300],[150,600],[330,560],[520,660],[700,600],
  [880,720],[1060,430],[280,790],[520,820],[740,840]
];
const REPLIES=[
 {place:'灵感海峡',log:'罗盘两度摇摆，终指东北。此问须渡灵感海峡——水面有光，深处有礁，礁名"想当然"，避之则安。已钉记于图上，名曰灵感海峡，供阁下他日重访。'},
 {place:'思路高原',log:'此问如登思路高原。海拔渐升，空气渐薄，寻常答案在此难以呼吸。幸得向导老到：先绕证据滩，再借逻辑山脉之风，方可登顶。图志已录，路径已绘。'},
 {place:'回声谷',log:'问出之后，四山皆有回声。回声谷中，同一个问题会折返七种答案，唯最迟归来的那一种最诚实。本航已候其归来，钉于谷口，谨录于志。'},
 {place:'隐喻群岛',log:'此问散若群岛，须以隐喻之舟次第探访。岛与岛之间水路曲折，然每一座岛上都立着半个答案。聚沙成塔，指日可待。航线已绘成虚线，望阁下勿偏离太远。'},
 {place:'结论海沟',log:'最深的答案住在结论海沟。下潜途中光线渐失，问题会变得越来越重——此乃常理，勿惧。本航已携灯火两盏：一盏照事实，一盏照自己。见底之日，即为归途。'},
];
let spotIdx=0, replyIdx=0, busy=false, prev={x:130,y:830};
/* ============ 地图操作 ============ */
function clearFog(x,y){
  const c=el('circle',{cx:x,cy:y,r:165,fill:'url(#fogGrad)',class:'fog-clear'});
  c.style.opacity=0;
  trail.appendChild(c);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{c.style.opacity=1}));
}
async function drawTrail(p1,p2){
  const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;
  const dx=p2.x-p1.x,dy=p2.y-p1.y;
  const len=Math.hypot(dx,dy)||1;
  const nx=-dy/len*Math.min(70,len*.3),ny=dx/len*Math.min(70,len*.3);
  const path=el('path',{
    d:`M ${p1.x} ${p1.y} Q ${mx+nx} ${my+ny} ${p2.x} ${p2.y}`,
    fill:'none',stroke:'#8b5e34','stroke-width':2.5,'stroke-linecap':'round'});
  trail.appendChild(path);
  const L=path.getTotalLength();
  path.style.strokeDasharray=L;
  path.style.strokeDashoffset=L;
  path.getBoundingClientRect();
  path.style.transition='stroke-dashoffset 1s ease';
  await wait(30);
  path.style.strokeDashoffset=0;
  await wait(1030);
  path.style.transition='none';
  path.style.strokeDasharray='8 7';
  path.style.strokeDashoffset=0;
}
function dropPin(x,y){
  const g=el('g',{transform:`translate(${x},${y})`});
  const inner=el('g',{class:'pin-drop'});
  inner.appendChild(el('line',{x1:0,y1:0,x2:0,y2:13,stroke:'#7a3020','stroke-width':2}));
  inner.appendChild(el('circle',{cx:0,cy:-7,r:9,fill:'#c0392b',stroke:'#8f2318','stroke-width':1.5}));
  inner.appendChild(el('circle',{cx:-3,cy:-10,r:2.4,fill:'rgba(255,255,255,.8)'}));
  g.appendChild(inner);
  trail.appendChild(g);
}
function placeLabel(x,y,name){
  const g=el('g',{transform:`translate(${x},${y})`});
  const inner=el('g',{class:'label-in'});
  const t=el('text',{x:0,y:-32,'text-anchor':'middle',class:'place-name'});
  t.textContent=name;
  inner.appendChild(t);
  inner.appendChild(el('line',{x1:-26,y1:-25,x2:26,y2:-25,class:'place-line'}));
  g.appendChild(inner);
  trail.appendChild(g);
}
/* ============ 日志 ============ */
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function newEntry(q){
  const e=document.createElement('div');
  e.className='log-entry';
  const d=new Date();
  const p=n=>String(n).padStart(2,'0');
  e.innerHTML=`<div class="le-date">${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} · 航行记录</div>
    <div class="le-q">${escapeHtml(q)}</div><div class="le-a"></div>`;
  entries.appendChild(e);
  entries.scrollTop=entries.scrollHeight;
  return e.querySelector('.le-a');
}
async function typeLog(box,text){
  const cur=document.createElement('span');cur.className='tcursor';
  box.appendChild(cur);
  for(const ch of text){
    cur.insertAdjacentText('beforebegin',ch);
    entries.scrollTop=entries.scrollHeight;
    let d=22+Math.random()*30;
    if('，；：、'.includes(ch))d+=110;
    if('。！？'.includes(ch))d+=230;
    await wait(d);
  }
  cur.remove();
}
/* ============ 罗盘思考 ============ */
async function compassThink(){
  compass.classList.add('thinking');
  await wait(1550+Math.random()*650);
  compass.classList.remove('thinking');
  const needle=$('#needle');
  const deg=Math.floor(Math.random()*360);
  needle.style.animation='none';
  needle.style.transition='transform .45s cubic-bezier(.3,1.3,.5,1)';
  needle.style.transform=`rotate(${deg}deg)`;
  await wait(650);
  return deg;
}
function compassIdle(){
  const needle=$('#needle');
  needle.style.transition='none';
  needle.style.animation='';
}
/* ============ 主流程 ============ */
async function onSend(){
  if(busy)return;
  const q=input.value.trim();
  if(!q)return;
  busy=true;input.value='';
  const aBox=newEntry(q);
  await wait(300);
  /* 思考：罗盘寻向 */
  await compassThink();
  /* 探索：迷雾散开 → 路径 → 图钉 → 地名 */
  const [x,y]=SPOTS[spotIdx++%SPOTS.length];
  const spot={x,y};
  const r=REPLIES[replyIdx++%REPLIES.length];
  clearFog(x,y);
  await wait(650);
  await drawTrail(prev,spot);
  dropPin(x,y);
  await wait(420);
  placeLabel(x,y,r.place);
  prev=spot;
  await wait(500);
  compassIdle();
  /* 日志流式写出 */
  await typeLog(aBox,r.log);
  busy=false;input.focus();
}
/* ============ 初始化 ============ */
buildCompass();
buildCoords();
const d=new Date();
$('#logDate').textContent=`${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日 · 晴 · 东南风`;
clearFog(prev.x,prev.y);
dropPin(prev.x,prev.y);
placeLabel(prev.x,prev.y,'启程港');
(async()=>{
  const e=document.createElement('div');
  e.className='log-entry';
  e.innerHTML=`<div class="le-date">启程日 · 晴 · 东南风</div><div class="le-a"></div>`;
  entries.appendChild(e);
  await typeLog(e.querySelector('.le-a'),'本船自启程港出发。罗盘已校，墨水已磨。图中虚线为已航之路，红针为已至之地。愿每一次提问，都驶向未名之域。');
})();
$('#sailBtn').addEventListener('click',onSend);
input.addEventListener('keydown',e=>{if(e.key==='Enter')onSend()});
input.focus();
</script>
</body>
</html>
