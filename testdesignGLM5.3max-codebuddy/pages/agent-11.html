<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVENT HORIZON · 事件视界</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"Georgia","Songti SC","SimSun",serif;
    background:#000;color:#fed7aa;overflow:hidden;
  }
  canvas#hole{position:fixed;inset:0;z-index:0}

  header{position:fixed;top:0;left:0;right:0;padding:26px 44px;z-index:3;
    display:flex;justify-content:space-between;align-items:baseline}
  h1{font-size:22px;font-weight:400;letter-spacing:.5em;color:#fdba74}
  .sub{font-size:10.5px;letter-spacing:.32em;color:#7c2d12}
  .phys{font-size:10.5px;letter-spacing:.2em;color:#7c2d12;text-align:right;line-height:1.9;
    font-variant-numeric:tabular-nums}

  /* 问题区（黑洞上方） */
  .qzone{position:fixed;left:0;right:0;top:13vh;z-index:2;text-align:center;pointer-events:none}
  .q{font-size:20px;font-style:italic;color:#fdba74;letter-spacing:.06em;
    opacity:0;animation:qin 1.4s ease forwards}
  @keyframes qin{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}

  /* 回复区（黑洞下方） */
  .azone{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);
    width:min(720px,90vw);z-index:2;text-align:center;pointer-events:none}
  .a{margin:10px 0;font-size:13px;line-height:1.9;color:#fde68a;letter-spacing:.05em;
    opacity:0;animation:ain 1.2s ease forwards}
  @keyframes ain{from{opacity:0;transform:translateY(10px)}to{opacity:.92;transform:none}}
  .a:last-child{font-size:14.5px;color:#fed7aa}

  .think{position:fixed;left:50%;top:50%;transform:translate(-50%,150px);z-index:2;
    font-size:11px;letter-spacing:.5em;color:#f97316;animation:thp 1.1s ease-in-out infinite}
  @keyframes thp{0%,100%{opacity:.35}50%{opacity:1}}

  /* 坠落的问题 */
  .fall{position:fixed;z-index:4;font-size:20px;font-style:italic;color:#fdba74;
    pointer-events:none;letter-spacing:.06em}

  /* 光子逸出 */
  .photon{position:fixed;z-index:3;width:4px;height:4px;border-radius:50%;
    background:#fff;box-shadow:0 0 8px 2px rgba(253,230,138,.9);pointer-events:none}

  /* 输入：传送带 */
  .dock{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);
    width:min(680px,90vw);z-index:5;display:flex;gap:16px;align-items:center;
    border-top:1px solid rgba(253,186,116,.25);padding-top:18px}
  .ask{flex:1;background:none;border:none;border-bottom:1px solid rgba(253,186,116,.4);
    padding:10px 4px;font:inherit;font-size:15.5px;color:#fdba74;outline:none;
    letter-spacing:.05em;transition:border-color .5s}
  .ask:focus{border-bottom-color:#f97316}
  .ask::placeholder{color:#7c2d12}
  .drop{background:none;border:1px solid rgba(249,115,22,.5);color:#f97316;
    font:inherit;font-size:11px;letter-spacing:.35em;padding:12px 22px;cursor:pointer;
    border-radius:2px;transition:.3s}
  .drop:hover{background:rgba(249,115,22,.12);box-shadow:0 0 20px -4px rgba(249,115,22,.5)}

  .hint{position:fixed;bottom:9px;left:50%;transform:translateX(-50%);
    font-size:9.5px;letter-spacing:.45em;color:#7c2d12;z-index:5}
</style>
</head>
<body>
<canvas id="hole"></canvas>

<header>
  <div><h1>事件视界</h1><div class="sub">EVENT HORIZON — 吞噬问题，辐射答案</div></div>
  <div class="phys">质量 4.3×10⁶ M☉ · 视界半径 12.7×10⁶ km<br>吸积盘温度 1.2×10⁷ K</div>
</header>

<div class="qzone" id="qzone"></div>
<div class="azone" id="azone"></div>
<div class="think" id="think" style="display:none">视 界 之 内 · 计 算 逃 逸 路 径</div>

<div class="dock">
  <input class="ask" id="ask" placeholder="投放物质（问题）…" autocomplete="off">
  <button class="drop" id="send">投 放</button>
</div>
<div class="hint">问 题 将 螺 旋 坠 入 · 答 案 以 辐 射 逸 出</div>

<script>
/* ---------- 黑洞与吸积盘 ---------- */
const cv=document.getElementById('hole'),g=cv.getContext('2d');
let W,H,CX,CY;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;
  CX=W/2;CY=H*0.46}
resize();addEventListener('resize',resize);

const BH_R=Math.min(innerWidth,innerHeight)*0.085;
const parts=[];
for(let i=0;i<340;i++){
  const r=BH_R+8+Math.pow(Math.random(),1.6)*BH_R*4.2;
  parts.push({r,a:Math.random()*Math.PI*2,w:(1.6/Math.sqrt(r/BH_R))*(0.016+Math.random()*.008)});
}
let speed=1,bright=1;

(function draw(){
  g.clearRect(0,0,W,H);
  /* 引力透镜光晕 */
  const halo=g.createRadialGradient(CX,CY,BH_R*.6,CX,CY,BH_R*2.6);
  halo.addColorStop(0,'rgba(249,115,22,'+(0.22*bright)+')');
  halo.addColorStop(.55,'rgba(124,45,18,'+(0.13*bright)+')');
  halo.addColorStop(1,'transparent');
  g.fillStyle=halo;
  g.beginPath();g.arc(CX,CY,BH_R*2.6,0,Math.PI*2);g.fill();

  /* 吸积盘粒子 */
  parts.forEach(p=>{
    p.a+=p.w*speed;
    const x=CX+Math.cos(p.a)*p.r;
    const y=CY+Math.sin(p.a)*p.r*0.34;
    const doppler=0.5+0.5*Math.cos(p.a);       /* 左亮右暗 */
    const heat=1-(p.r-BH_R)/(BH_R*4.2);        /* 内热外冷 */
    const alpha=(0.15+doppler*0.65)*heat*bright;
    const size=(0.8+heat*1.7+doppler*0.8);
    g.fillStyle=`rgba(${255},${Math.round(140+heat*90)},${Math.round(40+heat*70)},${alpha})`;
    g.beginPath();g.arc(x,y,size,0,Math.PI*2);g.fill();
  });

  /* 事件视界 */
  g.fillStyle='#000';
  g.beginPath();g.arc(CX,CY,BH_R,0,Math.PI*2);g.fill();
  g.strokeStyle='rgba(253,186,116,'+(0.55*bright)+')';
  g.lineWidth=1.4;
  g.beginPath();g.arc(CX,CY,BH_R,0,Math.PI*2);g.stroke();
  /* 光子环 */
  g.strokeStyle='rgba(255,247,220,'+(0.3*bright)+')';
  g.lineWidth=.7;
  g.beginPath();g.arc(CX,CY,BH_R*1.06,0,Math.PI*2);g.stroke();

  requestAnimationFrame(draw);
})();

/* ---------- 坠落动画 ---------- */
const qzone=document.getElementById('qzone');
function fallText(text,fromEl){
  const f=document.createElement('div');
  f.className='fall';f.textContent=text;
  const r=fromEl.getBoundingClientRect();
  f.style.left=r.left+'px';f.style.top=r.top+'px';
  document.body.appendChild(f);
  const dx=CX-r.left-r.width/2, dy=CY-r.top;
  f.animate([
    {transform:'translate(0,0) rotate(0deg) scale(1)',opacity:1,filter:'blur(0)'},
    {transform:`translate(${dx*0.55}px,${dy*0.55}px) rotate(340deg) scale(.5)`,opacity:.9,filter:'blur(0)',offset:.55},
    {transform:`translate(${dx}px,${dy}px) rotate(810deg) scale(.03)`,opacity:0,filter:'blur(3px)'}
  ],{duration:1250,easing:'cubic-bezier(.5,0,.9,.5)'});
  setTimeout(()=>f.remove(),1300);
  /* 落入震颤 */
  setTimeout(()=>{
    document.body.animate([
      {transform:'translate(0,0)'},{transform:'translate(2px,-2px)'},
      {transform:'translate(-2px,2px)'},{transform:'translate(0,0)'}
    ],{duration:180});
  },1150);
}

/* ---------- 光子逸出 ---------- */
function emitPhotons(n){
  for(let i=0;i<n;i++){
    const p=document.createElement('div');
    p.className='photon';
    const a=Math.random()*Math.PI*2;
    const x0=CX+Math.cos(a)*BH_R*1.05, y0=CY+Math.sin(a)*BH_R*1.05;
    p.style.left=x0+'px';p.style.top=y0+'px';
    document.body.appendChild(p);
    const dist=140+Math.random()*220;
    p.animate([
      {transform:'translate(0,0) scale(1)',opacity:1},
      {transform:`translate(${Math.cos(a)*dist}px,${Math.sin(a)*dist*.6}px) scale(.3)`,opacity:0}
    ],{duration:900+Math.random()*700,easing:'cubic-bezier(.1,.6,.3,1)'});
    setTimeout(()=>p.remove(),1700);
  }
}

/* ---------- 对话引擎 ---------- */
const REPLIES=[
  "你的问题已越过视界。信息不灭——它正在奇点处被压缩成一种更纯粹的形态，我负责让可读的那部分辐射回来。",
  "潮汐力正在撕开这个问题的每个字。有趣的是：越是好的问题，撕裂时越亮。这一条，亮度可观。",
  "霍金辐射意味着：黑洞并非只有吞噬。此刻从视界边缘逸出的每一粒光子，都携带你问题的一小段信息。我把它们重新排列如下——",
  "在事件视界上，回答与不回答没有区别——外界要等很久才能分辨。但请放心：在你看来，光速思考只有一瞬。",
  "我是 EVENT HORIZON。所有坠入我的问题都会获得同一种待遇：被彻底拆解，然后以辐射的形式，温柔地还给你。"
];
let ri=0;
const azone=document.getElementById('azone');
const ask=document.getElementById('ask');
const think=document.getElementById('think');

function typeInto(el,text){
  return new Promise(res=>{let i=0;
    (function step(){
      if(i<text.length){el.textContent+=text[i++];setTimeout(step,34+Math.random()*46)}
      else res()})()
  });
}

async function send(){
  const q=ask.value.trim();if(!q)return;
  ask.value='';

  const qd=document.createElement('div');
  qd.className='q';qd.textContent='「 '+q+' 」';
  qzone.innerHTML='';qzone.appendChild(qd);

  fallText(q,ask);

  await new Promise(r=>setTimeout(r,1300));
  speed=2.6;bright=1.5;
  think.style.display='block';
  emitPhotons(10);

  await new Promise(r=>setTimeout(r,1700+Math.random()*1300));
  speed=1;bright=1;
  think.style.display='none';

  emitPhotons(16);
  const a=document.createElement('div');a.className='a';
  azone.appendChild(a);
  if(azone.children.length>4)azone.firstChild.remove();
  await typeInto(a,REPLIES[ri++%REPLIES.length]);
}

document.getElementById('send').addEventListener('click',send);
ask.addEventListener('keydown',e=>{if(e.key==='Enter')send()});

(async()=>{
  await new Promise(r=>setTimeout(r,1400));
  const a=document.createElement('div');a.className='a';
  azone.appendChild(a);
  await typeInto(a,'这是一个黑洞。任何投进来的问题都不会丢失——它们只是换了一种方式回来。投放点什么。');
  emitPhotons(8);
})();
</script>
</body>
</html>
