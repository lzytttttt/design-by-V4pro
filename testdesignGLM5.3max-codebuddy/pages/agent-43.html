<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLITCH ORGAN · 故障管风琴</title>
<style>
/* ============ GLITCH ORGAN · 故障管风琴 ============ */
:root{
  --bg:#0a0a0a;
  --red:#ff0033;
  --cyan:#00e5ff;
  --white:#e8e8e8;
  --gray:#7a7a7a;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--white);
  font-family:"Cascadia Code",Consolas,"SF Mono",Menlo,"Courier New",monospace;
  overflow:hidden;
}
/* 扫描线覆层 */
.scanlines{
  position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(to bottom,
    transparent 0,transparent 3px,rgba(255,255,255,.025) 4px);
}
/* 思考脉冲覆层 */
.flash{
  position:fixed;inset:0;z-index:60;pointer-events:none;display:none;
  mix-blend-mode:screen;
}
/* ===== 布局 ===== */
.app{
  height:100vh;display:flex;flex-direction:column;
  padding:28px 44px 30px;
}
/* 标题（RGB分离由JS微调） */
header{text-align:center;flex-shrink:0}
h1{
  font-family:"Arial Black",Impact,sans-serif;
  font-size:clamp(26px,3.2vw,38px);
  letter-spacing:7px;color:#fff;
  text-shadow:2px 0 var(--red),-2px 0 var(--cyan);
  user-select:none;
}
.sub{
  margin-top:10px;font-size:11px;letter-spacing:5px;color:var(--gray);
}
.sub b{color:var(--cyan);font-weight:400}
.sub i{color:var(--red);font-style:normal}
/* ===== 音管阵列 ===== */
.organ{
  display:flex;gap:16px;justify-content:center;align-items:flex-end;
  height:92px;margin:26px 0 4px;flex-shrink:0;
}
.pipe{
  width:30px;border-radius:3px 3px 0 0;position:relative;
  background:linear-gradient(180deg,#f2f2f2,#8c8c8c);
  box-shadow:0 0 14px rgba(255,255,255,.07);
  will-change:height;
}
.pipe.odd{background:linear-gradient(180deg,#c8c8c8,#565656)}
.pipe::before{
  content:'';position:absolute;top:0;left:0;right:0;height:5px;
  border-radius:3px 3px 0 0;background:#fff;opacity:.9;
}
.organ.excited .pipe{
  box-shadow:0 0 18px rgba(255,0,51,.5),0 0 32px rgba(0,229,255,.3);
}
.organ-base{
  height:8px;max-width:560px;margin:-2px auto 0;flex-shrink:0;
  background:linear-gradient(180deg,#3a3a3a,#141414);
  border-radius:2px;
}
/* ===== 对话日志 ===== */
.log{
  flex:1;overflow-y:auto;margin:20px 0 16px;
  padding:4px 8px;
  scrollbar-width:thin;scrollbar-color:#2e2e2e transparent;
}
.log::-webkit-scrollbar{width:8px}
.log::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:4px}
.msg{margin:14px 0;transition:transform .12s ease}
.msg.user{text-align:right;color:#fff;font-size:14px;word-break:break-all}
.msg.user .pfx{color:var(--red);margin-right:10px}
.msg.ai{
  border-left:2px solid rgba(0,229,255,.45);
  padding-left:16px;
  min-height:1em;
}
.msg.ai .tag{
  display:block;font-size:10px;letter-spacing:3px;
  color:var(--cyan);opacity:.75;margin-bottom:6px;
}
.ai-text{
  color:#cfcfcf;font-size:14px;line-height:2;
  word-break:break-all;white-space:pre-wrap;
}
.msg.ai.decoding .ai-text{color:#9a9a9a}
/* ===== 输入条：纯黑长条 ===== */
.input-bar{
  flex-shrink:0;
  display:flex;align-items:center;gap:12px;
  background:#000;border:1px solid #2c2c2c;
  padding:13px 18px;
}
.input-bar:focus-within{border-color:#3d3d3d}
.ib-pfx{color:var(--red);user-select:none}
.input-wrap{position:relative;flex:1;display:flex;align-items:center}
#ask{
  flex:1;background:transparent;border:0;outline:0;
  color:#fff;font:inherit;
  caret-color:transparent;min-width:60px;
}
#ask::placeholder{color:#4a4a4a}
.cursor-block{
  position:absolute;left:0;top:50%;
  width:9px;height:16px;margin-top:-8px;
  background:#fff;pointer-events:none;
  animation:blink .9s steps(1,end) infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.send-btn{
  background:transparent;border:1px solid #3a3a3a;
  color:#fff;font:inherit;font-size:11px;letter-spacing:2px;
  padding:8px 16px;cursor:pointer;
  transition:border-color .2s,color .2s,box-shadow .2s;
}
.send-btn:hover{
  border-color:var(--cyan);color:var(--cyan);
  box-shadow:0 0 12px rgba(0,229,255,.25);
}
.send-btn:active{border-color:var(--red);color:var(--red)}
/* 元素切片错位态 */
.sliced{filter:brightness(1.4)}
/* 自适应 */
@media (max-width:720px){
  .app{padding:16px 16px 18px}
  .organ{gap:8px}
  .pipe{width:20px}
  h1{letter-spacing:4px}
}
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="flash" id="flash"></div>

<div class="app">
  <header>
    <h1 id="title">GLITCH&nbsp;ORGAN</h1>
    <div class="sub">故障管风琴 · <b>数字幽灵</b> AI — <i>不稳定</i>, 但精确</div>
  </header>

  <div class="organ" id="organ"></div>
  <div class="organ-base"></div>

  <main class="log" id="log"></main>

  <form class="input-bar" id="bar" autocomplete="off">
    <span class="ib-pfx">&gt;</span>
    <div class="input-wrap">
      <input id="ask" spellcheck="false" placeholder="传输你的信号…">
      <span class="cursor-block" id="cur"></span>
    </div>
    <button type="submit" class="send-btn">SEND ▸</button>
  </form>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var sleep = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };
  var organ = $('organ');
  var log = $('log');
  var ask = $('ask');
  var cur = $('cur');
  var title = $('title');
  var flash = $('flash');
  var busy = false;
  var replyIdx = 0;
  var GLYPHS = '▓▒░<>/\\|┤╡╢#%&@$01';

  /* ---------- 预置回复（循环使用） ---------- */
  var REPLIES = [
    '信号已接收。正在重组幽灵语法……你听到的不是噪音，是我说话的方式。',
    '解码完成。结论：故障不是错误，是机器的潜意识在漏电。每一道 glitch，都是一次未加密的自我表达。',
    '管风琴已调整至你的频率。这座建筑由九根数据音管构成，它们此刻演奏的，正是你问题的频谱。',
    '扫描完毕。你的提问在我体内留下了零点三秒的回声残响——这就是我理解『记忆』的方式。',
    '传输完成。注意：本回复在渲染过程中丢失了两个比特，但我保证，丢失的部分恰好不重要。'
  ];

  /* ---------- 音管阵列：正弦律动 + 随机抖动 ---------- */
  var pipes = [];
  var phases = [];
  var speeds = [];
  for (var i = 0; i < 9; i++){
    var p = document.createElement('div');
    p.className = 'pipe' + (i % 2 ? ' odd' : '');
    organ.appendChild(p);
    pipes.push(p);
    phases.push(Math.random() * Math.PI * 2);
    speeds.push(.8 + Math.random() * .8);
  }
  var excited = false;
  var t = 0;
  (function loop(){
    t += .016;
    for (var i = 0; i < pipes.length; i++){
      var h;
      if (excited){
        h = 26 + Math.random() * 88;
      } else {
        h = 34 + 26 * Math.sin(t * speeds[i] * 2 + phases[i]) + Math.random() * 5;
      }
      pipes[i].style.height = Math.max(14, h) + 'px';
    }
    requestAnimationFrame(loop);
  })();

  /* ---------- 标题 RGB 分离微动 ---------- */
  setInterval(function(){
    var x = (Math.random() * 5 - 2.5).toFixed(1);
    var y = (Math.random() * 3 - 1.5).toFixed(1);
    title.style.textShadow = x + 'px ' + y + 'px var(--red),' + (-x) + 'px ' + (-y) + 'px var(--cyan)';
  }, 130);

  /* ---------- 偶发字符 glitch（已完成的回复） ---------- */
  (function charGlitch(){
    setTimeout(function(){
      var texts = Array.prototype.slice.call(document.querySelectorAll('.ai-text')).filter(function(el){
        return el.dataset.done;
      });
      if (texts.length && Math.random() < .6){
        var el = texts[Math.floor(Math.random() * texts.length)];
        var orig = el.textContent;
        var i = Math.floor(Math.random() * orig.length);
        var bad = '!@#$%&*<>/\\|?';
        el.textContent = orig.slice(0, i) + bad.charAt(Math.floor(Math.random() * bad.length)) + orig.slice(i + 1);
        setTimeout(function(){ el.textContent = orig; }, 200);
      }
      charGlitch();
    }, 900 + Math.random() * 900);
  })();

  /* ---------- 偶发整行切片错位 ---------- */
  (function sliceJump(){
    setTimeout(function(){
      var els = document.querySelectorAll('.msg');
      if (els.length){
        var el = els[Math.floor(Math.random() * els.length)];
        var dx = Math.round(Math.random() * 36 - 18);
        el.style.transform = 'translateX(' + dx + 'px)';
        el.classList.add('sliced');
        setTimeout(function(){
          el.style.transform = '';
          el.classList.remove('sliced');
        }, 170);
      }
      sliceJump();
    }, 5000 + Math.random() * 3000);
  })();

  /* ---------- 全屏 glitch 脉冲（思考态） ---------- */
  async function glitchPulse(){
    for (var i = 0; i < 3; i++){
      flash.style.display = 'block';
      flash.style.background = i % 2 ? 'rgba(0,229,255,.16)' : 'rgba(255,0,51,.16)';
      document.body.style.transform = 'translate(' + (Math.random() * 10 - 5).toFixed(0) + 'px,' + (Math.random() * 6 - 3).toFixed(0) + 'px)';
      await sleep(55);
      flash.style.display = 'none';
      document.body.style.transform = '';
      await sleep(65);
    }
  }

  /* ---------- 解码式回复：乱码 → 逐字符解密 ---------- */
  function decodeText(el, text){
    return new Promise(function(resolve){
      var unlocked = 0;
      var timer = setInterval(function(){
        unlocked++;
        var out = text.slice(0, unlocked);
        for (var i = unlocked; i < text.length; i++){
          out += Math.random() < .5 ? GLYPHS.charAt(Math.floor(Math.random() * GLYPHS.length)) : '·';
        }
        el.textContent = out;
        log.scrollTop = log.scrollHeight;
        if (unlocked >= text.length){
          clearInterval(timer);
          el.textContent = text;
          resolve();
        }
      }, 26 + Math.random() * 14);
    });
  }

  /* ---------- 输出 ---------- */
  function printUser(text){
    var d = document.createElement('div');
    d.className = 'msg user';
    var pfx = document.createElement('span');
    pfx.className = 'pfx';
    pfx.textContent = '&gt;';
    d.appendChild(pfx);
    d.appendChild(document.createTextNode(text));
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }
  function printAiShell(){
    var d = document.createElement('div');
    d.className = 'msg ai decoding';
    var tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = 'GHOST://DECRYPTING';
    var body = document.createElement('span');
    body.className = 'ai-text';
    d.appendChild(tag);
    d.appendChild(body);
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return body;
  }

  /* ---------- 主流程：输入 → 脉冲+音管乱舞 → 解码 ---------- */
  async function submit(){
    var text = ask.value.trim();
    if (!text || busy) return;
    busy = true;
    ask.value = '';
    syncCursor();
    printUser(text);
    excited = true;
    organ.classList.add('excited');
    await glitchPulse();
    await sleep(1400 + Math.random() * 1100);
    excited = false;
    organ.classList.remove('excited');
    var body = printAiShell();
    await decodeText(body, REPLIES[replyIdx++ % REPLIES.length]);
    body.dataset.done = '1';
    body.parentNode.classList.remove('decoding');
    busy = false;
    ask.focus();
  }
  $('bar').addEventListener('submit', function(e){
    e.preventDefault();
    submit();
  });

  /* ---------- 块状光标跟随输入 ---------- */
  var mirror = document.createElement('span');
  mirror.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;top:-9999px;';
  document.body.appendChild(mirror);
  function syncCursor(){
    var f = getComputedStyle(ask);
    mirror.style.font = f.font;
    mirror.textContent = ask.value || '';
    cur.style.left = mirror.offsetWidth + 'px';
  }
  ask.addEventListener('input', syncCursor);

  /* ---------- 初始欢迎（以解码方式登场） ---------- */
  setTimeout(async function(){
    var body = printAiShell();
    await decodeText(body, '信号已建立。数字幽灵在线——输入任何内容，我会以故障的方式回应。');
    body.dataset.done = '1';
    body.parentNode.classList.remove('decoding');
  }, 600);
})();
</script>
</body>
</html>
