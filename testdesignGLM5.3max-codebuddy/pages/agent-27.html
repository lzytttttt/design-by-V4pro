<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLUEPRINT · 蓝图 — 架构规划</title>
<style>
/* ============================================================
   BLUEPRINT 「蓝图」— 工程制图美学
   蓝底白网格 · 等距机构 · 标注引线 · 修订栏 · 逐笔绘制
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --blue: #1e3a8a;
  --line: rgba(220, 232, 255, .92);
  --yellow: #fde047;
}

html, body { height: 100%; }

body {
  font-family: "Consolas", "Courier New", "Microsoft YaHei", "PingFang SC", monospace;
  background:
    repeating-linear-gradient(0deg,  rgba(255,255,255,.05) 0 1px, transparent 1px 24px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 24px),
    repeating-linear-gradient(0deg,  rgba(255,255,255,.11) 0 1px, transparent 1px 120px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.11) 0 1px, transparent 1px 120px),
    var(--blue);
  color: var(--line);
  overflow: hidden;
}

/* —— 图框（双线） —— */
.frame {
  position: fixed;
  inset: 14px;
  border: 2px solid rgba(230, 238, 255, .9);
  outline: 1px solid rgba(230, 238, 255, .55);
  outline-offset: 5px;
  display: flex;
  flex-direction: column;
  padding: 18px 26px 16px;
}

header {
  display: flex;
  align-items: baseline;
  gap: 16px;
  border-bottom: 1px solid rgba(230, 238, 255, .5);
  padding-bottom: 10px;
  flex-shrink: 0;
}
h1 {
  font-size: 22px;
  letter-spacing: .3em;
  font-weight: 700;
  color: #fff;
}
.sub {
  font-size: 12px;
  letter-spacing: .25em;
  opacity: .75;
}
#status {
  margin-left: auto;
  font-size: 12px;
  letter-spacing: .15em;
  color: var(--yellow);
  white-space: nowrap;
}
#status::before {
  content: '■ ';
  animation: statusBlink 2.6s steps(2) infinite;
}
@keyframes statusBlink { 50% { opacity: .25; } }

/* —— 工作区 —— */
.workbench {
  flex: 1;
  display: flex;
  gap: 26px;
  min-height: 0;
  padding-top: 16px;
}

.dialog-col {
  flex: 1.15;
  overflow-y: auto;
  padding-right: 8px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.4) transparent;
}

.figure-col {
  flex: 0 0 40%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 0;
}
#machine {
  width: 100%;
  max-width: 480px;
  height: auto;
  overflow: visible;
}
.figcap {
  font-size: 11px;
  letter-spacing: .2em;
  opacity: .65;
  margin-top: 10px;
}

/* 机构动画 */
.machine-float { animation: machineFloat 6.5s ease-in-out infinite; }
@keyframes machineFloat {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-5px); }
}
.gear-slow { animation: gearSpin 22s linear infinite; }
.gear-fast { animation: gearSpin 11s linear infinite; }
@keyframes gearSpin { to { transform: rotate(360deg); } }

body.thinking .gear-slow { animation-duration: 3.2s; }
body.thinking .gear-fast { animation-duration: 1.7s; }
body.thinking .machine-float { animation-duration: 1.8s; }

.dim { opacity: .55; }
body.thinking .dim { animation: dimBlink .5s steps(2, jump-none) infinite; }
@keyframes dimBlink { 50% { opacity: 1; } }

/* —— 对话：用户需求条 —— */
.req {
  max-width: 86%;
  margin: 14px 0;
  margin-left: auto;
  padding: 12px 16px;
  border: 1.5px solid rgba(253, 224, 71, .85);
  background: rgba(253, 224, 71, .10);
  color: #fef3c7;
  font-size: 14.5px;
  line-height: 1.75;
  position: relative;
}
.req::before {
  content: 'REQ';
  position: absolute;
  top: -9px; left: 10px;
  background: var(--blue);
  color: var(--yellow);
  font-size: 10px;
  letter-spacing: .25em;
  padding: 0 6px;
}

/* —— 对话：机器标注卡（图纸绘制过程） —— */
.anno {
  position: relative;
  max-width: 86%;
  margin: 18px 0;
  padding: 14px 130px 14px 18px; /* 右侧留给引线 */
  font-size: 14.5px;
  line-height: 1.8;
  color: #e8efff;
}
.anno-tag {
  display: inline-block;
  font-size: 10px;
  letter-spacing: .3em;
  color: var(--yellow);
  border: 1px solid rgba(253, 224, 71, .6);
  padding: 1px 8px 1px 10px;
  margin-bottom: 8px;
}
.anno-text .hl {
  color: var(--yellow);
  text-shadow: 0 0 8px rgba(253, 224, 71, .35);
}
.anno-border, .leader {
  position: absolute;
  pointer-events: none;
  overflow: visible;
}
.anno-border { inset: 0; }
.leader {
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
}
@keyframes drawLine { to { stroke-dashoffset: 0; } }

/* —— 底部信息带 —— */
.bottom-band {
  flex-shrink: 0;
  display: flex;
  align-items: stretch;
  gap: 18px;
  border-top: 1px solid rgba(230, 238, 255, .5);
  padding-top: 14px;
  margin-top: 8px;
}

/* 比例尺 */
.scalebar {
  flex: 0 0 175px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  font-size: 10px;
  letter-spacing: .12em;
  opacity: .85;
}
.sb-cells { display: flex; }
.sb-cells i {
  flex: 1;
  height: 9px;
  border: 1px solid rgba(230,238,255,.9);
}
.sb-cells i:nth-child(odd) { background: rgba(230,238,255,.9); }
.sb-cells i:nth-child(even) { background: transparent; }
.sb-labels { display: flex; justify-content: space-between; }

/* 修订栏输入 */
.revision {
  flex: 1;
  display: flex;
  align-items: stretch;
  border: 1.5px solid rgba(230, 238, 255, .85);
  min-width: 0;
}
.rev-cell {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  padding: 8px 14px;
  border-right: 1px solid rgba(230, 238, 255, .5);
  min-width: 0;
}
.rev-cell:last-of-type { border-right: none; }
.rev-cell > span {
  font-size: 9px;
  letter-spacing: .3em;
  opacity: .6;
}
.rev-cell b { font-size: 13px; color: #fff; font-weight: 700; }
.rev-desc { flex: 1; }
#input {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  border-bottom: 1px dashed rgba(230, 238, 255, .6);
  color: #fff;
  font-family: inherit;
  font-size: 14px;
  padding: 4px 2px;
}
#input::placeholder { color: rgba(230, 238, 255, .38); }
#input:focus { border-bottom-color: var(--yellow); }
#send {
  border: none;
  border-left: 1px solid rgba(230, 238, 255, .5);
  background: rgba(253, 224, 71, .14);
  color: var(--yellow);
  font-family: inherit;
  font-size: 13px;
  letter-spacing: .2em;
  padding: 0 20px;
  cursor: pointer;
  transition: background .2s;
  white-space: nowrap;
}
#send:hover { background: rgba(253, 224, 71, .28); }
#send:disabled { opacity: .4; cursor: default; }

/* 标题栏 */
.titleblock {
  flex: 0 0 265px;
  border: 1.5px solid rgba(230, 238, 255, .85);
  font-size: 10.5px;
  letter-spacing: .06em;
}
.titleblock .trow {
  display: flex;
  border-bottom: 1px solid rgba(230, 238, 255, .5);
}
.titleblock .trow:last-child { border-bottom: none; }
.titleblock .trow > div {
  flex: 1;
  padding: 5px 10px;
  border-right: 1px solid rgba(230, 238, 255, .5);
  display: flex;
  gap: 6px;
}
.titleblock .trow > div:last-child { border-right: none; }
.titleblock .k { opacity: .55; white-space: nowrap; }
.titleblock .v { color: #fff; }

/* —— 自适应 —— */
@media (max-width: 1000px) {
  .frame { inset: 8px; padding: 12px 14px; }
  .workbench { flex-direction: column; overflow-y: auto; }
  .figure-col { flex: 0 0 auto; order: -1; }
  #machine { max-width: 300px; }
  .dialog-col { overflow: visible; flex: none; }
  .bottom-band { flex-wrap: wrap; }
  .scalebar { display: none; }
  .titleblock { flex-basis: 100%; }
  .anno { padding-right: 70px; }
}
</style>
</head>
<body>

<div class="frame">
  <header>
    <h1>BLUEPRINT</h1>
    <span class="sub">蓝 图 · 架 构 规 划</span>
    <span id="status">图纸就绪</span>
  </header>

  <div class="workbench">
    <div class="dialog-col" id="chat" aria-live="polite"></div>

    <div class="figure-col">
      <svg id="machine" viewBox="0 0 460 400" aria-hidden="true"></svg>
      <div class="figcap">图 1 · 等距传动机构（对话驱动 · 比例 1:1）</div>
    </div>
  </div>

  <div class="bottom-band">
    <div class="scalebar">
      <div class="sb-cells"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="sb-labels"><span>0</span><span>1</span><span>2</span><span>3</span><span>4 m</span></div>
    </div>

    <div class="revision">
      <div class="rev-cell"><span>REV</span><b id="revNo">00</b></div>
      <div class="rev-cell rev-desc"><span>描述 DESCRIPTION</span><input id="input" type="text" placeholder="输入修订需求，回车提交……" autocomplete="off"></div>
      <div class="rev-cell"><span>日期 DATE</span><b id="dateStr">—</b></div>
      <button id="send">提交修订</button>
    </div>

    <div class="titleblock">
      <div class="trow">
        <div><span class="k">图号</span><span class="v">GLM-AI-027</span></div>
        <div><span class="k">名称</span><span class="v">AI NATIVE 蓝图</span></div>
      </div>
      <div class="trow">
        <div><span class="k">比例</span><span class="v">1 : 1</span></div>
        <div><span class="k">阶段</span><span class="v">对话中</span></div>
      </div>
      <div class="trow">
        <div><span class="k">绘制</span><span class="v">AGENT</span></div>
        <div><span class="k">校核</span><span class="v">——</span></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var chat = document.getElementById('chat');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var statusEl = document.getElementById('status');
  var revNoEl = document.getElementById('revNo');
  var machine = document.getElementById('machine');

  /* —— 预置回复：分段，hl 段以图纸黄高亮 —— */
  var REPLIES = [
    [
      { t: '收到需求。已完成结构拆解：该问题可分离为三个受力模块——' },
      { t: '目标层 · 约束层 · 执行层', hl: true },
      { t: '。建议自约束层切入，风险面积最小，受力路径已同步至右图机构。' }
    ],
    [
      { t: '复核完成，整体架构成立，但检测到两处应力集中：模块交界处缺乏缓冲。建议增设中间层，' },
      { t: '冗余度预计提升 22%', hl: true },
      { t: '，修改范围已用黄线在图面标出。' }
    ],
    [
      { t: '路线图规划完毕，分四期施工：一期地基、二期主体、三期管线、四期荷载测试。' },
      { t: '每期交付物已列入明细，比例 1:1，可直接开工', hl: true },
      { t: '。工期估算见右侧标注。' }
    ],
    [
      { t: '检测到需求变更，已生成修订单：对称结构调整为偏心结构，重心更稳。' },
      { t: '变更影响范围：仅立面，不触动基础', hl: true },
      { t: '。相关构件已在机构图中定位。' }
    ],
    [
      { t: '图纸上的每一条线都有存在的理由。你的方案里有一条线是多余的——删掉它，结构反而更干净。' },
      { t: '工程之美，在于克制', hl: true },
      { t: '。' }
    ]
  ];

  var replyIdx = 0;
  var busy = false;

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function scrollChat() { chat.scrollTop = chat.scrollHeight; }

  /* ================= 机构 SVG ================= */
  function el(name, attrs, parent) {
    var node = document.createElementNS(NS, name);
    for (var k in attrs) node.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(node);
    return node;
  }

  function gearInto(parent, r, teeth, cls) {
    /* 内层 g 以 (0,0) 为中心，rotate 即绕轴心 */
    var g = el('g', { 'class': cls }, parent);
    el('circle', { r: r, fill: 'none', stroke: '#fff', 'stroke-width': 1.3 }, g);
    el('circle', { r: r * 0.24, fill: 'none', stroke: '#fff', 'stroke-width': 1.2 }, g);
    for (var i = 0; i < teeth; i++) {
      var a = (i / teeth) * Math.PI * 2;
      var x1 = Math.cos(a) * r, y1 = Math.sin(a) * r;
      var x2 = Math.cos(a) * (r + 6), y2 = Math.sin(a) * (r + 6);
      el('line', { x1: x1, y1: y1, x2: x2, y2: y2, stroke: '#fff', 'stroke-width': 1.4 }, g);
      if (i % 2 === 0) {
        el('line', {
          x1: x1, y1: y1,
          x2: Math.cos(a) * r * 0.24, y2: Math.sin(a) * r * 0.24,
          stroke: '#fff', 'stroke-width': 0.6, opacity: 0.55
        }, g);
      }
    }
    return g;
  }

  function buildMachine() {
    var root = el('g', { 'class': 'machine-float' }, machine);

    /* —— 大立方体 u=88 @ (225,195) —— */
    var u = 88, dx = u * 0.866, dy = u * 0.5;
    var cx = 225, cy = 195;
    var A = [cx, cy - u], B = [cx + dx, cy - dy], C = [cx, cy], D = [cx - dx, cy - dy];
    var E = [cx + dx, cy + dy], F = [cx, cy + u], G = [cx - dx, cy + dy];
    var pts = function (p) { return p.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' '); };

    el('polygon', { points: pts([D, C, F, G]), fill: 'rgba(255,255,255,.05)' }, root);
    el('polygon', { points: pts([C, B, E, F]), fill: 'rgba(255,255,255,.14)' }, root);
    el('polygon', { points: pts([A, B, C, D]), fill: 'rgba(255,255,255,.22)' }, root);
    [pts([A, B, C, D]), pts([D, C, F, G]), pts([C, B, E, F])].forEach(function (p) {
      el('polygon', { points: p, fill: 'none', stroke: '#eef3ff', 'stroke-width': 1.6, 'stroke-linejoin': 'round' }, root);
    });

    /* —— 小立方体 u=44 @ (348,100) —— */
    var u2 = 44, dx2 = u2 * 0.866, dy2 = u2 * 0.5;
    var c2x = 348, c2y = 100;
    var A2 = [c2x, c2y - u2], B2 = [c2x + dx2, c2y - dy2], C2 = [c2x, c2y], D2 = [c2x - dx2, c2y - dy2];
    var E2 = [c2x + dx2, c2y + dy2], F2 = [c2x, c2y + u2], G2 = [c2x - dx2, c2y + dy2];
    el('polygon', { points: pts([D2, C2, F2, G2]), fill: 'rgba(255,255,255,.05)' }, root);
    el('polygon', { points: pts([C2, B2, E2, F2]), fill: 'rgba(255,255,255,.14)' }, root);
    el('polygon', { points: pts([A2, B2, C2, D2]), fill: 'rgba(255,255,255,.22)' }, root);
    [pts([A2, B2, C2, D2]), pts([D2, C2, F2, G2]), pts([C2, B2, E2, F2])].forEach(function (p) {
      el('polygon', { points: p, fill: 'none', stroke: '#eef3ff', 'stroke-width': 1.3, 'stroke-linejoin': 'round' }, root);
    });

    /* —— 传动连杆（虚线） —— */
    el('line', { x1: B[0], y1: B[1], x2: D2[0] + 6, y2: D2[1] + 6, stroke: '#eef3ff', 'stroke-width': 1, 'stroke-dasharray': '5 5', opacity: .7 }, root);

    /* —— 齿轮（左面 / 右面中心 + 小立方体顶面） —— */
    var leftC = [cx - dx * 0.5, cy + dy * 0.5];
    var rightC = [cx + dx * 0.5, cy + dy * 0.5];
    var gl = el('g', { transform: 'translate(' + leftC[0].toFixed(1) + ' ' + leftC[1].toFixed(1) + ')' }, root);
    gearInto(gl, 27, 10, 'gear-slow');
    var gr = el('g', { transform: 'translate(' + rightC[0].toFixed(1) + ' ' + rightC[1].toFixed(1) + ')' }, root);
    gearInto(gr, 20, 8, 'gear-fast');
    var gt = el('g', { transform: 'translate(' + c2x + ' ' + (c2y - dy2) + ')' }, root);
    gearInto(gt, 11, 6, 'gear-fast');

    /* —— 地面投影网格（虚线菱形） —— */
    el('polygon', {
      points: pts([[225, 268], [281, 284], [225, 316], [169, 284]]),
      fill: 'none', stroke: '#fff', 'stroke-width': 0.8,
      'stroke-dasharray': '4 5', opacity: .35
    }, root);
    el('polygon', {
      points: pts([[225, 286], [245, 295], [225, 304], [205, 295]]),
      fill: 'rgba(255,255,255,.06)', stroke: '#fff',
      'stroke-width': 0.6, opacity: .4
    }, root);

    /* —— 尺寸标注（黄色虚线，思考态闪烁） —— */
    var dimG = el('g', { 'class': 'dim' }, root);
    el('line', { x1: D[0] - 22, y1: A[1], x2: D[0] - 22, y2: F[1], stroke: '#fde047', 'stroke-width': 1, 'stroke-dasharray': '6 4' }, dimG);
    el('line', { x1: D[0] - 28, y1: A[1], x2: D[0] - 16, y2: A[1], stroke: '#fde047', 'stroke-width': 1 }, dimG);
    el('line', { x1: D[0] - 28, y1: F[1], x2: D[0] - 16, y2: F[1], stroke: '#fde047', 'stroke-width': 1 }, dimG);
    var t1 = el('text', { x: D[0] - 30, y: cy, fill: '#fde047', 'font-size': 10, 'text-anchor': 'end', transform: 'rotate(-90 ' + (D[0] - 30) + ' ' + cy + ')' }, dimG);
    t1.textContent = 'u = 88';
    el('line', { x1: D[0], y1: F[1] + 22, x2: E[0], y2: F[1] + 22, stroke: '#fde047', 'stroke-width': 1, 'stroke-dasharray': '6 4' }, dimG);
    el('line', { x1: D[0], y1: F[1] + 16, x2: D[0], y2: F[1] + 28, stroke: '#fde047', 'stroke-width': 1 }, dimG);
    el('line', { x1: E[0], y1: F[1] + 16, x2: E[0], y2: F[1] + 28, stroke: '#fde047', 'stroke-width': 1 }, dimG);
    var t2 = el('text', { x: (D[0] + E[0]) / 2, y: F[1] + 38, fill: '#fde047', 'font-size': 10, 'text-anchor': 'middle' }, dimG);
    t2.textContent = 'SCALE 1 : 1';
  }
  buildMachine();

  /* ================= 对话 ================= */
  function addRequest(text) {
    var req = document.createElement('div');
    req.className = 'req';
    req.textContent = text;
    chat.appendChild(req);
    scrollChat();
  }

  function drawPath(svg, d, color, width, dur, delay) {
    var path = el('path', { d: d, fill: 'none', stroke: color, 'stroke-width': width, 'stroke-linejoin': 'round' }, svg);
    var len = path.getTotalLength();
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    path.style.animation = 'drawLine ' + dur + 's ' + delay + 's ease-out forwards';
    return path;
  }

  async function drawAnnotation(segs) {
    /* 1. 建卡并预填文本测量终态高度（防止打字过程中卡片长高） */
    var anno = document.createElement('div');
    anno.className = 'anno';
    var tag = document.createElement('span');
    tag.className = 'anno-tag';
    tag.textContent = 'NOTE ' + String(replyIdx + 1).padStart(2, '0');
    var body = document.createElement('div');
    body.className = 'anno-text';
    segs.forEach(function (s) { body.textContent += s.t; });
    anno.appendChild(tag);
    anno.appendChild(body);
    chat.appendChild(anno);
    var w = anno.offsetWidth, h = anno.offsetHeight;
    anno.style.height = h + 'px';
    body.textContent = '';

    /* 2. 边框逐笔画出 */
    var border = document.createElementNS(NS, 'svg');
    border.setAttribute('class', 'anno-border');
    border.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    border.setAttribute('width', w); border.setAttribute('height', h);
    anno.appendChild(border);
    drawPath(border,
      'M 1,1 H ' + (w - 1) + ' V ' + (h - 1) + ' H 1 Z',
      'rgba(230,238,255,.9)', 1.5, 1.1, 0);

    /* 3. 引线（起点圆点 + 折线 + 箭头，指向右侧机构） */
    var lead = document.createElementNS(NS, 'svg');
    lead.setAttribute('class', 'leader');
    lead.setAttribute('width', 104); lead.setAttribute('height', 48);
    lead.setAttribute('viewBox', '0 0 104 48');
    anno.appendChild(lead);
    el('circle', { cx: 6, cy: 24, r: 2.6, fill: '#eef3ff' }, lead);
    drawPath(lead, 'M 6,24 L 66,24 L 96,12', 'rgba(230,238,255,.9)', 1, 0.7, 0.55);
    drawPath(lead, 'M 96,12 L 87,18 M 96,12 L 90,21', 'rgba(230,238,255,.9)', 1.2, 0.3, 1.1);

    scrollChat();

    /* 4. 打字机正文 */
    await wait(1150);
    for (var i = 0; i < segs.length; i++) {
      var seg = segs[i];
      var span = document.createElement('span');
      if (seg.hl) span.className = 'hl';
      body.appendChild(span);
      for (var c = 0; c < seg.t.length; c++) {
        span.textContent += seg.t[c];
        if (c % 3 === 0) scrollChat();
        await wait(26);
      }
    }
    scrollChat();
  }

  async function respond() {
    busy = true;
    sendBtn.disabled = true;
    statusEl.textContent = '机构运转中';
    document.body.classList.add('thinking');
    await wait(1700 + Math.random() * 1000);
    document.body.classList.remove('thinking');
    statusEl.textContent = '绘制输出中';

    var segs = REPLIES[replyIdx % REPLIES.length];
    replyIdx++;
    await drawAnnotation(segs);

    statusEl.textContent = '图纸就绪';
    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }

  function submit() {
    var text = input.value.trim();
    if (!text || busy) return;
    input.value = '';
    revNoEl.textContent = String(replyIdx + 1).padStart(2, '0');
    addRequest(text);
    respond();
  }

  sendBtn.addEventListener('click', submit);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submit();
  });

  /* 日期 */
  var now = new Date();
  document.getElementById('dateStr').textContent =
    now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');

  /* —— 图纸展开：首条标注 —— */
  setTimeout(function () {
    statusEl.textContent = '绘制输出中';
    drawAnnotation([
      { t: '图纸 GLM-AI-027 已展开。本图为对话底稿：你提出需求，我出具结构。' },
      { t: '全部内容按 1:1 绘制，可直接施工', hl: true },
      { t: '。请在下方修订栏提交你的第一条描述。' }
    ]).then(function () { statusEl.textContent = '图纸就绪'; });
  }, 1100);
})();
</script>
</body>
</html>
