<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TERRAZZO 水磨石 · 米兰设计AI</title>
<style>
:root{
  --cream:#f5f0e8;
  --rust:#c2410c;
  --mustard:#d9a404;
  --black:#000;
  --heavy:"Arial Black","Arial Bold",Impact,"Microsoft YaHei","PingFang SC",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--cream);
  font-family:var(--heavy);
  color:var(--black);
  overflow:hidden;
  position:relative;
}

/* ============ 水磨石颗粒 ============ */
.grain{
  position:fixed;inset:0;z-index:30;pointer-events:none;
  background-image:
    radial-gradient(circle,rgba(194,65,12,.42) 1.7px,transparent 2.4px),
    radial-gradient(circle,rgba(0,0,0,.30) 1.1px,transparent 1.8px),
    radial-gradient(circle,rgba(217,164,4,.45) 1.5px,transparent 2.2px),
    radial-gradient(circle,rgba(120,80,60,.26) 1.3px,transparent 2px),
    radial-gradient(circle,rgba(255,255,255,.95) 1.4px,transparent 2.1px),
    radial-gradient(circle,rgba(60,90,120,.2) 1.1px,transparent 1.8px);
  background-size:
    170px 150px,
    96px 112px,
    200px 175px,
    72px 84px,
    128px 138px,
    150px 120px;
  background-position:
    8px 12px,
    42px 62px,
    78px 26px,
    20px 47px,
    58px 92px,
    90px 35px;
}

/* ============ 背景几何色块 ============ */
.shapes{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.sh{position:absolute}
.sh-rect-rust{
  width:460px;height:340px;right:-90px;top:-110px;
  background:var(--rust);
  transform:rotate(10deg);
  border:4px solid var(--black);
}
.sh-circle-black{
  width:300px;height:300px;left:-120px;bottom:-90px;
  background:var(--black);
  border-radius:50%;
}
.sh-circle-mustard{
  width:190px;height:190px;left:34%;top:-70px;
  background:var(--mustard);
  border-radius:50%;
  border:4px solid var(--black);
}
.sh-bar-rust{
  width:220px;height:56px;left:-40px;top:44%;
  background:var(--rust);
  transform:rotate(-8deg);
  border:3px solid var(--black);
}
.sh-tri{
  width:0;height:0;right:16%;bottom:14%;
  border-left:44px solid transparent;
  border-right:44px solid transparent;
  border-bottom:76px solid var(--mustard);
  transform:rotate(14deg);
}
.sh-dots{
  width:150px;height:70px;right:6%;top:52%;
  background-image:radial-gradient(circle,var(--black) 5px,transparent 6px);
  background-size:38px 38px;
  transform:rotate(-6deg);
  opacity:.85;
}
.sh-ring{
  width:110px;height:110px;left:13%;bottom:20%;
  border:10px solid var(--rust);
  border-radius:50%;
  transform:rotate(0deg);
}

/* ============ 主结构 ============ */
.app{
  position:relative;z-index:10;height:100%;
  display:flex;flex-direction:column;
  padding:34px clamp(20px,5vw,64px) 26px;
}

/* ---------- 头部 ---------- */
.header{
  flex:none;
  display:flex;align-items:flex-end;gap:26px;
  margin-bottom:18px;
  animation:drop-in .6s cubic-bezier(.3,1.5,.5,1) both;
}
@keyframes drop-in{
  from{opacity:0;transform:translateY(-26px) rotate(-2deg)}
  to{opacity:1;transform:none}
}
.mega{
  font-size:clamp(64px,8.5vw,118px);
  font-weight:900;line-height:.92;
  letter-spacing:-3px;
}
.mega .hollow{
  color:transparent;
  -webkit-text-stroke:3.5px var(--black);
  text-stroke:3.5px var(--black);
}
.header-side{
  display:flex;flex-direction:column;gap:10px;
  padding-bottom:10px;
}
.sticker-label{
  display:inline-block;
  background:var(--mustard);
  border:3px solid var(--black);
  border-radius:14px 4px 16px 6px;
  box-shadow:6px 6px 0 var(--black);
  padding:8px 18px;
  font-size:22px;font-weight:900;
  transform:rotate(-4deg);
  white-space:nowrap;
}
.tagline{
  font-size:14px;font-weight:900;
  letter-spacing:1px;
  transform:rotate(1.5deg);
  background:var(--cream);
  display:inline-block;
  padding:4px 10px;
  border:2.5px solid var(--black);
  border-radius:4px 12px 4px 12px;
}
.star{
  position:absolute;
  font-size:40px;
  top:22px;right:24px;
  transform:rotate(12deg);
  animation:star-spin 9s linear infinite;
}
@keyframes star-spin{to{transform:rotate(372deg)}}

/* ---------- 贴纸板 ---------- */
.board{
  flex:1;overflow-y:auto;
  display:flex;flex-direction:column;gap:18px;
  padding:10px 6px 18px;
  scrollbar-width:none;
}
.board::-webkit-scrollbar{display:none}

.sticker{
  position:relative;
  border:3px solid var(--black);
  box-shadow:8px 8px 0 var(--black);
  padding:14px 22px;
  font-size:17px;font-weight:900;
  line-height:1.75;
  max-width:min(560px,86%);
  letter-spacing:.5px;
  transform:rotate(var(--rot,0deg));
  animation:slap .5s cubic-bezier(.25,1.4,.45,1) both;
}
@keyframes slap{
  0%{transform:scale(1.65) rotate(var(--rot,0deg));opacity:0}
  55%{transform:scale(.92) rotate(var(--rot,0deg));opacity:1}
  100%{transform:scale(1) rotate(var(--rot,0deg));opacity:1}
}
.sticker.user{
  align-self:flex-end;
  background:#fff;
  border-radius:6px 22px 6px 18px;
  font-size:15.5px;
}
.sticker.user .pin{
  position:absolute;right:16px;top:-11px;
  width:20px;height:20px;border-radius:50%;
  background:var(--rust);
  border:2.5px solid var(--black);
  box-shadow:2px 2px 0 var(--black);
}
.sticker.ai{align-self:flex-start}
.sticker.c-white{background:#fff;border-radius:20px 8px 16px 10px}
.sticker.c-mustard{background:var(--mustard);border-radius:10px 22px 8px 18px}
.sticker.c-peach{background:#fbddc9;border-radius:18px 6px 20px 8px}
.sticker.c-cream{background:#faf0c8;border-radius:8px 18px 6px 22px}
.sticker .sticker-name{
  display:block;font-size:10.5px;letter-spacing:2px;
  margin-bottom:4px;opacity:.75;
}
/* 图钉（AI 贴纸） */
.sticker.ai .pin{
  position:absolute;left:18px;top:-11px;
  width:20px;height:20px;border-radius:50%;
  background:var(--black);
  border:2.5px solid var(--black);
  box-shadow:2px 2px 0 rgba(0,0,0,.35);
  z-index:2;
}
.sticker.ai .pin::after{
  content:"";position:absolute;left:6px;top:6px;
  width:6px;height:6px;border-radius:50%;
  background:rgba(255,255,255,.7);
}

/* 思考贴纸 */
.think-sticker{
  align-self:flex-start;
  background:var(--black);
  color:var(--cream);
  border:3px solid var(--black);
  border-radius:16px 6px 14px 8px;
  box-shadow:8px 8px 0 rgba(0,0,0,.35);
  padding:14px 22px;
  display:flex;align-items:center;gap:16px;
  transform:rotate(-1.5deg);
  animation:slap .5s cubic-bezier(.25,1.4,.45,1) both;
}
.think-sticker span{font-size:15px;letter-spacing:3px}
.cubes{display:flex;gap:9px;align-items:flex-end;height:30px}
.cube{
  width:21px;height:21px;
  border:2.5px solid var(--cream);
}
.cube.k{background:var(--cream);border-color:var(--cream);animation:hop .62s ease infinite}
.cube.r{background:var(--rust);animation:hop .62s ease .18s infinite}
.cube.y{background:var(--mustard);animation:hop .62s ease .36s infinite}
@keyframes hop{
  0%,100%{transform:translateY(0) scaleY(1)}
  42%{transform:translateY(-15px) scaleY(1.14)}
  58%{transform:translateY(1px) scaleY(.82)}
  75%{transform:translateY(-4px) scaleY(1)}
}

/* ---------- 输入行 ---------- */
.input-row{
  flex:none;
  display:flex;gap:18px;align-items:stretch;
  margin-top:8px;
}
.big-input{
  flex:1;
  background:#fff;
  border:3.5px solid var(--black);
  border-radius:16px 6px 16px 6px;
  outline:none;
  font-family:var(--heavy);
  font-size:18px;font-weight:900;
  padding:16px 22px;
  color:var(--black);
  letter-spacing:1px;
  box-shadow:6px 6px 0 var(--black);
  transition:box-shadow .08s,transform .08s;
}
.big-input:focus{
  box-shadow:2px 2px 0 var(--black);
  transform:translate(4px,4px);
}
.big-input::placeholder{color:#b3a894;letter-spacing:2px}
.big-btn{
  flex:none;
  background:var(--black);
  color:var(--cream);
  font-family:var(--heavy);
  font-size:20px;font-weight:900;
  letter-spacing:4px;
  border:3.5px solid var(--black);
  border-radius:6px 18px 6px 18px;
  padding:0 34px;
  cursor:pointer;
  box-shadow:8px 8px 0 var(--black);
  transition:transform .08s,box-shadow .08s,opacity .3s;
}
.big-btn:hover{background:#1c1c1c}
.big-btn:active{
  transform:translate(8px,8px);
  box-shadow:0 0 0 var(--black);
}
.big-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:8px 8px 0 var(--black)}

/* ============ 自适应 ============ */
@media (max-width:760px){
  .header{flex-wrap:wrap;gap:14px}
  .sticker{max-width:96%}
  .input-row{flex-wrap:wrap}
  .big-btn{flex:1;padding:14px}
  .sh-rect-rust{width:260px;height:200px}
  .mega{letter-spacing:-1px}
}
</style>
</head>
<body>

<!-- 水磨石颗粒 -->
<div class="grain" aria-hidden="true"></div>

<!-- 背景几何色块 -->
<div class="shapes" aria-hidden="true">
  <div class="sh sh-rect-rust"></div>
  <div class="sh sh-circle-mustard"></div>
  <div class="sh sh-circle-black"></div>
  <div class="sh sh-bar-rust"></div>
  <div class="sh sh-tri"></div>
  <div class="sh sh-dots"></div>
  <div class="sh sh-ring"></div>
</div>

<div class="app">
  <!-- 头部 -->
  <header class="header">
    <h1 class="mega">TERRA<span class="hollow">ZZO</span></h1>
    <div class="header-side">
      <span class="sticker-label">水磨石 · 米兰</span>
      <span class="tagline">MILANO DESIGN AI — 大胆 · 快乐 · 手工感</span>
    </div>
    <span class="star" aria-hidden="true">✦</span>
  </header>

  <!-- 贴纸板 -->
  <main class="board" id="board"></main>

  <!-- 输入行 -->
  <footer class="input-row">
    <input id="ideaInput" class="big-input" type="text" placeholder="把想法拍在桌上……" autocomplete="off" maxlength="80">
    <button id="postBtn" class="big-btn">贴上！</button>
  </footer>
</div>

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const rand = (a,b) => a + Math.random()*(b-a);

  const board = $('#board');
  const input = $('#ideaInput');
  const postBtn = $('#postBtn');

  /* ---------- 预置回复（逐句贴纸） ---------- */
  const REPLIES = [
    [
      "Bella！这个想法有戏。",
      "我给你调了三种颜色：赭红负责热情，黑负责底气，芥末黄负责让人心情好。",
      "记住——宁可大胆得让人皱眉，不要平庸得让人打哈欠。"
    ],
    [
      "唔，让我围上围巾想一想……",
      "好的设计像好的浓缩咖啡：量要小，劲要大，杯子还得好看。",
      "你这个问题嘛……杯子太大，咖啡太少。砍掉一半试试？"
    ],
    [
      "米兰人有句老话：先生活，再设计。",
      "这个问题我反过来问你：如果这事明天就要挂进展厅，你第一个改哪里？",
      "先改那里。其余的都是修辞。"
    ],
    [
      "我翻了翻 1972 年的档案……",
      "当年他们也撞过一样的墙。解决方案是：把方的改成圆的，把白的涂成红的。",
      "你看，设计史上大多数突破，本质上是一次勇敢的涂鸦。"
    ],
    [
      "哈！终于有人问这个了。",
      "我的建议有三条：第一，放大；第二，加重；第三，签名。",
      "什么意思？——自信，就是把好东西做成大号好东西的唯一合法手段。"
    ]
  ];
  const COLORS = ['c-white','c-mustard','c-peach','c-cream'];
  let lastIdx = -1;
  function pickReply(){
    let i;
    do { i = Math.floor(Math.random()*REPLIES.length); } while(i === lastIdx);
    lastIdx = i;
    return REPLIES[i];
  }

  let busy = false;
  let colorCursor = 0;

  /* ---------- 贴纸构建 ---------- */
  function makeSticker(cls, text, withName){
    const el = document.createElement('div');
    el.className = 'sticker ' + cls;
    el.style.setProperty('--rot', rand(-2.6,3).toFixed(1) + 'deg');
    if(withName){
      el.innerHTML = '<span class="sticker-name">TERRAZZO</span>' + text;
    } else {
      el.textContent = text;
    }
    el.insertAdjacentHTML('beforeend','<span class="pin"></span>');
    board.appendChild(el);
    scrollBoard();
    return el;
  }

  function scrollBoard(){
    board.scrollTop = board.scrollHeight;
  }

  function userSticker(text){
    const el = document.createElement('div');
    el.className = 'sticker user';
    el.style.setProperty('--rot', rand(-2,2.4).toFixed(1) + 'deg');
    el.textContent = text;
    el.insertAdjacentHTML('beforeend','<span class="pin"></span>');
    board.appendChild(el);
    scrollBoard();
  }

  function thinkSticker(){
    const el = document.createElement('div');
    el.className = 'think-sticker';
    el.innerHTML = '<span>想……</span>' +
      '<div class="cubes"><span class="cube k"></span><span class="cube r"></span><span class="cube y"></span></div>';
    board.appendChild(el);
    scrollBoard();
    return el;
  }

  /* ---------- 发送流程 ---------- */
  async function handleSend(){
    const text = input.value.trim();
    if(!text || busy) return;
    busy = true;
    postBtn.disabled = true;
    input.value = '';

    userSticker(text);
    await sleep(450);

    /* 思考：三色方块交替弹跳 */
    const thinker = thinkSticker();
    await sleep(rand(1600, 2400));
    thinker.remove();

    /* 逐句贴出 */
    const sentences = pickReply();
    for(let s=0; s<sentences.length; s++){
      makeSticker(COLORS[colorCursor % COLORS.length] + ' ai', sentences[s], s === 0);
      colorCursor++;
      await sleep(rand(420, 620));
    }

    busy = false;
    postBtn.disabled = false;
    input.focus();
  }

  postBtn.addEventListener('click', handleSend);
  input.addEventListener('keydown', e => {
    if(e.key === 'Enter') handleSend();
  });

  /* ---------- 开场 ---------- */
  async function opening(){
    await sleep(900);
    const sentences = [
      "Ciao！我是 TERRAZZO，米兰来的设计AI。",
      "我的规矩只有一条：大胆，再大胆一点。",
      "说吧——今天做什么？"
    ];
    for(let s=0; s<sentences.length; s++){
      makeSticker(COLORS[colorCursor % COLORS.length] + ' ai', sentences[s], s === 0);
      colorCursor++;
      await sleep(rand(480, 680));
    }
    input.focus();
  }
  opening();
})();
</script>
</body>
</html>
