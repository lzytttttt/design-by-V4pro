<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUPERNOVA · 超新星</title>
<style>
:root{
  --ink:#111;
  --red:#ff2200;
  --org:#ff4d00;
  --amb:#ffd400;
  --mono:"Cascadia Mono",Consolas,ui-monospace,Menlo,monospace;
  --disp:"Arial Black","Segoe UI",Impact,"Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:#fdfdf8;color:var(--ink);overflow-x:hidden;
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}

/* ---------- 右上角爆发图形 ---------- */
.burst{position:fixed;top:-96px;right:-96px;width:560px;height:560px;
  z-index:0;pointer-events:none;overflow:visible;
  animation:burstPulse 6s ease-in-out infinite}
@keyframes burstPulse{0%,100%{transform:scale(1) rotate(0deg)}
  50%{transform:scale(1.035) rotate(1.2deg)}}

/* ---------- 顶部小标 ---------- */
.tbadge{position:fixed;left:26px;top:24px;z-index:5;font-family:var(--mono);
  font-size:10px;font-weight:700;letter-spacing:.24em;
  background:var(--ink);color:#fff;padding:7px 13px;transform:rotate(-2deg)}

/* ---------- 主体 ---------- */
.wrap{position:relative;z-index:1;max-width:700px;margin:0 auto;padding:120px 26px 240px}
.masthead{margin-bottom:64px;position:relative}
h1{font-family:var(--disp);font-size:clamp(66px,10vw,148px);line-height:.92;
  color:var(--ink);letter-spacing:-.015em;transform:rotate(-6deg);
  opacity:0;animation:slamIn .55s .25s cubic-bezier(.2,1.7,.35,1) forwards}
@keyframes slamIn{from{opacity:0;transform:rotate(-6deg) scale(1.45)}
  to{opacity:1;transform:rotate(-6deg) scale(1)}}
.sub{display:inline-block;margin-top:26px;font-family:var(--mono);font-weight:700;
  font-size:12px;letter-spacing:.5em;background:var(--org);color:#fff;
  padding:9px 16px 9px 21px;transform:rotate(-3deg);box-shadow:4px 4px 0 var(--ink);
  opacity:0;animation:slamIn .5s .7s cubic-bezier(.2,1.7,.35,1) forwards}
.energy{position:absolute;right:6px;bottom:8px;font-family:var(--mono);
  font-size:10px;font-weight:800;letter-spacing:.2em;color:#111;
  border:2px solid #111;padding:5px 10px;transform:rotate(3deg)}

/* ---------- 用户引爆物 ---------- */
.mine{margin:34px 0;transform:rotate(-1.5deg);opacity:0;
  animation:cardIn .4s cubic-bezier(.2,1.7,.35,1) forwards}
.mine .m-tag{display:inline-block;font-family:var(--mono);font-size:9.5px;
  font-weight:800;letter-spacing:.24em;color:#fff;background:var(--red);
  padding:4px 9px;margin-bottom:8px}
.mine p{display:inline-block;background:var(--ink);color:#fff;font-weight:700;
  font-size:15.5px;line-height:1.7;padding:13px 20px;border-radius:11px;
  box-shadow:5px 5px 0 var(--org);max-width:100%;word-break:break-word}

/* ---------- 回复卡片 ---------- */
.card{position:relative;background:#fff;border:2.5px solid var(--ink);border-radius:15px;
  box-shadow:7px 7px 0 var(--ink);padding:19px 24px 21px;margin:30px 0;
  opacity:0;animation:cardIn .45s cubic-bezier(.2,1.6,.35,1) forwards;
  transform-origin:18% 85%}
@keyframes cardIn{from{opacity:0;transform:scale(1.4) rotate(1.6deg)}
  to{opacity:1;transform:none}}
.card-head{display:flex;align-items:center;gap:11px;margin-bottom:12px;
  border-bottom:2px solid var(--ink);padding-bottom:11px}
.boom-ico{width:31px;height:31px;flex:none}
.card-tag{font-family:var(--mono);font-weight:800;font-size:11px;
  letter-spacing:.22em;color:var(--ink)}
.card-tag b{color:var(--org)}
.card-time{margin-left:auto;font-family:var(--mono);font-size:9.5px;
  font-weight:700;letter-spacing:.14em;color:#999}
.card p{font-size:16.5px;font-weight:600;line-height:1.9;color:#151515}
.chunk{display:inline-block;opacity:0;
  animation:chunkIn .16s cubic-bezier(.2,1.9,.4,1) forwards}
@keyframes chunkIn{from{opacity:0;transform:scale(1.32)}
  to{opacity:1;transform:scale(1)}}

/* ---------- 涟漪 / 冲击波 ---------- */
.ripple{position:fixed;z-index:60;width:560px;height:560px;margin:0;
  border:3.5px solid var(--ink);border-radius:50%;pointer-events:none;
  transform:translate(-50%,-50%) scale(.05);opacity:.95;
  transition:transform .58s cubic-bezier(.1,.75,.3,1),opacity .58s ease-out}
.ripple.go{transform:translate(-50%,-50%) scale(1);opacity:0}
#flash{position:fixed;inset:0;z-index:99;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 55%,#fff 30%,#ffe9cd 100%)}

/* ---------- 思考：能量球 ---------- */
#charge{position:fixed;left:50%;bottom:138px;transform:translateX(-50%);z-index:8;
  opacity:0;pointer-events:none;transition:opacity .25s;text-align:center}
#charge.on{opacity:1}
#charge .ball{width:52px;height:52px;margin:0 auto 11px;border-radius:50%;
  background:radial-gradient(circle at 40% 36%,#fff8e4,var(--amb) 46%,var(--org) 86%);
  box-shadow:0 0 16px rgba(255,120,20,.55);
  animation:qShake .11s linear infinite,qBright 1.4s ease-in forwards}
@keyframes qShake{
  0%{margin-left:-2px;margin-top:1px}25%{margin-left:2px;margin-top:-1px}
  50%{margin-left:-1px;margin-top:-2px}75%{margin-left:1px;margin-top:2px}}
@keyframes qBright{to{box-shadow:0 0 58px 20px rgba(255,140,30,.9);
  filter:brightness(2)}}
.c-label{font-family:var(--mono);font-weight:800;font-size:10.5px;
  letter-spacing:.3em;color:var(--org)}

/* ---------- 发射台 ---------- */
#launcher{position:fixed;left:0;right:0;bottom:0;z-index:10;
  padding:26px 26px 22px;background:linear-gradient(transparent,rgba(253,253,248,.94) 38%)}
.launch-row{max-width:700px;margin:0 auto;display:flex;align-items:center;gap:20px}
.fuel{flex:1;display:flex;align-items:center;gap:13px;background:var(--ink);
  border-radius:15px;padding:0 19px;box-shadow:6px 6px 0 var(--org);min-width:0}
.f-tag{font-family:var(--mono);font-weight:800;font-size:10px;
  letter-spacing:.26em;color:var(--org);flex:none}
#ask{flex:1;background:none;border:none;outline:none;color:#fff;
  font-size:15.5px;font-weight:600;padding:17px 4px;caret-color:var(--org);min-width:0}
#ask::placeholder{color:#6a6a6a}
#fire{width:78px;height:78px;flex:none;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 38% 32%,#ff7a45,var(--red) 68%,#bf1000);
  border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);
  color:#fff;font-family:var(--disp);font-size:15px;letter-spacing:.06em;
  transition:transform .07s,box-shadow .07s}
#fire:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
#fire:disabled{opacity:.55;cursor:default}
#fire .flame{animation:fireBreath 3.4s ease-in-out infinite}
@keyframes fireBreath{0%,100%{opacity:.85}50%{opacity:1}}
.l-hint{max-width:700px;margin:11px auto 0;text-align:center;
  font-family:var(--mono);font-size:9.5px;font-weight:700;
  letter-spacing:.34em;color:#b9b4a6}

@media(max-width:640px){
  .wrap{padding-top:100px}
  .launch-row{gap:12px}
  #fire{width:64px;height:64px;font-size:13px}
}
</style>
</head>
<body>

<svg class="burst" viewBox="0 0 600 600" aria-hidden="true">
  <circle cx="600" cy="0" r="70"  fill="none" stroke="#ff4d00" stroke-width="11"/>
  <circle cx="600" cy="0" r="132" fill="none" stroke="#ff6b1a" stroke-width="7" opacity=".85"/>
  <circle cx="600" cy="0" r="202" fill="none" stroke="#ff8c2e" stroke-width="5" opacity=".6" stroke-dasharray="20 13"/>
  <circle cx="600" cy="0" r="284" fill="none" stroke="#ffb01e" stroke-width="3.5" opacity=".45"/>
  <circle cx="600" cy="0" r="388" fill="none" stroke="#ffc93c" stroke-width="2.5" opacity=".3"/>
  <circle cx="600" cy="0" r="500" fill="none" stroke="#ffdd55" stroke-width="2" opacity=".18"/>
  <g>
    <rect x="72"  y="-6"  width="150" height="12" rx="6" fill="#ff4d00"/>
    <g transform="rotate(16 600 0)"><rect x="72" y="-4" width="105" height="8" rx="4" fill="#ff6b1a"/></g>
    <g transform="rotate(33 600 0)"><rect x="72" y="-6" width="215" height="12" rx="6" fill="#ff4d00"/></g>
    <g transform="rotate(52 600 0)"><rect x="72" y="-3" width="88"  height="6" rx="3" fill="#ffd400"/></g>
    <g transform="rotate(70 600 0)"><rect x="72" y="-6" width="180" height="12" rx="6" fill="#ff4d00"/></g>
    <g transform="rotate(88 600 0)"><rect x="72" y="-4" width="120" height="8" rx="4" fill="#ff6b1a"/></g>
    <g transform="rotate(104 600 0)"><rect x="72" y="-6" width="240" height="12" rx="6" fill="#111"/></g>
    <g transform="rotate(121 600 0)"><rect x="72" y="-3" width="96"  height="6" rx="3" fill="#ffd400"/></g>
    <g transform="rotate(139 600 0)"><rect x="72" y="-5" width="165" height="10" rx="5" fill="#ff4d00"/></g>
    <g transform="rotate(158 600 0)"><rect x="72" y="-4" width="110" height="8" rx="4" fill="#ff8c2e"/></g>
    <g transform="rotate(174 600 0)"><rect x="72" y="-6" width="200" height="12" rx="6" fill="#ff4d00"/></g>
    <g transform="rotate(193 600 0)"><rect x="72" y="-3" width="80"  height="6" rx="3" fill="#ffd400"/></g>
    <g transform="rotate(211 600 0)"><rect x="72" y="-5" width="140" height="10" rx="5" fill="#ff6b1a"/></g>
    <g transform="rotate(229 600 0)"><rect x="72" y="-4" width="98"  height="8" rx="4" fill="#111"/></g>
    <g transform="rotate(247 600 0)"><rect x="72" y="-6" width="185" height="12" rx="6" fill="#ff4d00"/></g>
    <g transform="rotate(263 600 0)"><rect x="72" y="-3" width="92"  height="6" rx="3" fill="#ffb01e"/></g>
  </g>
  <path fill="#ff4d00" d="M600 -34 L606.2 -6.2 634 0 606.2 6.2 600 34 593.8 6.2 566 0 593.8 -6.2 Z"/>
  <circle cx="600" cy="0" r="19" fill="#ffd400"/>
</svg>

<div class="tbadge">SUPERNOVA ENGINE v2.5 · 燃烧中</div>
<div id="flash"></div>

<div class="wrap">
  <header class="masthead">
    <h1>SUPERNOVA</h1><br>
    <span class="sub">超新星 · 爆发式创作引擎</span>
    <span class="energy">ENERGY 98%</span>
  </header>
  <main id="flow"></main>
</div>

<div id="charge"><div class="ball"></div><div class="c-label">能量积聚中</div></div>

<footer id="launcher">
  <div class="launch-row">
    <div class="fuel">
      <span class="f-tag">FUEL</span>
      <input id="ask" type="text" placeholder="投入你的火药…" autocomplete="off">
    </div>
    <button id="fire"><span class="flame">点火</span></button>
  </div>
  <div class="l-hint">ENTER 点火 · 保持燃点</div>
</footer>

<script>
/* ==================== 冲击波 / 闪白 ==================== */
const flash=document.getElementById('flash');
function ripple(x,y,color){
  const el=document.createElement('div');
  el.className='ripple';
  el.style.left=x+'px';el.style.top=y+'px';
  if(color)el.style.borderColor=color;
  document.body.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('go')));
  setTimeout(()=>el.remove(),650);
}
function screenFlash(a){
  flash.animate([{opacity:a},{opacity:0}],{duration:170,easing:'ease-out'});
}

/* ==================== 音效（WebAudio） ==================== */
let AC=null;
function tone(f0,f1,dur,vol,type){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),gn=AC.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(f0,AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),AC.currentTime+dur);
    gn.gain.setValueAtTime(vol,AC.currentTime);
    gn.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
    o.connect(gn);gn.connect(AC.destination);
    o.start();o.stop(AC.currentTime+dur);
  }catch(e){}
}
const clickSound=()=>tone(1900,700,.07,.05,'square');
const boomSound=()=>{tone(170,32,.4,.14);tone(600,90,.18,.05,'triangle')};

/* ==================== 回复库 ==================== */
const BLASTS=[
["灵感命中！这个问题有火花——我闻到了可燃的气质。","第一波爆发：核心创意已生成，冲击半径拉满。","第二波：反向视角切入，把平庸炸开一个缺口。收尾：把所有碎片回旋、压缩、点燃——一枚完整的答案正在出炉。保持这个燃点，我们继续！"],
["捕获到一个高能念头！它正在链式反应。","初步方案三连发：快、更快、不要回头。中间那版最危险也最耀眼——危险的部分往往就是正确的一部分。","点燃它。让成品自己发光。"],
["能量读数爆表！这个问题的密度足够引发聚变。","我把平庸的部分全部抛射出去，只留核心燃料。压缩、压缩、再压缩——","轰。答案比预期亮 40%。这就是爆发的意义：不亮则已。"],
["冲击波抵达创作区！检测到一片未开垦的荒地——太好了，荒地最适合放烟花。","三、二、一——第一稿已经射出去了。别管完美，先让它炸响。","回声会告诉我们哪里需要第二发。"],
["这个想法自带引信。","我做的事很简单：找到火药（你的核心意图），捻好引信（表达的路径），然后——点火。","爆炸已完成，碎片正在空中重新排列成答案。接住它！"]
];
let lastIdx=-1,seq=0,busy=false;
function pick(){let i=Math.floor(Math.random()*BLASTS.length);
  if(i===lastIdx)i=(i+1)%BLASTS.length;lastIdx=i;return BLASTS[i];}

/* ==================== DOM ==================== */
const flow=document.getElementById('flow'),ask=document.getElementById('ask'),
      fire=document.getElementById('fire'),charge=document.getElementById('charge');
const BOOM_ICO='<svg class="boom-ico" viewBox="0 0 40 40">'
  +'<path fill="#ff4d00" d="M40 20 L27.4 23.1 L34.1 34.1 L23.1 27.4 '
  +'L20 40 L16.9 27.4 L5.9 34.1 L12.6 23.1 L0 20 L12.6 16.9 L5.9 5.9 '
  +'L16.9 12.6 L20 0 L23.1 12.6 L34.1 5.9 L27.4 16.9 Z"/>'
  +'<circle cx="20" cy="20" r="5" fill="#ffd400"/></svg>';

function chunkify(s){
  const out=[];let buf='';
  for(const ch of s){
    buf+=ch;
    if('，。！？；：、…—'.includes(ch)||buf.length>=4){out.push(buf);buf=''}
  }
  if(buf)out.push(buf);
  return out;
}
function appendMine(text){
  const el=document.createElement('div');
  el.className='mine';
  el.innerHTML='<span class="m-tag">DETONATOR · 引爆物</span><p></p>';
  el.querySelector('p').textContent=text;
  flow.appendChild(el);
  const r=el.getBoundingClientRect();
  ripple(r.left+r.width/2,r.top+20,'#ff4d00',);
}
function appendCard(){
  seq++;
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const art=document.createElement('article');
  art.className='card';
  art.innerHTML=
    '<div class="card-head">'+BOOM_ICO
    +'<span class="card-tag"><b>BLAST</b> #'+String(seq).padStart(3,'0')+'</span>'
    +'<span class="card-time">'+p(d.getHours())+':'+p(d.getMinutes())+'</span></div>';
  const data=pick();
  let delay=120,tail=null;
  data.forEach((para,pi)=>{
    const par=document.createElement('p');
    chunkify(para).forEach(ch=>{
      const sp=document.createElement('span');
      sp.className='chunk';sp.textContent=ch;
      sp.style.animationDelay=delay+'ms';
      par.appendChild(sp);
      delay+=38;
      tail=sp;
    });
    art.appendChild(par);
    if(pi<data.length-1)art.appendChild(document.createElement('br'));
  });
  flow.appendChild(art);
  /* 完成瞬间：闪白 + 冲击波（标志性瞬间） */
  setTimeout(()=>{
    screenFlash(.95);
    boomSound();
    const r=art.getBoundingClientRect();
    ripple(r.left+r.width*.3,r.top+r.height/2,'#ff4d00');
    setTimeout(()=>ripple(r.left+r.width/2,r.top+r.height/2,'#ffd400'),90);
    busy=false;fire.disabled=false;
  },delay+260);
  return art;
}

/* ==================== 主流程 ==================== */
function send(){
  const text=ask.value.trim();
  if(!text||busy)return;
  busy=true;fire.disabled=true;
  clickSound();
  appendMine(text);
  ask.value='';
  screenFlash(.18);
  const fr=fire.getBoundingClientRect();
  ripple(fr.left+fr.width/2,fr.top+fr.height/2,'#111');
  /* 思考：能量积聚光球 */
  charge.classList.add('on');
  const ball=charge.querySelector('.ball');
  ball.style.animation='none';void ball.offsetWidth;
  ball.style.animation='';
  tone(120,420,.5,.04);
  setTimeout(()=>{
    /* 积聚完成：小爆闪 → 回复弹出 */
    charge.classList.remove('on');
    ball.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(2.4)'}],
      {duration:240,easing:'ease-out'});
    screenFlash(.4);
    tone(300,60,.25,.09);
    appendCard();
    window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
  },1500+Math.random()*1500);
}
ask.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
fire.addEventListener('click',send);

/* ==================== 开机欢迎 ==================== */
setTimeout(()=>{
  const art=document.createElement('article');
  art.className='card';
  art.innerHTML='<div class="card-head">'+BOOM_ICO
    +'<span class="card-tag"><b>BLAST</b> #000 · 引擎点火</span>'
    +'<span class="card-time">READY</span></div>';
  ['引擎已点火，燃烧室温度拉满，创意当量无上限。',
   '把任何问题扔进来——我会把它压进燃烧室，压缩、点燃、引爆。',
   '不需要优雅的等待。答案将以冲击波的速度抵达。'].forEach((t,i)=>{
    const par=document.createElement('p');
    par.style.animationDelay=(i*90)+'ms';
    chunkify(t).forEach(ch=>{
      const sp=document.createElement('span');
      sp.className='chunk';sp.textContent=ch;
      par.appendChild(sp);
    });
    art.appendChild(par);
    if(i<2)art.appendChild(document.createElement('br'));
  });
  flow.appendChild(art);
  const r=art.getBoundingClientRect();
  ripple(r.left+60,r.top+40,'#ff4d00');
},800);
</script>
</body>
</html>
