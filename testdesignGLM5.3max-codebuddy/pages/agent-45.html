<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>空 · VOID</title>
<style>
/* ============ VOID · 空 ============ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#fdfdfd;
  color:#1a1a1a;
  font-family:Georgia,"Songti SC","STSong","SimSun",serif;
  cursor:crosshair;
  overflow:hidden;
}
/* ===== 初始之境：一点，一叩 ===== */
.stage{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  transition:opacity 1.2s ease;
}
.stage.gone{opacity:0;pointer-events:none}
.breath-wrap{
  position:relative;
  padding:26px;
  cursor:pointer;
  display:flex;flex-direction:column;align-items:center;
}
.ring{
  position:absolute;left:50%;top:50%;
  width:14px;height:14px;margin:-7px 0 0 -7px;
  border-radius:50%;
  border:1px solid #0a0a0a;
  opacity:0;pointer-events:none;
}
.ring.expand{animation:ringExpand 2s cubic-bezier(.2,.6,.35,1) forwards}
@keyframes ringExpand{
  0%{transform:scale(1);opacity:.85}
  100%{transform:scale(30);opacity:0}
}
.dot{
  width:14px;height:14px;border-radius:50%;
  background:#0a0a0a;
  animation:breathe 4s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{transform:scale(.96)}
  50%{transform:scale(1.04)}
}
.label{
  margin-top:34px;
  font-size:12px;color:#9a9a9a;
  letter-spacing:8px;text-indent:8px;
}
.hint{
  margin-top:20px;
  font-size:10.5px;color:#c2c2c2;
  letter-spacing:4px;text-indent:4px;
  transition:opacity .7s ease;
}
.hint.gone{opacity:0}
/* ===== 对话之境 ===== */
.convo{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity 1.5s ease;
}
.convo.show{opacity:1;pointer-events:auto}
.mini-wrap{
  position:relative;
  margin-bottom:52px;
  display:flex;justify-content:center;
}
.dot-mini{
  width:10px;height:10px;border-radius:50%;
  background:#0a0a0a;
  animation:breathe 4s ease-in-out infinite;
  transition:transform .9s cubic-bezier(.4,0,.2,1);
}
.dot-mini.think{transform:scale(.7)}
/* 思考涟漪：细线圆环扩散渐隐 */
.ripple{
  position:absolute;left:50%;top:50%;
  width:10px;height:10px;margin:-5px 0 0 -5px;
  border-radius:50%;
  border:1px solid rgba(10,10,10,.55);
  animation:rippleOut 2.4s ease-out forwards;
  pointer-events:none;
}
@keyframes rippleOut{
  from{transform:scale(1);opacity:.7}
  to{transform:scale(16);opacity:0}
}
.exchange{
  width:min(560px,82vw);
  min-height:170px;
  transition:opacity 4s ease;
}
.exchange.faded{opacity:0}
.q{
  font-size:14.5px;font-weight:300;color:#2e2e2e;
  line-height:2.4;letter-spacing:.08em;
  margin-bottom:44px;
}
.a{
  font-size:13px;font-weight:300;color:#5a5a5a;
  line-height:2.8;letter-spacing:.1em;
  min-height:1em;
}
/* 逐字淡入 */
.ch{opacity:0;transition:opacity .6s ease}
.ch.on{opacity:1}
/* 细黑线输入条 */
.line-form{
  margin-top:70px;
  width:min(430px,74vw);
  display:flex;align-items:center;
  border-bottom:1px solid #0a0a0a;
  transition:opacity .8s ease;
}
.line-form.faded{opacity:0}
#ask{
  flex:1;background:transparent;border:0;outline:0;
  font-family:Georgia,"Songti SC","STSong","SimSun",serif;
  font-size:13px;font-weight:300;color:#1a1a1a;
  padding:11px 2px;cursor:crosshair;letter-spacing:.06em;
  min-width:60px;
}
#ask::placeholder{color:#cfcfcf;letter-spacing:.3em}
/* 页脚 */
.folio{
  position:fixed;right:30px;bottom:24px;
  font-size:10px;color:#c4c4c4;
  letter-spacing:5px;user-select:none;
}
/* 自适应：小屏时收紧行距与留白 */
@media (max-height:760px){
  .exchange{min-height:120px}
  .q{margin-bottom:30px;line-height:2.1}
  .a{line-height:2.4}
  .line-form{margin-top:46px}
  .mini-wrap{margin-bottom:38px}
}
</style>
</head>
<body>

<!-- 初始之境 -->
<div class="stage" id="stage">
  <div class="breath-wrap" id="breathWrap">
    <div class="ring" id="ring"></div>
    <div class="dot"></div>
    <div class="label">叩</div>
  </div>
  <div class="hint" id="hint">点击，以唤起</div>
</div>

<!-- 对话之境 -->
<div class="convo" id="convo">
  <div class="mini-wrap" id="miniWrap">
    <div class="dot-mini" id="dotMini"></div>
  </div>
  <div class="exchange" id="exchange">
    <div class="q" id="qEl"></div>
    <div class="a" id="aEl"></div>
  </div>
  <form class="line-form" id="form" autocomplete="off">
    <input id="ask" spellcheck="false" placeholder="问">
  </form>
</div>

<div class="folio">空 · 四十五</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var sleep = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };
  var stage = $('stage');
  var ring = $('ring');
  var hint = $('hint');
  var breathWrap = $('breathWrap');
  var convo = $('convo');
  var miniWrap = $('miniWrap');
  var dotMini = $('dotMini');
  var exchange = $('exchange');
  var qEl = $('qEl');
  var aEl = $('aEl');
  var form = $('form');
  var ask = $('ask');
  var awakened = false;
  var busy = false;
  var replyIdx = 0;
  var fadeTimer = null;

  /* ---------- 预置回复（循环使用） ---------- */
  var REPLIES = [
    '风从不回答树的问题。它只是经过，而树就懂了。',
    '你问的这件事，答案或许不在远方，而在你放下这个问题的那一刻。',
    '空，不是没有。空是腾出来，好让重要的东西进得来。',
    '一即是一切，一切即是一。你的这个问题里，藏着所有没有问出口的问题。',
    '水从不停留在原地，所以它从不陈旧。心，也是如此。'
  ];

  /* ---------- 唤起：圆环扩散，界面浮现 ---------- */
  breathWrap.addEventListener('click', async function(){
    if (awakened) return;
    awakened = true;
    hint.classList.add('gone');
    ring.classList.add('expand');
    await sleep(1200);
    stage.classList.add('gone');
    await sleep(1000);
    stage.style.display = 'none';
    convo.classList.add('show');
    await sleep(1400);
    ask.focus();
  });

  /* ---------- 逐字极慢淡入 ---------- */
  async function slowType(el, text){
    for (var i = 0; i < text.length; i++){
      var s = document.createElement('span');
      s.className = 'ch';
      s.textContent = text.charAt(i);
      el.appendChild(s);
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){ s.classList.add('on'); });
      });
      var pause = '，。！？…；：'.indexOf(text.charAt(i)) >= 0 ? 560 : 300;
      await sleep(pause);
    }
  }

  /* ---------- 思考态：墨点收缩 → 涟漪释放 ---------- */
  async function think(){
    dotMini.classList.add('think');
    await sleep(2000);
    var ripple = document.createElement('div');
    ripple.className = 'ripple';
    miniWrap.appendChild(ripple);
    await sleep(500);
    dotMini.classList.remove('think');
    await sleep(900);
    setTimeout(function(){ ripple.remove(); }, 2200);
  }

  /* ---------- 旧轮淡出，保持洁净 ---------- */
  async function clearOld(fast){
    if (!qEl.textContent && !aEl.textContent) return;
    clearTimeout(fadeTimer);
    if (fast){
      exchange.style.transition = 'opacity 1.2s ease';
    }
    exchange.classList.add('faded');
    await sleep(fast ? 1250 : 4100);
    qEl.innerHTML = '';
    aEl.innerHTML = '';
    exchange.classList.remove('faded');
    exchange.style.transition = '';
  }

  /* ---------- 主流程：一问 → 收拢涟漪 → 一答 ---------- */
  form.addEventListener('submit', async function(e){
    e.preventDefault();
    var text = ask.value.trim();
    if (!text || busy || !awakened) return;
    busy = true;
    ask.value = '';
    await clearOld(true);
    await slowType(qEl, text);
    await think();
    await slowType(aEl, REPLIES[replyIdx++ % REPLIES.length]);
    busy = false;
    /* 回复完成后停留，然后极缓慢淡出，归于空 */
    fadeTimer = setTimeout(function(){
      exchange.classList.add('faded');
      fadeTimer = setTimeout(function(){
        qEl.innerHTML = '';
        aEl.innerHTML = '';
        exchange.classList.remove('faded');
      }, 4200);
    }, 8000);
  });
})();
</script>
</body>
</html>
