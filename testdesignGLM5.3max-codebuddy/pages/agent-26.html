<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KILN · 窑变 — 不确定之美</title>
<style>
/* ============================================================
   KILN 「窑变」— 陶瓷开片美学
   天青釉渐变 · 瓷片对话 · 出窑动画 · 随机开片裂纹 · 窑口输入
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --ink: #14332d;
  --gold: #d8aa3c;
}

html, body { height: 100%; }

body {
  font-family: "Songti SC", "Noto Serif SC", "STSong", "SimSun", serif;
  background: linear-gradient(178deg,
    #e4f5ee 0%, #b9e0d3 26%, #7cbfab 55%,
    #3f9482 78%, #0f766e 100%);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* —— 整页釉面：一道缓慢游移的高光（idle 呼吸感） —— */
body::before {
  content: '';
  position: fixed; inset: 0;
  pointer-events: none;
  background: linear-gradient(112deg,
    transparent 34%,
    rgba(255,255,255,.10) 44%,
    rgba(255,255,255,.22) 50%,
    rgba(255,255,255,.10) 56%,
    transparent 66%);
  background-size: 260% 100%;
  animation: pageGlaze 16s ease-in-out infinite;
  z-index: 6;
}
@keyframes pageGlaze {
  0%, 100% { background-position: 130% 0; }
  50%      { background-position: -30% 0; }
}

/* —— 头部 —— */
header {
  padding: 26px 48px 12px;
  display: flex;
  align-items: baseline;
  gap: 18px;
  flex-shrink: 0;
  z-index: 7;
}
h1 {
  font-size: 34px;
  letter-spacing: .35em;
  font-weight: 700;
  color: #0c3f38;
  text-shadow: 0 1px 0 rgba(255,255,255,.4);
}
.sub {
  font-size: 14px;
  letter-spacing: .3em;
  color: rgba(12, 63, 56, .78);
}
#status {
  margin-left: auto;
  font-size: 13px;
  letter-spacing: .18em;
  color: rgba(255,255,255,.92);
  text-shadow: 0 1px 6px rgba(15,70,60,.55);
  display: flex;
  align-items: center;
  gap: 9px;
  white-space: nowrap;
}
#statusDot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #f0fff8;
  box-shadow: 0 0 7px rgba(240,255,248,.95);
  animation: bead 3.4s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes bead {
  0%, 100% { transform: scale(1);   opacity: .7; }
  50%      { transform: scale(1.4); opacity: 1; }
}

/* —— 对话流（瓷片） —— */
main {
  flex: 1;
  overflow-y: auto;
  padding: 8px 48px 26px;
  width: min(880px, 100%);
  margin: 0 auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.35) transparent;
  z-index: 2;
}

.shard {
  position: relative;
  max-width: 78%;
  margin: 16px 0;
  padding: 18px 24px 16px;
  background: linear-gradient(165deg,
    rgba(255,255,255,.56),
    rgba(255,255,255,.14) 58%,
    rgba(255,255,255,.30));
  border: 1px solid rgba(255,255,255,.5);
  box-shadow: 0 10px 26px rgba(10, 60, 50, .28),
              inset 0 1px 0 rgba(255,255,255,.65),
              inset 0 -6px 14px rgba(30, 90, 80, .12);
  backdrop-filter: blur(5px);
  line-height: 1.95;
  font-size: 16.5px;
}
.shard.user {
  margin-left: auto;
  background: linear-gradient(165deg,
    rgba(255,250,232,.78),
    rgba(255,242,214,.38));
  color: #4a3a1e;
}
/* 每片瓷自身缓慢扫过的釉光 */
.shard::after {
  content: '';
  position: absolute; inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(100deg,
    transparent 38%,
    rgba(255,255,255,.42) 50%,
    transparent 62%);
  background-size: 230% 100%;
  animation: shardGlaze 9s ease-in-out infinite;
}
@keyframes shardGlaze {
  0%, 100% { background-position: 160% 0; }
  55%      { background-position: -60% 0; }
}

/* 出窑：从暗涩到亮釉 */
.shard.fresh {
  animation: kilnReveal 1.5s cubic-bezier(.22,.8,.3,1) both;
}
@keyframes kilnReveal {
  0%   { filter: brightness(.22) saturate(.25);
         opacity: 0; transform: translateY(16px) scale(.985); }
  30%  { opacity: 1; }
  100% { filter: brightness(1) saturate(1); transform: none; }
}

.who {
  display: block;
  font-size: 11px;
  letter-spacing: .35em;
  opacity: .55;
  margin-bottom: 6px;
}

/* 开片裂纹层 */
.crackle {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  overflow: hidden;
}
.crackle path {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
@keyframes crackGrow { to { stroke-dashoffset: 0; } }

/* 釉色渐显的分句 */
.glaze-line {
  animation: glazeIn 1.05s ease both;
}
@keyframes glazeIn {
  0%   { opacity: 0; filter: blur(2px); }
  100% { opacity: 1; filter: blur(0); }
}

/* —— 窑火思考态 —— */
#kilnFire {
  position: fixed;
  bottom: -175px; left: 50%;
  width: min(920px, 92vw); height: 330px;
  transform: translateX(-50%);
  background:
    radial-gradient(ellipse 60% 100% at 50% 100%,
      rgba(255,150,50,.50), transparent 65%),
    radial-gradient(ellipse 32% 68% at 50% 100%,
      rgba(255,88,18,.55), transparent 62%);
  opacity: 0;
  transition: opacity .9s ease;
  pointer-events: none;
  z-index: 4;
}
#fireText {
  position: fixed;
  bottom: 26px; left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
  letter-spacing: .55em;
  padding-left: .55em; /* 抵消最后一个字的字距，保证视觉居中 */
  color: #ffd9a8;
  text-shadow: 0 0 12px rgba(255,120,30,.9), 0 0 32px rgba(255,80,10,.5);
  opacity: 0;
  transition: opacity .5s;
  pointer-events: none;
  z-index: 5;
  white-space: nowrap;
}
#fireText span { display: inline-block; }
body.thinking #kilnFire { opacity: 1; animation: fireBreath 1.7s ease-in-out infinite; }
body.thinking #fireText { opacity: 1; }
body.thinking #fireText span { animation: fireWord 1.7s ease-in-out infinite; }
@keyframes fireBreath {
  0%, 100% { transform: translateX(-50%) scaleY(1);    opacity: .85; }
  50%      { transform: translateX(-50%) scaleY(1.28); opacity: 1; }
}
@keyframes fireWord {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

/* —— 输入：窑口拱形 —— */
.kiln-mouth {
  flex-shrink: 0;
  width: min(780px, calc(100% - 88px));
  margin: 0 auto 30px;
  padding: 22px 26px 12px;
  background: linear-gradient(180deg, #241610, #472e1c 68%, #2b1a10);
  border: 2.5px solid #1a0f08;
  border-bottom: none;
  border-radius: 220px 220px 14px 14px / 150px 150px 12px 12px;
  box-shadow: 0 -6px 30px rgba(255,110,20,.14),
              inset 0 2px 0 rgba(255,180,90,.18),
              inset 0 -8px 20px rgba(0,0,0,.55);
  position: relative;
  z-index: 5;
}
.kiln-mouth::before {
  content: '';
  position: absolute;
  inset: 6px 12px auto;
  height: 4px;
  border-radius: 999px;
  background: linear-gradient(90deg, transparent,
    rgba(255,140,40,.55), transparent);
  filter: blur(2px);
  animation: ember 3s ease-in-out infinite;
}
@keyframes ember { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }

.kiln-row { display: flex; gap: 12px; align-items: center; }
#input {
  flex: 1;
  background: transparent;
  border: none;
  border-bottom: 1.5px solid rgba(255,190,120,.5);
  color: #ffe9cf;
  font-family: inherit;
  font-size: 16px;
  letter-spacing: .05em;
  padding: 10px 6px;
  outline: none;
}
#input::placeholder { color: rgba(255,210,160,.4); }
#input:focus { border-bottom-color: rgba(255,180,90,.9); }
#send {
  background: linear-gradient(180deg, #ff9a3d, #e2641b);
  border: 1px solid #ffd9a8;
  color: #2b1206;
  font-family: inherit;
  font-size: 15px;
  letter-spacing: .25em;
  padding: 10px 20px 10px 25px;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 0 14px rgba(255,120,30,.55),
              inset 0 1px 0 rgba(255,255,255,.5);
  transition: transform .15s, box-shadow .25s;
  white-space: nowrap;
}
#send:hover { transform: translateY(-1px); box-shadow: 0 0 22px rgba(255,140,40,.85); }
#send:active { transform: translateY(1px); }
#send:disabled { opacity: .55; cursor: default; transform: none; }

/* —— 底款印章 —— */
.seal {
  position: fixed;
  right: 30px; bottom: 30px;
  width: 56px; height: 58px;
  border: 2.5px solid rgba(178, 44, 36, .85);
  color: rgba(178, 44, 36, .92);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 2px;
  transform: rotate(-4deg);
  border-radius: 4px;
  mix-blend-mode: multiply;
  z-index: 7;
  user-select: none;
  pointer-events: none;
}
.seal span {
  writing-mode: vertical-rl;
  line-height: 1.1;
}
.seal span::first-letter { font-size: 15px; }

/* —— 自适应 —— */
@media (max-width: 900px) {
  header { padding: 18px 22px 8px; flex-wrap: wrap; }
  h1 { font-size: 26px; }
  .sub { font-size: 12px; }
  main { padding: 6px 22px 16px; }
  .shard { max-width: 94%; font-size: 15px; padding: 15px 18px; }
  .kiln-mouth { width: calc(100% - 36px); margin-bottom: 22px; }
  .seal { right: 14px; bottom: 14px; width: 46px; height: 48px; font-size: 12px; }
}
</style>
</head>
<body>

<header>
  <h1>KILN</h1>
  <span class="sub">窑 变 · 不 确 定 之 美</span>
  <div id="status"><i id="statusDot"></i><span id="statusText">待窑 · 釉色将成</span></div>
</header>

<main id="chat" aria-live="polite"></main>

<div id="kilnFire"></div>
<div id="fireText"><span>窑 火 淬 炼 中</span></div>

<footer class="kiln-mouth">
  <div class="kiln-row">
    <input id="input" type="text" placeholder="将你的问题投入窑中……" autocomplete="off">
    <button id="send">投 窑</button>
  </div>
</footer>

<div class="seal"><span>甲辰</span><span>窑变</span></div>

<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var chat = document.getElementById('chat');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var statusText = document.getElementById('statusText');

  /* —— 预置回复：每条都谈"不确定之美" —— */
  var REPLIES = [
    '窑火不欺人：温度差一度，釉色便是另一个世界。你问的这件事，我看见了三种可能的开片——每一种都美，但每一种都需要你亲手捧起，才知道温润。',
    '釉在出窑之前，谁也不知道它会成为什么。不确定性不是缺陷，是瓷器唯一的诚实。你带来的问题正在降温结晶，此刻它偏向天青。',
    '我把你的话放进窑里转了一圈。高温里它松开了原本的形状，重新收缩成一句更小、更硬、更透的话：先做，再修，美是烧出来的，不是想出来的。',
    '开片的声音要在安静里才听得见——瓷器出窑后仍在缓慢开裂，可能持续数年。你的答案也一样：现在给不出终稿，但三年后回头看，裂纹就是纹样。',
    '天青色等着雨过，窑变等着火停。你的问题我已覆上一层釉，静候它自己决定成色。急不得，急了会惊窑。'
  ];

  var replyIdx = 0;
  var busy = false;
  var IDLE = '待窑 · 釉色将成';

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  /* 瓷片的不规则圆角：像天然断面 */
  function randomRadius() {
    var r = function () { return Math.round(5 + Math.random() * 20); };
    return r() + 'px ' + r() + 'px ' + r() + 'px ' + r() + 'px / ' +
           r() + 'px ' + r() + 'px ' + r() + 'px ' + r() + 'px';
  }

  function scrollChat() { chat.scrollTop = chat.scrollHeight; }

  function autoScroll(ms) {
    var iv = setInterval(scrollChat, 260);
    setTimeout(function () { clearInterval(iv); }, ms);
  }

  /* 按中文标点切句，供"釉色渐显"分块 */
  function splitPhrases(text) {
    var marks = '，。；：！？、';
    var parts = [], cur = '';
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      cur += ch;
      if (marks.indexOf(ch) >= 0) { parts.push(cur); cur = ''; }
    }
    if (cur) parts.push(cur);
    return parts;
  }

  function addUser(text) {
    var el = document.createElement('div');
    el.className = 'shard user fresh';
    el.style.borderRadius = randomRadius();
    var who = document.createElement('span');
    who.className = 'who';
    who.textContent = '来者 · 问';
    var body = document.createElement('div');
    body.textContent = text;
    el.appendChild(who);
    el.appendChild(body);
    chat.appendChild(el);
    scrollChat();
  }

  /* —— 随机开片裂纹：递归分叉的折线网络，逐条蔓延 —— */
  function buildCrackle(el) {
    var w = el.offsetWidth, h = el.offsetHeight;
    if (!w || !h) return;
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('class', 'crackle');
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    svg.style.borderRadius = getComputedStyle(el).borderRadius;
    var paths = [];

    function grow(x, y, ang, depth, delay) {
      var d = 'M ' + x.toFixed(1) + ' ' + y.toFixed(1);
      var travelled = 0;
      for (var i = 0; i < depth; i++) {
        ang += (Math.random() - 0.5) * 1.15;
        var seg = 9 + Math.random() * 24;
        x += Math.cos(ang) * seg;
        y += Math.sin(ang) * seg;
        var cx = Math.max(3, Math.min(w - 3, x));
        var cy = Math.max(3, Math.min(h - 3, y));
        d += ' L ' + cx.toFixed(1) + ' ' + cy.toFixed(1);
        travelled += seg;
        if (depth > 2 && Math.random() < 0.42) {
          grow(cx, cy,
            ang + (Math.random() < 0.5 ? -1 : 1) * (0.5 + Math.random() * 0.9),
            Math.max(2, depth - 2),
            delay + travelled / 55);
        }
      }
      if (travelled > 14) paths.push({ d: d, len: travelled, delay: delay });
    }

    var seeds = 2 + Math.floor(Math.random() * 2);
    for (var s = 0; s < seeds; s++) {
      grow(w * (0.12 + Math.random() * 0.76),
           h * (0.12 + Math.random() * 0.76),
           Math.random() * Math.PI * 2,
           4 + Math.floor(Math.random() * 3),
           0.45 + Math.random() * 0.55);
    }

    paths.forEach(function (p) {
      var path = document.createElementNS(NS, 'path');
      path.setAttribute('d', p.d);
      var gold = Math.random() < 0.42;
      path.setAttribute('stroke', gold ? 'rgba(216,170,60,.62)' : 'rgba(6,52,45,.42)');
      path.setAttribute('stroke-width', (0.65 + Math.random() * 0.55).toFixed(2));
      var total = Math.ceil(p.len * 1.18) + 12;
      path.style.strokeDasharray = total;
      path.style.strokeDashoffset = total;
      path.style.animation = 'crackGrow 2.1s ' + p.delay.toFixed(2) + 's ease-out forwards';
      svg.appendChild(path);
    });
    el.appendChild(svg);
  }

  function mountAiShard(text, label) {
    var el = document.createElement('div');
    el.className = 'shard ai fresh';
    el.style.borderRadius = randomRadius();
    var who = document.createElement('span');
    who.className = 'who';
    who.textContent = label;
    var body = document.createElement('div');
    body.className = 'shard-body';
    var parts = splitPhrases(text);
    parts.forEach(function (p, i) {
      var s = document.createElement('span');
      s.className = 'glaze-line';
      s.textContent = p;
      s.style.animationDelay = (0.95 + i * 0.5) + 's';
      body.appendChild(s);
    });
    el.appendChild(who);
    el.appendChild(body);
    chat.appendChild(el);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { buildCrackle(el); });
    });
    autoScroll(1500 + parts.length * 500 + 900);
    return 950 + parts.length * 500 + 800;
  }

  async function aiReply() {
    busy = true;
    sendBtn.disabled = true;
    statusText.textContent = '窑火淬炼中';
    document.body.classList.add('thinking');
    await wait(1600 + Math.random() * 1100);
    document.body.classList.remove('thinking');
    statusText.textContent = '开窑 · 出瓷';

    var text = REPLIES[replyIdx % REPLIES.length];
    replyIdx++;

    var totalMs = mountAiShard(text, 'KILN · 出窑');
    await wait(totalMs);
    statusText.textContent = IDLE;
    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }

  function submit() {
    var text = input.value.trim();
    if (!text || busy) return;
    input.value = '';
    addUser(text);
    aiReply();
  }

  sendBtn.addEventListener('click', submit);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submit();
  });

  /* —— 开窑迎辞 —— */
  setTimeout(function () {
    var welcome = '窑已开，火正温。我是 KILN——把你的问题交给我烧一烧，出窑时它会带上意料之外的釉色。同一句话进窑两次，得到的从来不是同一件瓷。';
    mountAiShard(welcome, 'KILN · 开窑');
  }, 900);
})();
</script>
</body>
</html>
