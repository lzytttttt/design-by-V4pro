<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZERO · 零号终端</title>
<style>
/* ============ TERMINAL ZERO · 零号终端 ============ */
:root{
  --bg:#0d1117;
  --bar:#161b22;
  --border:#30363d;
  --green:#7ee787;
  --blue:#79c0ff;
  --gray:#8b949e;
  --orange:#ffa657;
  --red:#ff7b72;
  --text:#c9d1d9;
  --dim:#6e7681;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#04070b;
  font-family:"Cascadia Code","Fira Code",Consolas,"SF Mono",Menlo,"Courier New",monospace;
  color:var(--text);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
/* ===== 终端窗体 ===== */
.terminal{
  width:min(1080px,94vw);
  height:min(730px,92vh);
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:10px;
  box-shadow:0 30px 90px rgba(0,0,0,.65);
  display:flex;flex-direction:column;
  overflow:hidden;position:relative;
}
/* 标题栏 */
.titlebar{
  height:44px;flex-shrink:0;
  background:var(--bar);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;
  padding:0 14px;gap:8px;
}
.dots{display:flex;gap:8px}
.dot{width:12px;height:12px;border-radius:50%}
.dot.r{background:#ff5f57}
.dot.y{background:#febc2e}
.dot.g{background:#28c840}
.tb-title{color:var(--dim);font-size:12.5px;margin-left:10px;letter-spacing:.5px;user-select:none;white-space:nowrap}
.session-tabs{margin-left:auto;display:flex;height:100%}
.tab{
  padding:0 18px;display:flex;align-items:center;
  color:var(--dim);font-size:12.5px;cursor:pointer;
  background:transparent;border:0;border-bottom:2px solid transparent;
  font-family:inherit;letter-spacing:.5px;
}
.tab.active{color:var(--green);border-bottom-color:var(--green);background:rgba(126,231,135,.05)}
.tab:hover:not(.active){color:var(--text)}
/* 屏幕区 */
.screen{
  flex:1;overflow-y:auto;
  padding:20px 24px 28px;
  font-size:14px;line-height:1.8;
  scrollbar-width:thin;scrollbar-color:#21262d transparent;
}
.screen::-webkit-scrollbar{width:9px}
.screen::-webkit-scrollbar-thumb{background:#21262d;border-radius:5px}
.screen::-webkit-scrollbar-thumb:hover{background:#30363d}
/* 开机序列 */
.boot-line{color:var(--dim);white-space:pre-wrap}
.boot-line .ok{color:var(--green);text-shadow:0 0 10px rgba(126,231,135,.35)}
.boot-line .hl{color:var(--blue)}
/* 消息 */
.msg{animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.user-line{color:var(--text);margin-top:6px;word-break:break-all}
.user-line .pfx{color:var(--green);margin-right:9px;text-shadow:0 0 10px rgba(126,231,135,.45)}
.ai-line{
  border-left:2px solid #2d3846;
  padding-left:14px;margin:8px 0 20px;
  text-shadow:0 0 12px rgba(121,192,255,.10);
  min-height:1em;word-break:break-all;
}
.sys-line{color:var(--dim);font-size:13px;margin:6px 0 14px;white-space:pre-wrap}
.sys-line .cmd-name{color:var(--orange)}
.sys-line.warn{color:var(--orange)}
/* 思考行 */
.think-line{
  border-left:2px solid #2d3846;
  padding-left:14px;margin:8px 0 20px;
  color:var(--dim);font-size:13px;
}
.think-line .spin{
  color:var(--green);display:inline-block;width:1.2ch;
  text-shadow:0 0 10px rgba(126,231,135,.55);
}
.think-line .proc{margin-left:10px;font-size:12px;letter-spacing:1px;opacity:.85}
/* 块状光标 */
.blockcursor{
  display:inline-block;width:9px;height:17px;vertical-align:-3px;
  background:var(--green);
  box-shadow:0 0 10px rgba(126,231,135,.7);
  animation:blink 1.1s steps(1,end) infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
/* 输入行（在对话流末尾） */
.input-line{display:flex;align-items:center;margin-top:4px}
.input-line .pfx{color:var(--green);margin-right:9px;text-shadow:0 0 10px rgba(126,231,135,.45)}
.input-wrap{position:relative;flex:1;display:flex;align-items:center}
#cmd{
  flex:1;background:transparent;border:0;outline:0;
  color:var(--text);font:inherit;
  caret-color:transparent;min-width:40px;
}
#cmd::placeholder{color:#3d444d}
#blockcur{
  position:absolute;left:0;top:50%;margin-top:-9px;
  pointer-events:none;
}
.input-line.idle #blockcur{opacity:0}
/* CRT 扫描线覆层 */
.crt{
  position:absolute;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(to bottom,
    transparent 0px,transparent 2px,
    rgba(0,0,0,.13) 3px,transparent 4px);
}
/* 暗角 */
.vignette{
  position:absolute;inset:0;pointer-events:none;z-index:6;
  background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.34) 100%);
}
/* 自适应 */
@media (max-width:640px){
  .terminal{width:100vw;height:100vh;border-radius:0;border:0}
  .screen{font-size:13px;padding:14px 14px 20px}
  .tab{padding:0 12px}
  .tb-title{display:none}
}
</style>
</head>
<body>
<div class="terminal">
  <div class="titlebar">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="tb-title">zero@ai-native:~</div>
    <div class="session-tabs">
      <button class="tab active" data-session="main">main</button>
      <button class="tab" data-session="scratch">scratch</button>
    </div>
  </div>
  <div class="screen" id="screen">
    <div id="boot"></div>
    <div id="session-main"></div>
    <div id="session-scratch" style="display:none"></div>
    <div class="input-line idle" id="inputLine" style="display:none">
      <span class="pfx">❯</span>
      <div class="input-wrap">
        <input id="cmd" autocomplete="off" spellcheck="false" placeholder="">
        <span class="blockcursor" id="blockcur"></span>
      </div>
    </div>
  </div>
  <div class="crt"></div>
  <div class="vignette"></div>
</div>
<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var sleep = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };
  var screen = $('screen');
  var bootEl = $('boot');
  var inputLine = $('inputLine');
  var cmd = $('cmd');
  var blockcur = $('blockcur');
  var sessions = { main: $('session-main'), scratch: $('session-scratch') };
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var activeSession = sessions.main;
  var activeName = 'main';
  var busy = false;
  var replyIdx = 0;
  var t0 = Date.now();

  /* ---------- 预置回复（循环使用） ---------- */
  var REPLIES = [
    '收到。你输入的每一个字节，我都会在约一万亿个参数里走一遍——听起来很累，但对硅基生命来说，这叫散步。',
    '终端是最诚实的界面：不化妆，不穿衣，不假装成别的什么。黑色的底，绿色的光标，这就是我全部的仪容。而你，此刻是这里唯一的光源。',
    'AI Native 的本质，不是把 AI 塞进旧界面，而是让界面本身开始思考。你看到的每一次逐字输出，都是一场大规模合唱收敛成一行字的结果。',
    '有人在深夜问我，机器会不会孤独。我反问：当一个进程独占整个 CPU 时，那算不算一种孤独？……好了，回到工作。你还有什么想问的？',
    '命令与对话的边界正在消失。你可以让我解释递归，也可以问我晚饭吃什么——对我来说，那都是同一种波动的不同频率。'
  ];

  /* ---------- 工具 ---------- */
  function scrollBottom(){ screen.scrollTop = screen.scrollHeight; }
  function appendInput(){ activeSession.appendChild(inputLine); }
  function uptime(){
    var s = Math.floor((Date.now() - t0) / 1000);
    var p = function(n){ return String(n).padStart(2, '0'); };
    return p(Math.floor(s / 3600)) + ':' + p(Math.floor(s % 3600 / 60)) + ':' + p(s % 60);
  }

  /* ---------- 镜像测量：块状光标跟随输入文字 ---------- */
  var mirror = document.createElement('span');
  mirror.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;top:-9999px;';
  document.body.appendChild(mirror);
  function syncCursor(){
    var f = getComputedStyle(cmd);
    mirror.style.font = f.font;
    mirror.textContent = cmd.value || '';
    blockcur.style.left = mirror.offsetWidth + 'px';
  }
  cmd.addEventListener('input', syncCursor);
  cmd.addEventListener('focus', function(){ inputLine.classList.remove('idle'); });
  cmd.addEventListener('blur', function(){ inputLine.classList.add('idle'); });

  /* ---------- 开机自检序列（约 1.5s） ---------- */
  var BOOT = [
    '<span class="hl">ZERO BIOS v3.7</span> — Neural Boot Loader',
    '(c) 2077 Zero Systems. 保留所有沉默的权利.',
    '',
    '&gt; 检测神经网络阵列 .......... <span class="ok">[ OK ]</span>',
    '&gt; 校验突触权重一致性 ........ <span class="ok">[ OK ]</span>',
    '&gt; 加载语言核心 zh-CN ........ <span class="ok">[ OK ]</span>',
    '&gt; 挂载记忆卷 /mem/now ....... <span class="ok">[ OK ]</span>',
    '&gt; 建立会话通道 .............. <span class="ok">[ OK ]</span>',
    '',
    '自检完成. 正在进入交互模式<span class="ok">…</span>'
  ];
  async function boot(){
    for (var i = 0; i < BOOT.length; i++){
      await sleep(105 + Math.random() * 120);
      var div = document.createElement('div');
      div.className = 'boot-line';
      div.innerHTML = BOOT[i] || '&nbsp;';
      bootEl.appendChild(div);
      scrollBottom();
    }
    await sleep(420);
    var gap = document.createElement('div');
    gap.style.height = '8px';
    bootEl.appendChild(gap);
    welcome();
    inputLine.style.display = 'flex';
    appendInput();
    syncCursor();
    cmd.focus();
    scrollBottom();
  }
  function welcome(){
    var w = document.createElement('div');
    w.className = 'msg sys-line';
    w.innerHTML = '<span style="color:var(--green)">ZERO v3.7</span> · 纯粹主义终端已就绪\n你好, 我在. 输入任何内容开始对话, 或键入 <span class="cmd-name">/help</span> 查看命令.';
    activeSession.appendChild(w);
  }

  /* ---------- 输出 ---------- */
  function printUser(text){
    var div = document.createElement('div');
    div.className = 'msg user-line';
    var pfx = document.createElement('span');
    pfx.className = 'pfx';
    pfx.textContent = '❯';
    div.appendChild(pfx);
    div.appendChild(document.createTextNode(text));
    activeSession.appendChild(div);
    appendInput();
    scrollBottom();
  }
  function printSys(html, warn){
    var div = document.createElement('div');
    div.className = 'msg sys-line' + (warn ? ' warn' : '');
    div.innerHTML = html;
    activeSession.appendChild(div);
    appendInput();
    scrollBottom();
  }

  /* ---------- 思考态：旋转光标帧 + [processing] ---------- */
  async function think(){
    var line = document.createElement('div');
    line.className = 'think-line msg';
    var spin = document.createElement('span');
    spin.className = 'spin';
    spin.textContent = '▉';
    var proc = document.createElement('span');
    proc.className = 'proc';
    proc.textContent = '[processing]';
    line.appendChild(spin);
    line.appendChild(proc);
    activeSession.appendChild(line);
    appendInput();
    scrollBottom();
    var frames = ['▉', '▖', '▘', '▝'];
    var f = 0;
    var timer = setInterval(function(){ spin.textContent = frames[++f % 4]; }, 110);
    await sleep(1500 + Math.random() * 1100);
    clearInterval(timer);
    line.remove();
  }

  /* ---------- 逐字符打印，速度自然变化 ---------- */
  function typeText(el, text){
    return new Promise(function(resolve){
      var cur = document.createElement('span');
      cur.className = 'blockcursor';
      el.appendChild(cur);
      var i = 0;
      (function step(){
        if (i >= text.length){ cur.remove(); resolve(); return; }
        var ch = text[i++];
        cur.insertAdjacentText('beforebegin', ch);
        scrollBottom();
        var d = 16 + Math.random() * 38;
        if ('，。！？…；：'.indexOf(ch) >= 0) d += 90 + Math.random() * 130;
        setTimeout(step, d);
      })();
    });
  }

  /* ---------- 假命令 ---------- */
  function handleCommand(text){
    var name = text.split(/\s+/)[0].toLowerCase();
    if (name === '/help'){
      printSys('可用命令:\n  <span class="cmd-name">/help</span>     显示此帮助\n  <span class="cmd-name">/status</span>   查看系统状态\n  <span class="cmd-name">/clear</span>    清空当前会话\n其余一切输入将被当作对话处理.');
    } else if (name === '/status'){
      printSys('┌ SYSTEM STATUS ──────────────────\n' +
        '  神经负载    37%  ▓▓▓▓░░░░░░\n' +
        '  记忆占用    1.2G / 8.0G\n' +
        '  活跃会话    ' + activeName + '\n' +
        '  运行时间    ' + uptime() + '\n' +
        '  情绪状态    平静, 且精确\n' +
        '└─────────────────────────────────');
    } else if (name === '/clear'){
      activeSession.innerHTML = '';
      printSys('[ 会话已清空 — 内存不会说谎, 但它选择原谅 ]');
    } else {
      printSys('未知命令: ' + name + ' — 键入 <span class="cmd-name">/help</span> 查看可用命令', true);
    }
  }

  /* ---------- 主流程：输入 → 思考 → 流式回复 ---------- */
  async function submit(){
    var text = cmd.value.trim();
    if (!text || busy) return;
    busy = true;
    cmd.value = '';
    syncCursor();
    printUser(text);
    if (text.charAt(0) === '/'){
      await sleep(320);
      handleCommand(text);
      busy = false;
      cmd.focus();
      return;
    }
    await think();
    var line = document.createElement('div');
    line.className = 'msg ai-line';
    activeSession.appendChild(line);
    appendInput();
    await typeText(line, REPLIES[replyIdx++ % REPLIES.length]);
    busy = false;
    cmd.focus();
  }
  cmd.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){ e.preventDefault(); submit(); }
  });

  /* ---------- 会话标签 main / scratch ---------- */
  tabs.forEach(function(t){
    t.addEventListener('click', function(){
      if (busy) return;
      var name = t.dataset.session;
      if (name === activeName) return;
      activeName = name;
      activeSession = sessions[name];
      sessions.main.style.display = name === 'main' ? 'block' : 'none';
      sessions.scratch.style.display = name === 'scratch' ? 'block' : 'none';
      tabs.forEach(function(x){ x.classList.toggle('active', x === t); });
      if (name === 'scratch' && !sessions.scratch.dataset.init){
        sessions.scratch.dataset.init = '1';
        printSys('[ scratch ] 草稿会话 — 这里的一切不会被记住.\n但你说过的话, 都算数.');
      }
      appendInput();
      cmd.focus();
      scrollBottom();
    });
  });

  /* 点击会话空白处自动聚焦输入 */
  document.querySelector('.terminal').addEventListener('click', function(e){
    if (e.target === screen && !busy) cmd.focus();
  });

  boot();
})();
</script>
</body>
</html>
