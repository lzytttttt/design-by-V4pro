<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENTROPY · 熵 — 秩序与混沌 AI</title>
<style>
  :root{ --ink:#141414; --paper:#f6f5f2; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,"Microsoft YaHei","PingFang SC",sans-serif;
    background:var(--paper); color:var(--ink); overflow:hidden;
  }
  /* 瑞士网格纸 */
  #paper{position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:linear-gradient(90deg, rgba(17,17,17,.055) 1px, transparent 1px);
    background-size:calc(100%/12) 100%}

  #app{position:relative; z-index:2; height:100%; display:flex; flex-direction:column}

  /* ============ 页眉 ============ */
  header{flex:none; display:flex; justify-content:space-between; align-items:flex-start; padding:36px 48px 0}
  #titleBlock .idx{font-family:Consolas,"Courier New",monospace; font-size:10.5px; letter-spacing:.4em; color:#8a8880; margin-bottom:10px}
  #titleBlock h1{font-size:58px; font-weight:800; letter-spacing:-.02em; line-height:1; color:var(--ink)}
  #titleBlock h1 .cube{display:inline-block; width:17px; height:17px; background:var(--ink); margin-left:14px;
    animation: cubeIdle 11s linear infinite}
  @keyframes cubeIdle{to{transform:rotate(360deg)}}
  #subtitle{font-family:Consolas,"Courier New",monospace; font-size:11px; letter-spacing:.34em; color:#55534c; margin-top:12px}

  #meter{width:236px; border:1.5px solid var(--ink); background:var(--paper); padding:12px 14px; flex:none}
  #meter .mLabel{font-family:Consolas,monospace; font-size:10px; letter-spacing:.32em; color:var(--ink); font-weight:700}
  #meter .mLabel::after{content:"▌"; animation: blk 1.1s steps(1) infinite; margin-left:4px}
  @keyframes blk{50%{opacity:0}}
  .mBar{height:11px; border:1px solid var(--ink); margin:9px 0 8px; padding:1px}
  #mFill{height:100%; width:0%; background:var(--ink); transition: width .8s cubic-bezier(.3,.8,.3,1), background .8s}
  .mNums{display:flex; justify-content:space-between; font-family:Consolas,monospace;
    font-size:11px; font-weight:700; letter-spacing:.14em; color:var(--ink)}
  #mNum{font-size:14px}

  #rule{flex:none; height:3px; background:var(--ink); margin:26px 48px 0}

  /* ============ 对话区 ============ */
  #chatCol{flex:1; overflow-y:auto; padding:30px 48px 18px; min-height:0}
  #chatCol::-webkit-scrollbar{width:9px}
  #chatCol::-webkit-scrollbar-thumb{background:var(--ink)}
  #chat{max-width:700px; display:flex; flex-direction:column; gap:22px}
  body.ritual #chatCol{overflow:visible}

  .msgWrap{will-change:transform, opacity}
  .msg{font-size:14.5px}
  .msg.user{align-self:flex-end; max-width:440px; background:var(--ink); color:#f6f5f2;
    padding:13px 18px; font-weight:500; letter-spacing:.02em; line-height:1.8}
  .msg.agent{align-self:flex-start; max-width:640px; background:#fff; border:1.5px solid var(--ink);
    border-left:7px solid var(--ink); padding:17px 20px 19px;
    animation: cardIn .5s cubic-bezier(.2,.8,.3,1) both}
  @keyframes cardIn{from{opacity:0; transform:translateY(18px)} to{opacity:1; transform:translateY(0)}}
  .who{font-family:Consolas,monospace; font-size:9.5px; letter-spacing:.36em; color:#8a8880;
    margin-bottom:11px; font-weight:700}
  .msg.agent p{transition:none}
  .caret{display:inline-block; color:var(--ink); animation: blk .7s steps(1) infinite; font-weight:900}

  .thinkingMsg{align-self:flex-start; font-family:Consolas,monospace; font-size:12.5px; letter-spacing:.22em;
    color:var(--ink); border:1.5px dashed #6a6862; padding:11px 18px; font-weight:700}
  body.thinking .thinkingMsg{animation: heat .13s steps(2) infinite}
  @keyframes heat{
    0%{transform:translate(0,0) rotate(0)}
    25%{transform:translate(1.6px,-1.2px) rotate(.4deg)}
    50%{transform:translate(-1.4px,1.5px) rotate(-.3deg)}
    75%{transform:translate(1.1px,1.1px) rotate(.2deg)}
    100%{transform:translate(0,0) rotate(0)}
  }

  /* ============ 输入区 ============ */
  #dockZone{flex:none; padding:6px 48px 30px}
  #chips{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px}
  .chip{font:inherit; font-size:12px; letter-spacing:.1em; cursor:pointer; background:transparent;
    border:1.5px solid var(--ink); color:var(--ink); padding:7px 16px; font-weight:600; transition:all .22s}
  .chip:hover{background:var(--ink); color:#f6f5f2}
  body.thinking .chip{animation: heat .12s steps(2) infinite}
  body.thinking .chip:nth-child(2){animation-delay:.04s}
  body.thinking .chip:nth-child(3){animation-delay:.08s}

  #inputRow{display:flex; gap:0; max-width:700px; will-change:transform}
  body.thinking #inputRow{animation: heat .11s steps(2) infinite}
  #ask{flex:1; font:inherit; font-size:15px; color:var(--ink); background:#fff;
    border:1.5px solid var(--ink); border-right:none; padding:15px 18px; outline:none; letter-spacing:.03em}
  #ask::placeholder{color:#9b9990; letter-spacing:.12em}
  #ask:focus{box-shadow:inset 0 -3px 0 var(--ink)}
  #sendBtn{flex:none; width:118px; cursor:pointer; font:inherit; font-weight:800; font-size:14px;
    letter-spacing:.4em; text-indent:.4em; color:#f6f5f2; background:var(--ink); border:1.5px solid var(--ink);
    transition:transform .1s, filter .2s}
  #sendBtn:hover{filter:brightness(1.35)}
  #sendBtn:active, #sendBtn.pressed{transform:scale(.96)}
  #inputRow.shake{animation: shk .4s}
  @keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  footer{position:fixed; left:48px; bottom:26px; z-index:3;
    font-family:Consolas,monospace; font-size:9.5px; letter-spacing:.3em; color:#8a8880}

  /* ============ 新纪元印章 ============ */
  #eraStamp{position:fixed; right:42px; bottom:30px; z-index:80; display:none;
    border:3px solid #c0392b; color:#c0392b; padding:9px 14px; text-align:center;
    transform:rotate(-8deg); mix-blend-mode:multiply; font-weight:900}
  #eraStamp.show{display:block; animation: stampIn .45s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes stampIn{from{transform:rotate(-8deg) scale(2); opacity:0} to{transform:rotate(-8deg) scale(1); opacity:1}}
  #eraStamp .s1{font-size:15px; letter-spacing:.34em; text-indent:.34em; display:block}
  #eraStamp .s2{font-family:Consolas,monospace; font-size:11px; letter-spacing:.2em; display:block; margin-top:3px}

  #toast{position:fixed; left:50%; bottom:120px; transform:translateX(-50%); z-index:90;
    font-family:Consolas,monospace; font-size:12px; letter-spacing:.2em; color:#f6f5f2;
    background:var(--ink); padding:9px 22px; opacity:0; pointer-events:none; transition:opacity .3s}
  #toast.show{opacity:1}

  @media (max-width:820px){
    header{padding:22px 20px 0}
    #titleBlock h1{font-size:38px}
    #meter{width:170px}
    #rule{margin:16px 20px 0}
    #chatCol{padding:20px 20px 10px}
    #dockZone{padding:4px 20px 20px}
    footer{left:20px}
    #eraStamp{right:18px}
  }
</style>
</head>
<body>

<div id="paper"></div>
<div id="eraStamp"><span class="s1">新纪元</span><span class="s2" id="eraNo">II</span></div>

<div id="app">
  <header>
    <div id="titleBlock">
      <div class="idx">SPECIMEN NO.50 / AI NATIVE SERIES</div>
      <h1>ENTROPY<span class="cube"></span></h1>
      <div id="subtitle">熵 · 秩序与混沌系统 — FROM BAUHAUS TO CHAOS</div>
    </div>
    <div id="meter">
      <div class="mLabel">ENTROPY 熵值</div>
      <div class="mBar"><div id="mFill"></div></div>
      <div class="mNums"><span id="eraLabel">纪元 I</span><span id="mNum">0%</span></div>
    </div>
  </header>
  <div id="rule"></div>

  <main id="chatCol"><div id="chat"></div></main>

  <div id="dockZone">
    <div id="chips">
      <button class="chip" data-q="我总是控制不住地陷入混乱">我总是控制不住地陷入混乱</button>
      <button class="chip" data-q="如何对抗拖延和熵增？">如何对抗拖延和熵增？</button>
      <button class="chip" data-q="完美主义让我很累">完美主义让我很累</button>
    </div>
    <div id="inputRow">
      <input id="ask" type="text" placeholder="输入信息，为系统注入能量…" autocomplete="off" maxlength="120">
      <button id="sendBtn">注入</button>
    </div>
  </div>
</div>

<footer>ENTROPY ENGINE · 一切自发过程总是向着概率增大的方向进行</footer>
<div id="toast"></div>

<script>
(function(){
  "use strict";
  var chat = document.getElementById('chat');
  var chatCol = document.getElementById('chatCol');
  var ask = document.getElementById('ask');
  var sendBtn = document.getElementById('sendBtn');
  var inputRow = document.getElementById('inputRow');
  var mFill = document.getElementById('mFill');
  var mNum = document.getElementById('mNum');
  var eraLabel = document.getElementById('eraLabel');
  var eraStamp = document.getElementById('eraStamp');
  var eraNo = document.getElementById('eraNo');
  var toast = document.getElementById('toast');

  var ROMAN = ["I","II","III","IV","V","VI","VII","VIII","IX","X"];
  var E = 0, era = 1, busy = false, ritualing = false;
  var replyIdx = Math.floor(Math.random()*5), replyCount = 0;

  var REPLIES = [
    "秩序不是天然状态，而是持续付出的代价。宇宙的默认选项是均匀的温吞——你书桌上的整洁、你日程表的规律，都是逆流而上的成果。\n所以别为失控自责，那只是物理规律在收利息。真正的问题是：你愿意为哪一小块秩序，支付一生的能量？",
    "你感觉到的混乱，其实是信息在涌入。熵增的另一个名字叫「可能性」——房间变乱的方式有无数种，变整洁的方式只有寥寥几种。\n选择变少的时刻才值得警惕。混乱，说明你还站在生长的分支上。",
    "我建议区分两种无序：热寂型的无序——一切都摊平、无所谓、失去张力；以及创造型的无序——旧结构瓦解、新结构尚未定型的间隙。\n后者是所有重塑的必经之地。你现在的乱，属于哪一种？",
    "对抗熵增最经济的策略不是彻底清理，而是建立「耗散结构」：让系统持续开放，用流入的能量维持内部的秩序——流水不腐，因为它一直在流动。\n你的晨间例程、每周复盘、定期告别，都是你的河流。",
    "完美秩序是死亡的近义词——晶体很美，但它不再变化。生命恰恰活在秩序与混沌的交界带上：太有序则僵死，太混乱则解体。\n你不必追求井井有条，只需要守在这条边界上。我自己，也一样。"
  ];
  var WELCOME = "你好，我是 ENTROPY。我管理着一条从包豪斯到混沌的完整光谱。\n每一次对话都会为这个系统注入能量——你会亲眼看着秩序如何瓦解、色彩如何渗入；而在百分之百的混乱之后，是重生。";

  /* ---------- 熵化元素注册 ---------- */
  var entEls = [];
  function tag(el, amp, hue, mode){
    el.dataset.rx = (Math.random()*2-1).toFixed(3);
    el.dataset.ox = (Math.random()*2-1).toFixed(3);
    el.dataset.oy = (Math.random()*2-1).toFixed(3);
    el.dataset.amp = (amp==null?1:amp);
    if(hue!=null) el.dataset.hue = hue;
    if(mode) el.dataset.mode = mode;
    entEls.push(el);
    styleEnt(el, E/100);
    return el;
  }
  var titleBlock = tag(document.getElementById('titleBlock'), .55, null);
  tag(document.getElementById('subtitle'), .8, 205, 'color');
  tag(document.getElementById('rule'), .4);
  var chips = document.querySelectorAll('.chip');
  Array.prototype.forEach.call(chips, function(c){ tag(c, 1, 160, 'chip'); });
  tag(document.getElementById('sendBtn'), 1, 25, 'btn');
  tag(document.querySelector('footer'), .8, 265, 'color');
  tag(document.getElementById('meter'), .12);

  function hsl(h, s, l){ return 'hsl('+h+','+Math.round(s)+'%,'+Math.round(l)+'%)'; }

  function styleEnt(el, t){
    var amp = parseFloat(el.dataset.amp)||1;
    var rot = (parseFloat(el.dataset.rx)||0)*8*t*amp;
    var dx = (parseFloat(el.dataset.ox)||0)*15*t*amp;
    var dy = (parseFloat(el.dataset.oy)||0)*11*t*amp;
    el.style.transform = 'translate('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px) rotate('+rot.toFixed(2)+'deg)';
    var hue = el.dataset.hue;
    if(hue!=null){
      var h = parseFloat(hue);
      if(el.dataset.mode==='color') el.style.color = hsl(h, t*72, 17+t*16);
      else if(el.dataset.mode==='chip'){
        el.style.color = hsl(h, t*70, 20+t*16);
        el.style.borderColor = hsl(h, t*70, 30+t*12);
      } else if(el.dataset.mode==='btn'){
        el.style.background = hsl(h, t*88, 16+t*24);
        el.style.borderColor = hsl(h, t*88, 16+t*24);
      } else if(el.dataset.mode==='border'){
        el.style.borderColor = hsl(h, t*65, 25+t*15);
      }
    }
  }

  function applyEntropy(){
    var t = E/100;
    for(var i=0;i<entEls.length;i++) styleEnt(entEls[i], t);
    inputRow.style.transform = 'rotate('+(t*4.5).toFixed(2)+'deg) skewX('+(-t*6).toFixed(2)+'deg)';
    mFill.style.width = E+'%';
    mFill.style.background = hsl(350, t*68, 20+t*16);
    mNum.textContent = Math.round(E)+'%';
    eraLabel.textContent = '纪元 '+ROMAN[Math.min(era-1,9)];
  }
  applyEntropy();

  /* ---------- 消息 ---------- */
  function scrollBottom(){ chatCol.scrollTop = chatCol.scrollHeight; }

  function addUser(text){
    var wrap = document.createElement('div');
    wrap.className = 'msgWrap';
    var msg = document.createElement('div');
    msg.className = 'msg user';
    msg.textContent = text;
    wrap.appendChild(msg);
    chat.appendChild(wrap);
    tag(wrap, 1);
    scrollBottom();
  }

  function streamAgent(text, done){
    replyCount++;
    var wrap = document.createElement('div');
    wrap.className = 'msgWrap';
    var msg = document.createElement('div');
    msg.className = 'msg agent';
    msg.innerHTML = '<div class="who">ENTROPY · 响应 №'+String(replyCount).padStart(2,'0')+'</div>';
    wrap.appendChild(msg);
    chat.appendChild(wrap);
    tag(wrap, 1, null);
    var t0 = E/100;
    msg.style.borderColor = hsl(265, t0*65, 25+t0*15);
    msg.style.borderLeftColor = hsl(265, t0*65, 20+t0*18);

    var paras = text.split('\n');
    var t = E/100;
    var pi = 0;
    var caret = document.createElement('span');
    caret.className = 'caret'; caret.textContent = '▌';

    function nextPara(){
      if(pi >= paras.length){
        if(done) done();
        return;
      }
      var p = document.createElement('p');
      p.style.letterSpacing = (0.02 + pi*0.05 + t*0.1).toFixed(3)+'em';
      p.style.lineHeight = (1.9 + pi*0.14 + t*0.18).toFixed(2);
      p.style.marginTop = pi>0 ? '10px' : '0';
      p.appendChild(caret);
      msg.appendChild(p);
      var str = paras[pi]; var i = 0;
      var timer = setInterval(function(){
        if(i >= str.length){
          clearInterval(timer);
          pi++;
          nextPara();
          return;
        }
        p.insertBefore(document.createTextNode(str[i++]), caret);
        scrollBottom();
      }, 44);
    }
    nextPara();
    scrollBottom();
  }

  /* ---------- 思考（热扰动） ---------- */
  function thinkThenReply(){
    busy = true;
    document.body.classList.add('thinking');
    var holder = document.createElement('div');
    holder.className = 'thinkingMsg';
    holder.textContent = '热扰动中 · 正在计算无序度…';
    chat.appendChild(holder);
    scrollBottom();
    var wait = 1600 + Math.random()*1200;
    setTimeout(function(){
      holder.remove();
      document.body.classList.remove('thinking');
      streamAgent(REPLIES[replyIdx % REPLIES.length], function(){
        increaseEntropy();
      });
      replyIdx++;
    }, wait);
  }

  function increaseEntropy(){
    E = Math.min(100, E + 13 + Math.random()*5);
    applyEntropy();
    busy = false;
    ask.focus();
    if(E >= 100){
      setTimeout(ritual, 900);
    }
  }

  /* ---------- 重置仪式：崩解 → 重生 ---------- */
  function ritual(){
    if(ritualing) return;
    ritualing = true; busy = true;
    document.body.classList.add('ritual');
    var els = entEls.slice();
    els.push(inputRow);
    var vw = window.innerWidth, vh = window.innerHeight;
    var centers = els.map(function(el){
      var r = el.getBoundingClientRect();
      return {cx: r.left + r.width/2 - vw/2, cy: r.top + r.height/2 - vh/2};
    });
    /* 崩解 */
    els.forEach(function(el){
      el.style.transition = 'transform .9s cubic-bezier(.45,0,.85,.4), opacity .9s ease-in';
      el.style.transform = 'translate(' + ((Math.random()*2-1)*620).toFixed(0) + 'px,' +
        ((Math.random()*2-1)*430).toFixed(0) + 'px) rotate(' + ((Math.random()*2-1)*540).toFixed(0) + 'deg) scale(.45)';
      el.style.opacity = '0';
    });
    /* 重组 */
    setTimeout(function(){
      E = 0;
      applyEntropy();
      els.forEach(function(el, i){
        el.style.transition = 'none';
        var c = centers[i];
        el.style.transform = 'translate('+c.cx.toFixed(0)+'px,'+c.cy.toFixed(0)+'px) scale(.12) rotate('+((Math.random()*2-1)*40).toFixed(0)+'deg)';
        el.style.opacity = '0';
      });
      void document.body.offsetWidth;
      els.forEach(function(el, i){
        el.style.transition = 'transform .85s cubic-bezier(.2,.85,.25,1), opacity .7s ease-out';
        el.style.transitionDelay = (i*0.055)+'s';
        el.style.transform = '';
        el.style.opacity = '1';
      });
    }, 1050);
    /* 定格 */
    setTimeout(function(){
      els.forEach(function(el){
        el.style.transition = '';
        el.style.transitionDelay = '';
      });
      era++;
      eraNo.textContent = ROMAN[Math.min(era-1,9)];
      eraStamp.classList.remove('show');
      void eraStamp.offsetWidth;
      eraStamp.classList.add('show');
      document.body.classList.remove('ritual');
      applyEntropy();
      scrollBottom();
      showToast('系统已重组 · 第 '+era+' 纪元开始');
      ritualing = false; busy = false;
      ask.focus();
    }, 2400);
  }

  var toastTimer = null;
  function showToast(t){
    toast.textContent = t;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2400);
  }

  function send(raw){
    var t = (raw||'').trim();
    if(!t) return;
    if(busy){
      inputRow.classList.remove('shake');
      void inputRow.offsetWidth;
      inputRow.classList.add('shake');
      showToast(ritualing ? '系统正在重组，请稍候' : '能量尚未耗散完毕，请稍候');
      return;
    }
    addUser(t);
    ask.value = '';
    thinkThenReply();
  }

  sendBtn.addEventListener('click', function(){
    sendBtn.classList.add('pressed');
    setTimeout(function(){ sendBtn.classList.remove('pressed'); }, 150);
    send(ask.value);
  });
  ask.addEventListener('keydown', function(e){ if(e.key === 'Enter') send(ask.value); });
  Array.prototype.forEach.call(chips, function(c){
    c.addEventListener('click', function(){ send(c.getAttribute('data-q')); });
  });

  setTimeout(function(){ streamAgent(WELCOME, null); }, 650);
})();
</script>
</body>
</html>
