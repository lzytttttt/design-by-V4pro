<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PULSE · 脉搏 — 生命体征监测智能体</title>
<style>
:root{--g:#22c55e;--gdim:rgba(34,197,94,.35)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  overflow:hidden;background:#050505;color:#d7ffe4;
  font-family:"SFMono-Regular",Consolas,"Courier New",monospace;
  background-image:
    linear-gradient(rgba(34,197,94,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(34,197,94,.05) 1px,transparent 1px);
  background-size:52px 52px;
}
.wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
  align-items:center;padding:36px 40px 32px}
/* 心跳节律脉动 */
.beatable{transition:transform .13s cubic-bezier(.3,.7,.4,1)}
.beat-on{transform:scale(1.011)}
.title{font-family:Georgia,"Times New Roman","Songti SC",serif;text-align:center}
.title h1{font-size:clamp(46px,6.5vw,84px);letter-spacing:.2em;color:#eafff0;line-height:1;font-weight:400}
.title p{margin-top:12px;font-size:10.5px;letter-spacing:.8em;color:var(--g);text-indent:.8em}
/* 生命体征读数 */
.vitals{display:flex;gap:52px;margin-top:24px}
.vital{text-align:center;min-width:90px}
.vital .n{font-size:30px;color:var(--g);font-weight:700;
  text-shadow:0 0 16px rgba(34,197,94,.5);font-variant-numeric:tabular-nums}
.vital .n small{font-size:12px;font-weight:400;color:#3f7a52;margin-left:4px}
.vital .l{font-size:9px;letter-spacing:.42em;color:#3f7a52;margin-top:7px;text-indent:.42em}
/* 监测仪窗口 */
.monitor{margin-top:24px;position:relative;width:min(880px,92vw);height:236px;
  border:1px solid var(--gdim);background:#020602}
#ecg{width:100%;height:100%;display:block;background:#020602;
  background-image:
    linear-gradient(rgba(34,197,94,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(34,197,94,.08) 1px,transparent 1px);
  background-size:44px 44px}
.monitor::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 2px,transparent 2px 4px)}
.monitor .tag{position:absolute;top:-1px;left:-1px;font-size:9px;letter-spacing:.32em;
  color:var(--g);background:#050505;padding:5px 12px;border:1px solid var(--gdim);z-index:2}
.monitor .lead{position:absolute;bottom:-1px;right:-1px;font-size:9px;letter-spacing:.28em;
  color:#3f7a52;background:#050505;padding:5px 12px;border:1px solid rgba(34,197,94,.2);z-index:2}
/* 病历卡：对话区 */
.record{margin-top:22px;width:min(880px,92vw);flex:1;min-height:0;overflow:hidden;
  border:1px solid rgba(34,197,94,.22);background:rgba(2,10,4,.5);padding:16px 26px;
  font-size:13px;line-height:2}
.record .head{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.35em;
  color:#4c8a5e;border-bottom:1px dashed rgba(34,197,94,.25);padding-bottom:9px;margin-bottom:12px}
.entry{margin-bottom:13px;animation:prin .4s steps(3) both}
@keyframes prin{from{opacity:0}to{opacity:1}}
.entry .t{color:#4c8a5e;font-size:10.5px;letter-spacing:.16em}
.entry .q{color:#a7f3c0;margin:3px 0 5px}
.entry .r{color:#d9ffe6}
.entry .r .ln{display:block;white-space:pre-wrap}
.entry .r .num{color:#7CFC9A;font-weight:700;font-variant-numeric:tabular-nums}
.caret{display:inline-block;width:8px;height:15px;background:var(--g);
  vertical-align:-2px;animation:blinkc 1s steps(1) infinite;margin-left:2px}
@keyframes blinkc{50%{opacity:0}}
/* 仪器操作按钮风格输入 */
#ask{margin-top:20px;display:flex;gap:14px;width:min(880px,92vw)}
#ask .box{position:relative;flex:1;padding:14px 18px;border:1px solid var(--gdim);
  background:rgba(2,12,4,.6);display:flex;align-items:center}
#ask .box::before,#ask .box::after{content:"";position:absolute;width:10px;height:10px;border:1px solid var(--g)}
#ask .box::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
#ask .box::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
#ask input{flex:1;min-width:0;background:none;border:0;outline:0;color:#eafff0;
  font:14px Consolas,"Courier New",monospace;letter-spacing:.06em;caret-color:var(--g)}
#ask input::placeholder{color:#3f7a52;letter-spacing:.22em}
#ask button{width:126px;border:1px solid var(--g);background:rgba(34,197,94,.08);
  color:var(--g);font:12px Consolas,monospace;letter-spacing:.4em;text-indent:.4em;
  cursor:pointer;transition:.25s}
#ask button:hover{background:rgba(34,197,94,.22);box-shadow:0 0 22px rgba(34,197,94,.25)}
#ask button:active{background:rgba(34,197,94,.35)}
/* 顶部系统状态 */
.sys{position:fixed;top:38px;right:44px;z-index:5;font-size:10px;letter-spacing:.3em;color:#4c8a5e}
.sys b{color:var(--g);font-weight:400}
@media(max-width:820px){
  .vitals{gap:26px}.vital .n{font-size:22px}
  .record{font-size:11.5px;padding:12px 16px}
  .sys{position:static;margin-bottom:6px}
}
</style>
</head>
<body>
<div class="sys">SYS ▸ <b id="sysLab">MONITORING · 监测中</b></div>

<div class="wrap">
  <div class="title beatable">
    <h1>PULSE</h1>
    <p>脉搏 · 生命体征监测智能体</p>
  </div>

  <div class="vitals beatable">
    <div class="vital"><div class="n"><span id="hrN">72</span><small>bpm</small></div><div class="l">心率 HR</div></div>
    <div class="vital"><div class="n"><span id="spo2">98</span><small>%</small></div><div class="l">血氧 SPO2</div></div>
    <div class="vital"><div class="n"><span id="respN">16</span><small>/min</small></div><div class="l">呼吸 RESP</div></div>
    <div class="vital"><div class="n"><span id="temp">36.5</span><small>°C</small></div><div class="l">体温 TEMP</div></div>
  </div>

  <div class="monitor beatable">
    <span class="tag">LEAD II · 25mm/s</span>
    <canvas id="ecg"></canvas>
    <span class="lead">CYGNUS MEDICAL OS</span>
  </div>

  <div class="record beatable">
    <div class="head"><span>问诊记录 · MEDICAL RECORD</span><span id="mrId">MR-000000</span></div>
    <div id="entries"></div>
  </div>

  <form id="ask" autocomplete="off" class="beatable">
    <div class="box"><input id="q" type="text" maxlength="60" placeholder="输入主诉，仪器将给出诊断…"></div>
    <button type="submit">发送</button>
  </form>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const ecg=$('#ecg'),ex=ecg.getContext('2d');
const entries=$('#entries'),form=$('#ask'),input=$('#q');
const hrN=$('#hrN'),spo2El=$('#spo2'),respN=$('#respN'),sysLab=$('#sysLab');
$('#mrId').textContent='MR-'+String(100000+Math.floor(Math.random()*899999));

let EW=0,EH=0;
function sizeEcg(){
  const r=ecg.getBoundingClientRect();
  const d=Math.min(window.devicePixelRatio||1,2);
  EW=r.width;EH=r.height;
  ecg.width=EW*d;ecg.height=EH*d;
  ex.setTransform(d,0,0,d,0,0);
  sweepX=0;lastY=null;
}
addEventListener('resize',sizeEcg);

/* ---------- 心电引擎 ---------- */
let phase=0,hr=72,hrT=72,sweepX=0,lastY=null;
let special=0,pendingSpecial=false,thinkMix=0,mode='idle',busy=false,bt=0;

function beatShape(p){
  /* PQRST 复合波 */
  let y=0;
  const g=(c,w,a)=>a*Math.exp(-((p-c)**2)/(2*w*w));
  y+=g(.15,.035,.10);
  y+=g(.28,.012,-.14);
  y+=g(.31,.013,1);
  y+=g(.34,.012,-.24);
  y+=g(.55,.055,.24);
  if(special){y+=g(.31,.016,1.6);y-=g(.52,.07,.3);} /* 漏拍式剧烈跳动 */
  return y;
}
function onBeat(){
  document.querySelectorAll('.beatable').forEach(el=>el.classList.add('beat-on'));
  clearTimeout(bt);
  bt=setTimeout(()=>document.querySelectorAll('.beatable').forEach(el=>el.classList.remove('beat-on')),130);
}

function ecgTick(dt){
  hrT=(mode==='think')?142:72;
  hr+=(hrT-hr)*Math.min(1,dt*1.1);
  hrN.textContent=Math.round(hr);
  thinkMix+=(((mode==='think')?1:0)-thinkMix)*Math.min(1,dt*2);
  respN.textContent=Math.round(16+thinkMix*8);
  phase+=dt*hr/60;
  if(phase>=1){
    phase-=1;
    if(pendingSpecial){special=1;pendingSpecial=false;}else special=0;
    onBeat();
  }
  const mid=EH*.58,amp=EH*.32;
  let y=mid-beatShape(phase)*amp;
  y+=(Math.random()-.5)*(1.2+thinkMix*9); /* 思考态：密集锯齿噪声 */
  if(lastY===null||sweepX===0)lastY=y;
  ex.strokeStyle='#22c55e';ex.lineWidth=2;ex.lineJoin='round';
  ex.shadowColor='rgba(34,197,94,.7)';ex.shadowBlur=6;
  ex.beginPath();ex.moveTo(sweepX-1.5,lastY);ex.lineTo(sweepX,y);ex.stroke();
  ex.shadowBlur=0;
  ex.fillStyle='rgba(190,255,205,.95)';
  ex.fillRect(sweepX-1,y-1.5,3,3);
  lastY=y;
  /* 横扫式滚动：擦除前方列 */
  ex.clearRect(sweepX+1.5,0,16,EH);
  sweepX+=150*dt;
  if(sweepX>=EW){sweepX=0;lastY=null;}
}
let lastT=performance.now();
function loop(nw){
  const dt=Math.min(.05,(nw-lastT)/1000);lastT=nw;
  ecgTick(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(()=>{sizeEcg();requestAnimationFrame(loop);});

/* ---------- 病历卡对话 ---------- */
const REPLIES=[
  {lines:['【诊断报告】','主诉：关于意义感的探询。','评估：思维活跃度偏高，属健康范围，未见病理性反刍。','建议：将大问题切分为小剂量，每日服用，饭后阅读。','置信度 {{0}} · 参考病例 {{1}} 份'],
   nums:[{v:.94,d:2},{v:4096,d:0}]},
  {lines:['监测到本次提问伴随心率上升约 {{0}} bpm。','提示：这说明该问题对你具有重要性——重要的问题值得慢慢回答。','医嘱：答案通常位于文献与直觉之间，偏后者。'],
   nums:[{v:6,d:0}]},
  {lines:['【体征摘要】今日提问质量评级：优。','建议摄入：一段散步，两页闲书，三次深呼吸。','注意：过度思考时心率变异性下降，请适度放空。','本次会话耗时 {{0}} 秒，全部有效。'],
   nums:[{v:23,d:0}]},
  {lines:['波形提示：近期焦虑指数轻度升高。','好消息：焦虑与专注在生理上只差一次深呼吸。','处方：4-7-8 呼吸法，每日三次，随心跳复查。','预计缓解时间 {{0}} 分钟。'],
   nums:[{v:12,d:0}]},
  {lines:['【病史对照】完成。','上次类似提问：{{0}} 天前，措辞相似度 {{1}}。','结论：两次心境不同——你在好转。','建议：继续保持提问频率。'],
   nums:[{v:41,d:0},{v:.87,d:2}]}
];
let ri=0;

const wait=ms=>new Promise(r=>setTimeout(r,ms));
function stamp(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function setSys(t){sysLab.textContent=t;}

function addEntry(q){
  const e=document.createElement('div');e.className='entry';
  const t=document.createElement('div');t.className='t';
  t.textContent=stamp()+' · 问诊 QUERY';
  const qd=document.createElement('div');qd.className='q';
  qd.textContent='▸ '+q;
  e.append(t,qd);
  entries.appendChild(e);
  while(entries.children.length>3)entries.firstChild.remove();
  return e;
}
function rollNum(el,target,dec){
  const t0=performance.now(),dur=900;
  (function u(n){
    const k=Math.min(1,(n-t0)/dur),e=1-Math.pow(1-k,3);
    el.textContent=(target*e).toFixed(dec);
    if(k<1)requestAnimationFrame(u);
  })(t0);
}
async function streamReply(entry,rep){
  const r=document.createElement('div');r.className='r';
  const caret=document.createElement('span');caret.className='caret';
  entry.appendChild(r);
  for(const line of rep.lines){
    const ln=document.createElement('span');ln.className='ln';
    r.appendChild(ln);ln.appendChild(caret);
    const parts=line.split(/(\{\{\d\}\})/);
    for(const p of parts){
      const m=p.match(/^\{\{(\d)\}\}$/);
      if(m){
        const num=rep.nums[+m[1]];
        const b=document.createElement('b');b.className='num';
        b.textContent=(0).toFixed(num.d);
        ln.insertBefore(b,caret);
        rollNum(b,num.v,num.d);
        await wait(340);
      }else{
        for(const ch of p){
          ln.insertBefore(document.createTextNode(ch),caret);
          await wait(15);
        }
      }
    }
    await wait(220);
  }
  caret.remove();
}

form.addEventListener('submit',async e=>{
  e.preventDefault();
  const v=input.value.trim();
  if(!v||busy)return;
  busy=true;input.value='';
  const entry=addEntry(v);
  pendingSpecial=true;                 /* 标志性瞬间：心跳漏拍 */
  mode='think';setSys('ANALYZING · 分析中');
  await wait(1700+Math.random()*1100);
  mode='reply';setSys('REPORTING · 报告生成中');
  const rep=REPLIES[ri++%REPLIES.length];
  await streamReply(entry,rep);
  mode='idle';setSys('MONITORING · 监测中');
  busy=false;
});
</script>
</body>
</html>
