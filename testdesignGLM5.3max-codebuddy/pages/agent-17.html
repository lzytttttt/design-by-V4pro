<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GRAVITY WELL · 引力井</title>
<style>
:root{
  --bg:#0b1120;
  --ink:#dbe6f5;
  --dim:#7285a6;
  --blue:#7fb0ff;
  --line:rgba(120,160,235,.22);
  --mono:"Cascadia Mono",Consolas,"SF Mono",ui-monospace,Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);overflow:hidden;height:100vh;
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
#grid{position:fixed;inset:0;z-index:0}

/* ---------- 中央质量体 ---------- */
#coreWrap{position:fixed;left:50%;top:54%;z-index:2;width:0;height:0}
#core{position:absolute;left:-56px;top:-56px;width:112px;height:112px;border-radius:50%;
  background:radial-gradient(circle at 36% 32%,#f2f7ff 0%,#bcd4ff 18%,#5f8fe8 45%,#1e3f8f 70%,#0a1c4d 100%);
  box-shadow:0 0 46px 14px rgba(120,170,255,.28),
    0 0 130px 58px rgba(80,120,255,.13),
    inset -12px -16px 34px rgba(2,10,36,.65);
  animation:pulse 4.6s ease-in-out infinite}
@keyframes pulse{
  0%,100%{transform:scale(1);box-shadow:0 0 46px 14px rgba(120,170,255,.28),
    0 0 130px 58px rgba(80,120,255,.13),inset -12px -16px 34px rgba(2,10,36,.65)}
  50%{transform:scale(1.07);box-shadow:0 0 66px 20px rgba(140,185,255,.4),
    0 0 160px 70px rgba(90,135,255,.2),inset -12px -16px 34px rgba(2,10,36,.65)}
}
body.thinking #core{animation:pulseFast .8s ease-in-out infinite}
@keyframes pulseFast{
  0%,100%{transform:scale(1.04)}
  50%{transform:scale(1.15)}
}
#coreFlash{position:absolute;left:-56px;top:-56px;width:112px;height:112px;border-radius:50%;
  pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(220,236,255,.95),rgba(140,180,255,0) 70%)}
#coreFlash.on{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:1;transform:scale(.7)}100%{opacity:0;transform:scale(2.6)}}

#thinkTip{position:absolute;left:-90px;top:22px;width:180px;text-align:center;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;color:#9db8e8;
  opacity:0;transition:opacity .4s;animation:blink 1.1s ease-in-out infinite}
body.thinking #thinkTip{opacity:1}
@keyframes blink{0%,100%{opacity:.45}50%{opacity:1}}

/* ---------- 任务块 ---------- */
.task{position:fixed;z-index:3;width:14px;height:14px;pointer-events:none;
  background:linear-gradient(135deg,#dbeaff,#6f9df0);
  border:1px solid rgba(210,230,255,.9);box-shadow:0 0 14px rgba(120,170,255,.8)}

/* ---------- 回复流 ---------- */
#replies{position:fixed;left:50%;transform:translateX(-50%);bottom:31vh;z-index:4;
  width:min(640px,88vw);display:flex;flex-direction:column;gap:10px;
  max-height:38vh;justify-content:flex-end;
  mask-image:linear-gradient(transparent,#000 12%)}
.rep{background:rgba(14,22,42,.78);backdrop-filter:blur(6px);
  border:1px solid var(--line);border-radius:11px;padding:13px 17px;
  box-shadow:0 8px 30px rgba(2,8,24,.5);
  animation:repIn .65s cubic-bezier(.16,1.35,.3,1) forwards;transform-origin:50% 100%}
@keyframes repIn{from{opacity:0;transform:translateY(64px) scale(.82)}to{opacity:1;transform:none}}
.rep.out{transition:opacity .4s,transform .4s;opacity:0;transform:scale(.9)}
.rep-tag{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:#8fa8d8;
  margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rep-tag b{color:#a9c6ff;font-weight:400}
.rep p{font-size:14.5px;line-height:1.95;color:#d7e3f7;margin-bottom:6px}
.rep p:last-child{margin-bottom:0}
.snt{opacity:0;transform:translateY(7px);animation:sntIn .5s ease forwards}
@keyframes sntIn{to{opacity:1;transform:none}}

/* ---------- HUD ---------- */
.hud{position:fixed;z-index:5;font-family:var(--mono)}
.hud-tl{left:26px;top:22px}
.hud-tl b{display:block;font-size:15px;letter-spacing:.3em;color:#cfe0ff;font-weight:600}
.hud-tl span{display:block;margin-top:5px;font-size:10px;letter-spacing:.3em;color:#5c7099}
.hud-tr{right:26px;top:24px;font-size:10.5px;letter-spacing:.18em;color:#7285a6;text-align:right;line-height:1.9}
.hud-tr em{font-style:normal;color:#a9c6ff}

/* ---------- 输入 ---------- */
#io{position:fixed;left:50%;transform:translateX(-50%);bottom:56px;z-index:6;
  width:min(620px,88vw);display:flex;align-items:center;gap:12px;
  border-bottom:1px solid rgba(255,255,255,.28);padding:8px 4px;transition:border-color .3s}
#io:focus-within{border-color:rgba(160,195,255,.75)}
#ask{flex:1;background:none;border:none;outline:none;color:#eaf1ff;
  font-size:14.5px;letter-spacing:.03em;caret-color:#9fc4ff;font-family:inherit}
#ask::placeholder{color:#4e5f80}
#drop{background:rgba(130,170,255,.1);border:1px solid rgba(150,185,255,.45);color:#bcd4ff;
  font-family:var(--mono);font-size:11px;letter-spacing:.22em;padding:8px 20px;cursor:pointer;
  border-radius:4px;transition:.25s}
#drop:hover{background:rgba(130,170,255,.22);box-shadow:0 0 14px rgba(120,170,255,.35)}
#drop:disabled{opacity:.35;cursor:default}
.io-hint{position:fixed;left:50%;transform:translateX(-50%);bottom:30px;z-index:6;
  font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:#3e4f70;white-space:nowrap}

@media(max-width:760px){
  #replies{bottom:36vh}
  .hud-tr{display:none}
}
</style>
</head>
<body>
<canvas id="grid"></canvas>

<div id="coreWrap">
  <div id="core"></div>
  <div id="coreFlash"></div>
  <div id="thinkTip">引力坍缩中 · 质量整合</div>
</div>

<div class="hud hud-tl"><b>GRAVITY WELL</b><span>引力井 · 任务引力引擎</span></div>
<div class="hud hud-tr" id="stat">捕获 <em id="stCap">0</em> · 在轨 <em id="stOrb">0</em> · 场强 <em>1.00 G</em></div>

<main id="replies"></main>

<div id="io">
  <input id="ask" type="text" placeholder="向引力井投掷一个问题…" autocomplete="off">
  <button id="drop">投放</button>
</div>
<div class="io-hint">ENTER 投放 · 问题将被引力捕获 · 坍缩 · 求解</div>

<script>
/* ==================== 弯曲空间网格 ==================== */
const cv=document.getElementById('grid'),g=cv.getContext('2d');
let W=0,H=0,CX=0,CY=0,dpr=Math.min(window.devicePixelRatio||1,2);
const GRID=44,WR=250,DEPTH=112,FOC=520;
let waveAmp=1.4,waveTarget=1.4,gt=0;
const orbits=[];

function resize(){
  W=innerWidth;H=innerHeight;CX=W/2;CY=H*.54;
  cv.width=W*dpr;cv.height=H*dpr;
  cv.style.width=W+'px';cv.style.height=H+'px';
  g.setTransform(dpr,0,0,dpr,0,0);
}
resize();addEventListener('resize',resize);

function proj(x,y){ /* 世界坐标 → 屏幕坐标（含引力井形变） */
  const d=Math.sqrt(x*x+y*y);
  const z=DEPTH/(1+(d/WR)*(d/WR))+waveAmp*Math.sin(gt*4+d*.032);
  const s=FOC/(FOC+z);
  return [CX+x*s,CY+y*s+z*.5];
}
function drawLine(pts,alpha){
  g.strokeStyle='rgba(96,140,215,'+alpha+')';
  g.lineWidth=1;
  g.beginPath();
  for(let i=0;i<pts.length;i++){
    const p=pts[i];
    i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]);
  }
  g.stroke();
}
function drawGrid(){
  g.clearRect(0,0,W,H);
  const spanX=Math.ceil(W/2/GRID)+2,spanY=Math.ceil(H/2/GRID)+3;
  for(let gy=-spanY;gy<=spanY;gy++){ /* 横线 */
    const pts=[];
    for(let gx=-spanX;gx<=spanX;gx+=.28)pts.push(proj(gx*GRID,gy*GRID));
    drawLine(pts,.13);
  }
  for(let gx=-spanX;gx<=spanX;gx++){ /* 竖线 */
    const pts=[];
    for(let gy=-spanY;gy<=spanY;gy+=.28)pts.push(proj(gx*GRID,gy*GRID));
    drawLine(pts,.13);
  }
}
function drawOrbits(){ /* 已坍缩任务 = 轨道环上的点 */
  for(const o of orbits){
    o.ang+=o.sp*.016;
    const x=CX+Math.cos(o.ang)*o.r,y=CY+Math.sin(o.ang)*o.r*.62;
    g.fillStyle='rgba(140,180,255,.16)';
    g.beginPath();g.arc(x,y,o.sz*2.4,0,7);g.fill();
    g.fillStyle='rgba(200,225,255,.9)';
    g.beginPath();g.arc(x,y,o.sz,0,7);g.fill();
  }
}
(function loop(){
  gt+=.016;
  waveAmp+=(waveTarget-waveAmp)*.05;
  drawGrid();drawOrbits();
  requestAnimationFrame(loop);
})();

/* ==================== 回复库 ==================== */
const REPLIES=[
[["问题已捕获。正在解析其质量分布：核心诉求一项，隐含约束两条，边缘噪声若干。"],
["已将任务拆解为三个子质量体，依次捕获、逐一坍缩。主问题将在第三轨道周期内完成求解。"],
["结论：任何难题都可以被引力驯服——给它足够的曲率，再远的问题也会落进来。"]],
[["捕获完成。该问题表面致密，内部其实存在低密度空腔：真正需要求解的只有内核部分。"],
["外围质量已剥离至背景场，仅保留 12% 的有效信息进入坍缩流程。"],
["结论：多数问题的重量，来自我们对它的想象，而非它本身。"]],
[["引力场扫描完毕。检测到该问题与三个历史任务存在引力关联，轨道共振明显。"],
["正在调用历史解算结果进行三体匹配，可复用率约 61%，预计坍缩时间缩短一半。"],
["结论：问题很少是新的。它们大多是被遗忘的旧轨道。"]],
[["任务已进入洛希极限。检测到结构不稳定：原始表述存在自相矛盾的两处应力点。"],
["建议拆分为两个独立任务分别坍缩，成功率将从 34% 提升至 89%。"],
["结论：在引力面前，坚硬的问题会先碎裂，再聚合。破碎不是失败，是解理。"]],
[["奇点求解完成。所有冗余质量已蒸发，剩余解的密度极高：一句话即可承载。"],
["它已被锚定在你的任务轨道上，将随系统持续公转，随时可召回。"],
["结论：宇宙不保存过程，只保存结果。但轨道会记得一切来过的问题。"]]
];
let lastIdx=-1;

/* ==================== 状态 ==================== */
const replies=document.getElementById('replies'),ask=document.getElementById('ask'),
      drop=document.getElementById('drop'),statCap=document.getElementById('stCap'),
      statOrb=document.getElementById('stOrb'),coreFlash=document.getElementById('coreFlash');
let busy=false,captured=0,lastHex=0;

function pickReply(){let i=Math.floor(Math.random()*REPLIES.length);
  if(i===lastIdx)i=(i+1)%REPLIES.length;lastIdx=i;return REPLIES[i];}
function hex(){return '0x'+(Math.random()*0xFFFF|0).toString(16).toUpperCase().padStart(4,'0');}

/* ==================== 任务块：被引力捕获 ==================== */
function spawnTask(text,onSwallowed){
  const edge=Math.floor(Math.random()*4);
  let x,y;
  if(edge===0){x=Math.random()*W;y=-30}
  else if(edge===1){x=W+30;y=Math.random()*H}
  else if(edge===2){x=Math.random()*W;y=H+30}
  else{x=-30;y=Math.random()*H}
  const el=document.createElement('div');
  el.className='task';el.style.left=x+'px';el.style.top=y+'px';
  document.body.appendChild(el);
  /* 弯曲轨迹：贝塞尔控制点向一侧偏移 */
  const mx=(x+CX)/2,my=(y+CY)/2;
  const dx=CX-x,dy=CY-y,len=Math.hypot(dx,dy)||1;
  const bend=(90+Math.random()*70)*(Math.random()<.5?1:-1);
  const cx1=mx-dy/len*bend,cy1=my+dx/len*bend;
  const t0=performance.now(),DUR=1700+Math.random()*400;
  (function fly(now){
    let t=Math.min(1,(now-t0)/DUR);
    const e=t*t; /* 加速坠入 */
    const it=1-e;
    const px=it*it*x+2*it*e*cx1+e*e*CX;
    const py=it*it*y+2*it*e*cy1+e*e*CY;
    const sc=1-.72*e,rot=e*540;
    el.style.transform='translate('+(px-x-7)+'px,'+(py-y-7)+'px) rotate('+rot+'deg) scale('+sc+')';
    if(t<1)requestAnimationFrame(fly);
    else{
      el.remove();
      coreFlash.classList.remove('on');void coreFlash.offsetWidth;
      coreFlash.classList.add('on');
      onSwallowed();
    }
  })(t0);
}

/* ==================== 回复卡片 ==================== */
function addReply(tag,sentences){
  const art=document.createElement('article');
  art.className='rep';
  const tagEl=document.createElement('div');
  tagEl.className='rep-tag';
  tagEl.innerHTML='<b>'+tag+'</b>';
  art.appendChild(tagEl);
  sentences.forEach((grp,i)=>{
    setTimeout(()=>{
      const p=document.createElement('p');
      grp.split(/(?<=[。！？…])/).filter(s=>s.trim()).forEach(s=>{
        const sp=document.createElement('span');
        sp.className='snt';sp.textContent=s;
        p.appendChild(sp);
      });
      art.appendChild(p);
    },i*380+120);
  });
  replies.appendChild(art);
  while(replies.children.length>4){
    const old=replies.firstChild;
    old.classList.add('out');
    setTimeout(()=>old.remove(),420);
    replies.removeChild(old);
  }
}

/* ==================== 主流程 ==================== */
function send(){
  const text=ask.value.trim();
  if(!text||busy)return;
  busy=true;drop.disabled=true;
  ask.value='';
  spawnTask(text,()=>{
    captured++;statCap.textContent=captured;
    orbits.push({r:70+Math.random()*90,ang:Math.random()*6.28,
      sp:.25+Math.random()*.5,sz:1.6+Math.random()*1.4});
    statOrb.textContent=orbits.length;
    startCollapse(text);
  });
}
function startCollapse(text){
  document.body.classList.add('thinking');
  waveTarget=9;
  const DUR=1500+Math.random()*1500; /* 思考 1.5~3s */
  setTimeout(()=>{
    document.body.classList.remove('thinking');
    waveTarget=1.4;
    const h=hex();lastHex=h;
    const brief=text.length>14?text.slice(0,14)+'…':text;
    addReply('#'+h+' · 已坍缩 · 关于「'+brief+'」',pickReply());
    busy=false;drop.disabled=false;
    ask.focus();
  },DUR);
}

ask.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
drop.addEventListener('click',send);

/* ==================== 启动欢迎 ==================== */
orbits.push({r:96,ang:-.8,sp:.35,sz:1.8},{r:132,ang:2.2,sp:-.26,sz:1.5});
statOrb.textContent=orbits.length;
setTimeout(()=>{
  addReply('#0x0001 · 引力井已就绪',[
    ["引力井已就绪。中央质量体待命中，捕获半径覆盖你的一切问题。"],
    ["投掷任何任务进来——它会被引力捕获、拉入轨道、压缩求解。"],
    ["质量越大，曲率越深。无解的问题，只是还没落进井里。"]]);
},1100);
</script>
</body>
</html>
