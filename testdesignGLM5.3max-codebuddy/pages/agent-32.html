<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent 32 · SUBWAY 问询线路图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Courier New',Consolas,Menlo,monospace;overflow:hidden;background:#fdfdfb;color:#111}
.app{display:flex;height:100vh}
/* ============ 左：线路图 ============ */
.map-side{flex:0 0 58%;display:flex;flex-direction:column;position:relative;
  border-right:4px solid #111;background:#fdfdfb}
.map-title{padding:16px 24px 4px;display:flex;align-items:baseline;gap:14px}
.map-title h1{font-size:19px;letter-spacing:.14em;font-weight:bold}
.map-title small{font-size:11px;color:#666;letter-spacing:.22em}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:7px 24px 8px;border-bottom:2px solid #111}
.legend span{display:flex;align-items:center;gap:6px;font-size:11px;color:#333}
.legend i{width:20px;height:6px;border-radius:3px;display:inline-block}
#metro{flex:1;width:100%;min-height:0;display:block}
/* ============ 右：信息屏 ============ */
.screen-side{flex:1;display:flex;flex-direction:column;background:#0a0a0a;position:relative;color:#ffd400}
.screen-side::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:30;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 4px)}
.screen-head{flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:13px 18px 11px;border-bottom:1px solid #4d3f00;font-size:13px;letter-spacing:.08em}
.screen-head .sys{font-weight:bold}
.screen-head .sys small{color:#7a6f2a;font-weight:normal;letter-spacing:.2em;margin-left:8px;font-size:10px}
.clockbox{display:flex;align-items:center;gap:10px;font-size:14px}
.rundot{width:8px;height:8px;border-radius:50%;background:#3ddc55;box-shadow:0 0 8px #3ddc55;
  animation:rundot 1.6s ease-in-out infinite}
@keyframes rundot{0%,100%{opacity:.35}50%{opacity:1}}
.ticker{flex:none;overflow:hidden;border-bottom:1px solid #4d3f00;background:#050505;white-space:nowrap}
.ticker-track{display:inline-block;padding:5px 0;font-size:11px;color:#b3a12e;letter-spacing:.1em;
  animation:ticker 22s linear infinite}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* 对话区 */
.dialog{flex:1;overflow-y:auto;padding:16px 18px 10px;min-height:0}
.dialog::-webkit-scrollbar{width:6px}
.dialog::-webkit-scrollbar-thumb{background:#4d3f00}
.rec{margin-bottom:18px;animation:recIn .4s ease both}
@keyframes recIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rec-q{color:#fff;font-size:13px;line-height:1.7;margin-bottom:7px}
.rec-q .tag{color:#7a6f2a;letter-spacing:.15em}
.rec-q .q-text{color:#fff}
.planning{color:#b3a12e;font-size:12px;letter-spacing:.1em;animation:blinkSoft .7s steps(1) infinite;margin-bottom:6px}
@keyframes blinkSoft{50%{opacity:.25}}
.plan-title{color:#b3a12e;font-size:11px;letter-spacing:.3em;margin:6px 0 5px}
.plan-line{font-size:13px;line-height:1.9;letter-spacing:.03em;animation:recIn .3s ease both}
.plan-line b{color:#fff;font-weight:bold}
.plan-line .k{color:#b3a12e}
.rec-body{margin-top:8px;font-size:13px;line-height:1.9;letter-spacing:.02em;color:#ffd400;word-break:break-word}
.blockcursor{display:inline-block;width:8px;height:15px;background:#ffd400;vertical-align:-2px;margin-left:2px;
  animation:blinkSoft .6s steps(1) infinite}
.welcome{color:#b3a12e;font-size:12px;line-height:2;letter-spacing:.05em}
.welcome b{color:#ffd400}
/* 输入条 */
.input-bar{flex:none;display:flex;align-items:center;gap:8px;padding:13px 16px;
  border-top:1px solid #4d3f00;background:#050505}
.io{font-size:13px;color:#b3a12e;flex:none}
.dest{font-size:13px;color:#ffd400;border:1px solid #ffd400;padding:7px 12px;flex:none;letter-spacing:.1em}
.input-bar input{flex:1;min-width:0;background:#0a0a0a;border:1px solid #6b5c14;color:#ffd400;
  font-family:inherit;font-size:13px;padding:9px 12px;outline:none;letter-spacing:.03em}
.input-bar input::placeholder{color:#5c5216}
.input-bar input:focus{border-color:#ffd400}
.go-btn{flex:none;background:#ffd400;color:#000;border:none;cursor:pointer;font-family:inherit;
  font-weight:bold;font-size:13px;letter-spacing:.14em;padding:10px 18px;transition:transform .12s,box-shadow .12s}
.go-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(255,212,0,.35)}
.go-btn:active{transform:translateY(1px)}
/* SVG 通用 */
.st-name{font-size:11.5px;fill:#1a1a1a;font-family:'PingFang SC','Microsoft YaHei',sans-serif}
.st-name.tr{font-weight:bold}
.line-label{font-size:11px;font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-weight:bold}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulseOut .8s ease-out infinite;pointer-events:none}
@keyframes pulseOut{from{transform:scale(.6);opacity:.9}to{transform:scale(2.4);opacity:0}}
@keyframes dashFlow{to{stroke-dashoffset:-72}}
@media (max-width:1000px){
  .app{flex-direction:column;overflow:auto}
  .map-side{flex:none;height:52vh;border-right:none;border-bottom:4px solid #111}
  .screen-side{min-height:48vh}
}
</style>
</head>
<body>
<div class="app">
  <div class="map-side">
    <div class="map-title"><h1>问 询 线 路 图</h1><small>AGENT TRANSIT · ROUTE MAP</small></div>
    <div class="legend" id="legend"></div>
    <svg id="metro" viewBox="20 20 800 860" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <div class="screen-side">
    <div class="screen-head">
      <div class="sys">AGENT TRANSIT<small>问询导航系统</small></div>
      <div class="clockbox"><span class="rundot"></span><span id="clock">--:--:--</span></div>
    </div>
    <div class="ticker"><div class="ticker-track" id="tickerTrack"></div></div>
    <div class="dialog" id="dialog"></div>
    <div class="input-bar">
      <span class="io">从</span>
      <input id="qInput" placeholder="输入你的问题…" autocomplete="off">
      <span class="io">到</span>
      <span class="dest">答案</span>
      <button class="go-btn" id="goBtn">出发 →</button>
    </div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const svg=$('#metro'), dialog=$('#dialog'), input=$('#qInput');

/* ============ 线路数据 ============ */
const LINES=[
 {name:'1号线 · 灵感线',color:'#E2001A',
  pts:[[50,150],[500,150],[530,180],[530,360]],
  stations:[
   {x:50,y:150,n:'晨思站',pos:'right'},{x:140,y:150,n:'提问角',pos:'top'},
   {x:400,y:150,n:'枢纽·概念厂',pos:'top',tr:1},{x:490,y:150,n:'假设桥',pos:'top'},
   {x:530,y:230,n:'灵感泉',pos:'right'},{x:530,y:360,n:'妙悟站',pos:'bottom'}]},
 {name:'2号线 · 分析线',color:'#0057A8',
  pts:[[50,340],[480,340],[540,400],[540,620],[600,680],[770,680]],
  stations:[
   {x:50,y:340,n:'观察台',pos:'left'},{x:150,y:340,n:'数据滩',pos:'top'},
   {x:400,y:340,n:'枢纽·逻辑坊',pos:'top',tr:1},{x:480,y:340,n:'证据坡',pos:'top'},
   {x:540,y:470,n:'推演谷',pos:'right'},{x:540,y:560,n:'验证埠',pos:'right'},
   {x:600,y:680,n:'枢纽·合流站',pos:'bottom',tr:1},{x:770,y:680,n:'结论站',pos:'bottom'}]},
 {name:'3号线 · 直觉线',color:'#00843D',
  pts:[[50,650],[540,650],[600,710],[600,800]],
  stations:[
   {x:50,y:650,n:'梦泽站',pos:'left'},{x:170,y:650,n:'潜识原',pos:'bottom'},
   {x:400,y:650,n:'枢纽·回音壁',pos:'bottom',tr:1},{x:540,y:650,n:'回响林',pos:'bottom'},
   {x:600,y:800,n:'印证站',pos:'bottom'}]},
 {name:'4号线 · 深度线',color:'#FF6600',
  pts:[[400,60],[400,820]],
  stations:[
   {x:400,y:60,n:'源流站',pos:'right'},{x:400,y:150,n:'枢纽·概念厂',tr:1,hide:1},
   {x:400,y:340,n:'枢纽·逻辑坊',tr:1,hide:1},{x:400,y:480,n:'思辨井',pos:'left'},
   {x:400,y:650,n:'枢纽·回音壁',tr:1,hide:1},{x:400,y:820,n:'深渊站',pos:'bottom'}]},
 {name:'5号线 · 联想线',color:'#7D55C7',
  pts:[[770,80],[600,80],[540,140],[540,240],[600,300],[700,300],[760,360],[760,560],[700,620],[700,680]],
  stations:[
   {x:770,y:80,n:'星火站',pos:'top'},{x:600,y:80,n:'引子站',pos:'top'},
   {x:540,y:190,n:'意象站',pos:'left'},{x:650,y:300,n:'隐喻渡',pos:'top'},
   {x:760,y:460,n:'通感桥',pos:'right'},{x:700,y:680,n:'枢纽·合流站',tr:1,hide:1}]},
];
const NS='http://www.w3.org/2000/svg';
const el=(t,attrs)=>{const e=document.createElementNS(NS,t);for(const k in attrs)e.setAttribute(k,attrs[k]);return e};

/* 圆角折线 */
function roundedPath(pts,r){
  let d=`M ${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){
    const [x0,y0]=pts[i-1],[x1,y1]=pts[i],[x2,y2]=pts[i+1];
    const v1=[x1-x0,y1-y0],v2=[x2-x1,y2-y1];
    const l1=Math.hypot(v1[0],v1[1]),l2=Math.hypot(v2[0],v2[1]);
    const rr=Math.min(r,l1/2,l2/2);
    const p1=[x1-v1[0]/l1*rr,y1-v1[1]/l1*rr];
    const p2=[x1+v2[0]/l2*rr,y1+v2[1]/l2*rr];
    d+=` L ${p1[0]} ${p1[1]} Q ${x1} ${y1} ${p2[0]} ${p2[1]}`;
  }
  d+=` L ${pts[pts.length-1][0]} ${pts[pts.length-1][1]}`;
  return d;
}
/* 渲染地图 */
const linePaths=[], stationEls=new Map();
function buildMap(){
  LINES.forEach(line=>{
    const d=roundedPath(line.pts,18);
    const p=el('path',{d,fill:'none',stroke:line.color,'stroke-width':10,
      'stroke-linecap':'round','stroke-linejoin':'round'});
    svg.appendChild(p);
    linePaths.push(p);
    const lab=el('text',{x:line.pts[0][0],y:line.pts[0][1]-14,class:'line-label',fill:line.color,'font-size':11});
  });
  LINES.forEach(line=>{
    line.stations.forEach(st=>{
      const key=st.x+','+st.y;
      if(stationEls.has(key)){ if(st.tr) stationEls.get(key).tr=true; return; }
      const g=el('g',{});
      const c=el('circle',{cx:st.x,cy:st.y,r:st.tr?10:6.5,fill:'#fff',stroke:'#111','stroke-width':st.tr?3.5:2.5});
      g.appendChild(c);
      const t=el('text',{x:st.x,y:st.y,class:'st-name'+(st.tr?' tr':''),'text-anchor':'middle'});
      if(st.pos==='top')t.setAttribute('y',st.y-(st.tr?16:12));
      if(st.pos==='bottom')t.setAttribute('y',st.y+(st.tr?24:20));
      if(st.pos==='left'){t.setAttribute('x',st.x-(st.tr?16:12));t.setAttribute('text-anchor','end');t.setAttribute('y',st.y+4)}
      if(st.pos==='right'){t.setAttribute('x',st.x+(st.tr?16:12));t.setAttribute('text-anchor','start');t.setAttribute('y',st.y+4)}
      t.textContent=st.n;
      g.appendChild(t);
      svg.appendChild(g);
      const rec={...st,el:g,tr:!!st.tr};
      stationEls.set(key,rec);
    });
  });
  /* 图例 */
  $('#legend').innerHTML=LINES.map(l=>`<span><i style="background:${l.color}"></i>${l.name}</span>`).join('');
}
/* 站在路径上的长度 */
function stationLen(path,st){
  const L=path.getTotalLength();
  let best=0,bd=1e18;
  for(let l=0;l<=L;l+=4){
    const p=path.getPointAtLength(l);
    const d=(p.x-st.x)**2+(p.y-st.y)**2;
    if(d<bd){bd=d;best=l}
  }
  return best;
}
/* ============ 规划动画（标志性瞬间） ============ */
async function routeAnim(lineIdx){
  const line=LINES[lineIdx];
  const path=linePaths[lineIdx];
  const L=path.getTotalLength();
  /* 流动虚线高亮 */
  const hl=el('path',{d:path.getAttribute('d'),fill:'none',stroke:line.color,'stroke-width':5,
    'stroke-linecap':'round','stroke-dasharray':'3 15',opacity:.9});
  hl.style.animation='dashFlow .6s linear infinite';
  svg.appendChild(hl);
  /* 列车 */
  const train=el('g',{});
  const halo=el('circle',{r:14,fill:line.color,opacity:.28});
  const body=el('circle',{r:8,fill:line.color,stroke:'#fff','stroke-width':3});
  const core=el('circle',{r:2.5,fill:'#fff'});
  train.append(halo,body,core);
  svg.appendChild(train);
  /* 收集该线站点（含换乘重复点的任一记录） */
  const stations=[];
  const seen=new Set();
  line.stations.forEach(st=>{
    const rec=stationEls.get(st.x+','+st.y);
    if(rec&&!seen.has(rec)){seen.add(rec);stations.push(rec)}
  });
  stations.forEach(s=>{
    s.len=stationLen(path,s);
    s.lit=false;
    s.el.classList.remove('lit');
    const old=s.el.querySelector('.pulse'); if(old)old.remove();
  });
  stations.sort((a,b)=>a.len-b.len);
  const dur=1500+Math.random()*700;
  await new Promise(res=>{
    const t0=performance.now();
    function frame(t){
      const k=Math.min(1,(t-t0)/dur);
      const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      const l=e*L;
      const p=path.getPointAtLength(l);
      train.setAttribute('transform',`translate(${p.x},${p.y})`);
      stations.forEach(s=>{
        if(!s.lit&&l>=s.len-1){
          s.lit=true;
          const c=s.el.querySelector('circle');
          c.setAttribute('fill',line.color);
          c.setAttribute('r',(s.tr?10:6.5)+2);
          const ring=el('circle',{cx:s.x,cy:s.y,r:s.tr?11:8,fill:'none',stroke:line.color,'stroke-width':2.5,class:'pulse'});
          s.el.appendChild(ring);
        }
      });
      if(k<1)requestAnimationFrame(frame);else res();
    }
    requestAnimationFrame(frame);
  });
  await wait(420);
  /* 复原 */
  train.remove(); hl.remove();
  stations.forEach(s=>{
    const c=s.el.querySelector('circle');
    c.setAttribute('fill','#fff'); c.setAttribute('r',s.tr?10:6.5);
  });
}
/* ============ 报站记录 ============ */
const REPLIES=[
 {line:1,next:'方案 A · 数据核对',transfer:'深度分析',via:'数据滩 · 逻辑坊 · 证据坡',final:'完整答案',
  body:'关于您的问题，调度室备注如下：灵感线此刻客流平稳，深度线末班车永远为提问者延时。您的疑问已在逻辑坊完成安检，随身携带的假设共三件，其中一件超重——建议在证据坡办理托运。答案预计不晚于下一站抵达，请扶稳坐好。'},
 {line:0,next:'方案 B · 灵感快车',transfer:'联想换乘',via:'提问角 · 概念厂 · 假设桥',final:'妙悟站 · 完整答案',
  body:'本次规划选择灵感线：该线全程地上运行，采光极佳，适合需要视野的问题。温馨提示——灵感泉与妙悟站之间常有"想当然"大雾，列车将自动减速，请勿在雾中跳车。您的答案已随车托运，到站即取，风雨无阻。'},
 {line:3,next:'方案 C · 深度直达',transfer:'无需换乘',via:'源流站 · 概念厂 · 思辨井',final:'深渊站 · 完整答案',
  body:'深度线为本图最长纵线，全程地下，信号略弱但思考充沛。列车将连续下潜，途经思辨井时会有轻微顿悟感，属正常现象。请把浅尝辄止的念头留在上一层站台——深度线不发售返程犹豫票。'},
 {line:4,next:'方案 D · 联想环游',transfer:'合流站换乘',via:'意象站 · 隐喻渡 · 通感桥',final:'结论站 · 完整答案',
  body:'联想线路径曲折，却总能绕到答案背面。本次列车经意象站、隐喻渡、通感桥，沿途风景均为比喻，请勿按字面下车。至合流站换乘分析线两站，即可抵达结论站。答案已在站台候您多时。'},
 {line:2,next:'方案 E · 直觉夜航',transfer:'回音壁换乘',via:'潜识原 · 回响林',final:'印证站 · 完整答案',
  body:'直觉线是全图最短的线，却是晚班乘客最多的一条。它不报过多的站，只在该转弯的地方转弯。本次列车经潜识原、回响林，直达印证站——直觉的答案常常先到站，理由要等下一班才到。本图对此不做解释，只做记录。'},
];
let replyIdx=0,busy=false;
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function typeText(box,text){
  const cur=document.createElement('span');cur.className='blockcursor';
  box.appendChild(cur);
  for(const ch of text){
    cur.insertAdjacentText('beforebegin',ch);
    dialog.scrollTop=dialog.scrollHeight;
    let d=26+Math.random()*30;
    if('，、；：'.includes(ch))d+=110;
    if('。！？'.includes(ch))d+=230;
    await wait(d);
  }
  cur.remove();
}
async function onSend(){
  if(busy)return;
  const q=input.value.trim();
  if(!q)return;
  busy=true;input.value='';
  const r=REPLIES[replyIdx++%REPLIES.length];
  const rec=document.createElement('div');
  rec.className='rec';
  rec.innerHTML=`
    <div class="rec-q"><span class="tag">▸ 乘客问询</span><br><span class="q-text">${escapeHtml(q)}</span></div>
    <div class="planning">调度中 ▸ 正在规划路线…</div>`;
  dialog.appendChild(rec);
  dialog.scrollTop=dialog.scrollHeight;
  await wait(400);
  /* 思考：地图规划动画 */
  await routeAnim(r.line);
  rec.querySelector('.planning').remove();
  const plan=document.createElement('div');
  plan.innerHTML=`
    <div class="plan-title">── 路线规划完成 ──</div>
    <div class="plan-line"><span class="k">下一站：</span><b>${r.next}</b></div>
    <div class="plan-line"><span class="k">换　乘：</span><b>${r.transfer}</b></div>
    <div class="plan-line"><span class="k">途　经：</span>${r.via}</div>
    <div class="plan-line"><span class="k">终　点：</span><b>${r.final}</b></div>
    <div class="rec-body"></div>`;
  rec.appendChild(plan);
  const lines=[...plan.querySelectorAll('.plan-line')];
  for(const l of lines){
    l.style.animationDelay='0s';
    dialog.scrollTop=dialog.scrollHeight;
    await wait(260);
  }
  await typeText(plan.querySelector('.rec-body'),r.body);
  busy=false;input.focus();
}
/* ============ 时钟 & 滚动状态 ============ */
function tick(){
  const d=new Date();
  const p=n=>String(n).padStart(2,'0');
  $('#clock').textContent=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
setInterval(tick,1000);tick();
const statusText=LINES.map(l=>`${l.name} 运行正常`).join('　✦　')+'　✦　';
$('#tickerTrack').textContent=statusText+'　✦　'+statusText+'　✦　';
/* 欢迎 */
const wel=document.createElement('div');
wel.className='welcome rec';
wel.innerHTML=`── AGENT TRANSIT 已启动 ──<br>欢迎使用问询导航系统。<b>线路图在左，答案在每一站。</b><br>请于下方登记行程：从你的问题，到答案。`;
dialog.appendChild(wel);
$('#goBtn').addEventListener('click',onSend);
input.addEventListener('keydown',e=>{if(e.key==='Enter')onSend()});
buildMap();
input.focus();
</script>
</body>
</html>
