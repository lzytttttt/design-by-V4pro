<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECHOLOCATION · 回声定位</title>
<style>
:root{
  --bg:#020617;
  --cyan:#2ee8cf;
  --cyan-hi:#8ffcec;
  --ink:#c9e8e4;
  --dim:#3e7a72;
  --mono:"Cascadia Mono",Consolas,"SF Mono",ui-monospace,Menlo,monospace;
  --sbw:340px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --cx:calc(50% - var(--sbw)/2)}
#sonar{position:fixed;inset:0;z-index:1}
#sweep{position:fixed;left:var(--cx);top:50%;width:220vmax;height:220vmax;z-index:0;
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:conic-gradient(from 0deg,rgba(56,230,206,.09),rgba(56,230,206,.03) 52deg,transparent 66deg);
  animation:sweep 9s linear infinite}
@keyframes sweep{to{transform:translate(-50%,-50%) rotate(360deg)}}

/* ---------- 中心发射器 ---------- */
#origin{position:fixed;left:var(--cx);top:50%;z-index:2;transform:translate(-50%,-50%);pointer-events:none}
#origin i{display:block;width:7px;height:7px;border-radius:50%;background:var(--cyan-hi);
  box-shadow:0 0 10px 3px rgba(90,250,225,.75);transition:box-shadow .3s,background .3s}
#origin::before{content:"";position:absolute;left:50%;top:50%;width:26px;height:26px;
  transform:translate(-50%,-50%);border:1px solid rgba(90,250,225,.35);border-radius:50%}
#origin.lit i{background:#d8fff8;box-shadow:0 0 22px 8px rgba(120,255,235,.95)}
#origin.lit::before{border-color:rgba(140,255,238,.7)}

/* ---------- 四角 HUD ---------- */
.hud{position:fixed;z-index:5;font-family:var(--mono);font-size:10px;letter-spacing:.2em;
  color:var(--dim);padding:16px 20px;line-height:2}
.hud b{color:#6fc9bc;font-weight:400;display:block;font-size:11px}
.hud::before{content:"";position:absolute;width:14px;height:14px;opacity:.7}
.hud-tl{left:0;top:0}.hud-tl::before{left:14px;top:12px;border-left:1px solid var(--dim);border-top:1px solid var(--dim)}
.hud-tr{right:var(--sbw);top:0;text-align:right}.hud-tr::before{right:14px;top:12px;border-right:1px solid var(--dim);border-top:1px solid var(--dim)}
.hud-bl{left:0;bottom:0}.hud-bl::before{left:14px;bottom:12px;border-left:1px solid var(--dim);border-bottom:1px solid var(--dim)}
.hud-br{right:var(--sbw);bottom:0;text-align:right}.hud-br::before{right:14px;bottom:12px;border-right:1px solid var(--dim);border-bottom:1px solid var(--dim)}
.hud em{font-style:normal;color:var(--cyan)}

/* ---------- 信号档案（侧栏） ---------- */
#archive{position:fixed;right:0;top:0;bottom:0;width:var(--sbw);z-index:6;
  background:rgba(3,12,20,.72);backdrop-filter:blur(5px);
  border-left:1px solid rgba(56,230,206,.16);
  display:flex;flex-direction:column}
.arc-head{padding:18px 22px 12px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.28em;color:#6fc9bc;border-bottom:1px solid rgba(56,230,206,.13)}
.arc-head i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cyan);
  margin-right:8px;vertical-align:1px;animation:beacon 2s ease-in-out infinite}
@keyframes beacon{0%,100%{opacity:.35}50%{opacity:1}}
#arcList{flex:1;overflow-y:auto;padding:14px 18px 20px;scrollbar-width:thin}
#arcList::-webkit-scrollbar{width:5px}
#arcList::-webkit-scrollbar-thumb{background:rgba(56,230,206,.25)}
.sig{border:1px solid rgba(56,230,206,.18);border-radius:8px;
  background:rgba(8,24,30,.5);padding:12px 15px;margin-bottom:12px;
  animation:sigIn .55s cubic-bezier(.2,1.2,.3,1) forwards}
@keyframes sigIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.sig-head{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:#6fc9bc;line-height:1.9}
.sig-head b{color:var(--cyan-hi);font-weight:400}
.sig-str{display:flex;align-items:center;gap:8px;margin:7px 0 9px;
  font-family:var(--mono);font-size:9.5px;color:#4e8f86;letter-spacing:.14em}
.sig-str .bar{flex:1;height:3px;background:rgba(56,230,206,.12);position:relative;overflow:hidden}
.sig-str .bar i{position:absolute;left:0;top:0;bottom:0;width:0;
  background:linear-gradient(90deg,#1a8f7c,var(--cyan));transition:width .9s cubic-bezier(.2,.8,.3,1)}
.sig-str b{color:#8ffcec;font-weight:400}
.sig p{font-size:13px;line-height:1.9;color:#bfe3dc;margin-bottom:5px}
.snt{opacity:0;animation:sntIn .4s ease forwards}
@keyframes sntIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ---------- 发射器输入 ---------- */
#console{position:fixed;left:var(--cx);bottom:64px;z-index:7;
  transform:translateX(-50%);width:min(520px,72vw)}
#emitter{display:flex;align-items:center;gap:10px;
  border:1px solid rgba(56,230,206,.3);border-radius:40px;
  background:rgba(4,14,20,.75);backdrop-filter:blur(6px);
  padding:11px 12px 11px 22px;transition:border-color .3s,box-shadow .3s}
#emitter:focus-within{border-color:rgba(120,250,228,.7);
  box-shadow:0 0 24px rgba(56,230,206,.18)}
#ask{flex:1;background:none;border:none;outline:none;color:#e2fbf6;
  font-size:14px;letter-spacing:.04em;caret-color:var(--cyan);font-family:inherit}
#ask::placeholder{color:#2e5f58}
#pingBtn{background:rgba(56,230,206,.12);border:1px solid rgba(56,230,206,.5);color:var(--cyan-hi);
  font-family:var(--mono);font-size:11px;letter-spacing:.24em;padding:9px 22px;
  border-radius:30px;cursor:pointer;transition:.25s}
#pingBtn:hover{background:rgba(56,230,206,.25);box-shadow:0 0 16px rgba(56,230,206,.35)}
#pingBtn:disabled{opacity:.35;cursor:default}
.con-hint{text-align:center;margin-top:10px;font-family:var(--mono);
  font-size:9.5px;letter-spacing:.28em;color:#26504a}

@media(max-width:920px){
  :root{--sbw:280px}
  .hud-br,.hud-tr{display:none}
}
</style>
</head>
<body>
<canvas id="sonar"></canvas>
<div id="sweep"></div>
<div id="origin"><i></i></div>

<div class="hud hud-tl"><b>⌖ ECHO-47</b>回声定位阵列<br>SCAN ACTIVE · 主动模式</div>
<div class="hud hud-tr" id="hudClock"><b>STATUS</b>深度 120m · 换能器正常</div>
<div class="hud hud-bl"><b>MODE</b>波束扇区 360° · 增益 +12dB</div>
<div class="hud hud-br"><b>ARCHIVE →</b>信号档案实时归档中</div>

<aside id="archive">
  <div class="arc-head"><i></i>信号档案 · SIGNAL ARCHIVE</div>
  <div id="arcList"></div>
</aside>

<div id="console">
  <div id="emitter">
    <input id="ask" type="text" placeholder="发射问询信号…" autocomplete="off">
    <button id="pingBtn">PING</button>
  </div>
  <div class="con-hint">ENTER 发射 · 回波将依次苏醒</div>
</div>

<script>
/* ==================== 声呐画布 ==================== */
const cv=document.getElementById('sonar'),g=cv.getContext('2d');
let W=0,H=0,CX=0,CY=0,dpr=Math.min(window.devicePixelRatio||1,2);
const ripples=[],echoes=[],pending=[];
let thinking=false,nextRipple=0,strayTimer=0;

function sbw(){return innerWidth<=920?280:340}
function resize(){
  W=innerWidth;H=innerHeight;
  CX=(W-sbw())/2;CY=H/2;
  cv.width=W*dpr;cv.height=H*dpr;
  cv.style.width=W+'px';cv.style.height=H+'px';
  g.setTransform(dpr,0,0,dpr,0,0);
}
resize();addEventListener('resize',resize);
const dist=(x,y)=>Math.hypot(x-CX,y-CY);

/* ---------- WebAudio 轻量声效 ---------- */
let AC=null;
function tone(f0,f1,dur,vol){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),gn=AC.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(f0,AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(f1,AC.currentTime+dur);
    gn.gain.setValueAtTime(vol,AC.currentTime);
    gn.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
    o.connect(gn);gn.connect(AC.destination);
    o.start();o.stop(AC.currentTime+dur);
  }catch(e){}
}

/* ==================== 回复库（信号档案体） ==================== */
const REPLIES=[
{az:47,dist:.7,str:92,t:[
"信号解析完毕。该问询以清晰的单频回波返回，无遮挡、无衰减异常。",
"目标判定：直接可解型。回波特征显示其结构完整，未检测到歧义层。",
"结论已锚定至信号档案。深度清澈时，一问一答，如石入静水。"]},
{az:118,dist:.4,str:78,t:[
"该问询的回波出现双峰结构——表面是一个问题，深层携带第二意图。",
"已对两层层位分别做匹配滤波，分离出两条信号轨迹，均已完成解算。",
"深层意图的置信度稍低（78%），建议在后续问询中补充上下文以提高信噪比。"]},
{az:265,dist:.85,str:64,t:[
"回波在强噪声背景中被捕获。环境噪声级偏高，但信号特征稳定可辨。",
"通过三次重复探测与相关叠加，已将有效信噪比提升 14 dB，解析结果可靠。",
"结论：嘈杂不是障碍，是背景。足够多的重复，能让任何微弱信号显形。"]},
{az:31,dist:.55,str:71,t:[
"扫描到微弱但持续的异常回波：该问询与既有认知结构存在一处干涉条纹。",
"经相位分析确认，这不是噪声，而是旧知识与新问题之间的干涉峰。",
"已将干涉图样存档。这类信号往往预示着认知边界的精确位置。"]},
{az:312,dist:.7,str:96,t:[
"多径回波检测完成。同一问询经由三条不同路径返回，解算结果在二阶精度内一致。",
"这种一致性本身即是答案的一部分：该问题的解在多个语境下保持稳定。",
"已归档为高置信信号。方位角 312，距离刻度 0.7。"]}
];
let lastIdx=-1,seq=0;
function pick(){let i=Math.floor(Math.random()*REPLIES.length);
  if(i===lastIdx)i=(i+1)%REPLIES.length;lastIdx=i;return REPLIES[i];}

/* ==================== 绘制 ==================== */
function draw(now){
  g.clearRect(0,0,W,H);
  /* 静态刻度环 */
  const maxR=Math.hypot(W,H)*.62;
  g.strokeStyle='rgba(56,230,206,.075)';g.lineWidth=1;
  for(let i=1;i<=4;i++){g.beginPath();g.arc(CX,CY,maxR*i/4*.55,0,7);g.stroke();}
  g.beginPath();g.moveTo(CX-maxR*.62,CY);g.lineTo(CX+maxR*.62,CY);
  g.moveTo(CX,CY-maxR*.62);g.lineTo(CX,CY+maxR*.62);g.stroke();
  /* 常规波纹 */
  for(let i=ripples.length-1;i>=0;i--){
    const r=ripples[i];r.r+=r.sp;
    const a=r.a*(1-r.r/r.max);
    if(a<=0){ripples.splice(i,1);continue}
    g.strokeStyle='rgba(70,235,210,'+a.toFixed(3)+')';
    g.lineWidth=1.2;
    g.beginPath();g.arc(CX,CY,r.r,0,7);g.stroke();
  }
  /* 回波点 */
  for(let i=echoes.length-1;i>=0;i--){
    const e=echoes[i],age=now-e.born;
    if(age>e.life){echoes.splice(i,1);continue}
    const p=age/e.life,a=1-p;
    g.fillStyle='rgba(150,255,236,'+(a*.95).toFixed(3)+')';
    g.beginPath();g.arc(e.x,e.y,2.2,0,7);g.fill();
    g.strokeStyle='rgba(120,250,228,'+(a*.5).toFixed(3)+')';
    g.lineWidth=1;
    for(let k=1;k<=2;k++){
      g.beginPath();g.arc(e.x,e.y,3+p*14*k,0,7);g.stroke();
    }
  }
  /* 思考态：杂散回波 */
  if(thinking&&now>strayTimer){
    strayTimer=now+90+Math.random()*160;
    echoes.push({x:CX+(Math.random()-.5)*W*.9,y:CY+(Math.random()-.5)*H*.8,
      born:now,life:300+Math.random()*500});
  }
  /* 常规波纹节律：idle 2s 一道，思考态加速 */
  if(now>nextRipple){
    nextRipple=now+(thinking?620:2000);
    ripples.push({r:0,sp:2.6,max:Math.max(W,H)*.75,a:.4});
  }
}
(function loop(now){draw(now||0);requestAnimationFrame(loop)})();

/* ==================== 全屏 PING（标志性瞬间） ==================== */
function bigPing(){
  const max=Math.hypot(W,H)*1.05;
  ripples.push({r:0,sp:9,max,a:1});
  setTimeout(()=>ripples.push({r:0,sp:9,max,a:.7}),140);
  tone(1150,180,.85,.09);
}
function spawnPendingEchoes(n){
  pending.length=0;
  for(let i=0;i<n;i++){
    const ang=Math.random()*6.28,r=90+Math.random()*(Math.min(W-sbw(),H)/2-60);
    pending.push({x:CX+Math.cos(ang)*r,y:CY+Math.sin(ang)*r,trig:false,
      delay:i*(200+Math.random()*220)});
  }
}
function watchPing(onAll){
  const t0=performance.now();
  (function watch(now){
    const pr=(now-t0)/1000*9; /* 与 bigPing 波速一致 */
    let all=true;
    for(const p of pending){
      if(!p.trig){
        all=false;
        if(pr>=dist(p.x,p.y)&&now-t0>p.delay){
          p.trig=true;
          echoes.push({x:p.x,y:p.y,born:now,life:1900});
          tone(1600,900,.14,.035);
        }
      }
    }
    if(!all)requestAnimationFrame(watch);
    else setTimeout(onAll,260);
  })(t0);
}

/* ==================== 档案条目 ==================== */
const arcList=document.getElementById('arcList'),ask=document.getElementById('ask'),
      pingBtn=document.getElementById('pingBtn'),origin=document.getElementById('origin');
let busy=false;
const pad=n=>String(n).padStart(2,'0');

function archive(rep){
  seq++;
  const art=document.createElement('article');
  art.className='sig';
  art.innerHTML=
    '<div class="sig-head">▸ <b>SIG-'+pad(seq)+'</b> · 方位 '
    +pad(String(rep.az)).padStart(3,'0')+'° · 距离 '+rep.dist.toFixed(1)
    +'</div><div class="sig-str"><span>强度</span><div class="bar"><i></i></div><b>'+rep.str+'%</b></div>';
  rep.t.forEach((para,i)=>{
    setTimeout(()=>{
      const p=document.createElement('p');
      para.split(/(?<=[。！？…])/).filter(s=>s.trim()).forEach(s=>{
        const sp=document.createElement('span');
        sp.className='snt';sp.textContent=s;
        p.appendChild(sp);
      });
      art.appendChild(p);
    },900+i*640);
  });
  arcList.insertBefore(art,arcList.firstChild);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    art.querySelector('.bar i').style.width=rep.str+'%';
  }));
  while(arcList.children.length>7)arcList.lastChild.remove();
}

/* ==================== 主流程 ==================== */
function send(){
  const text=ask.value.trim();
  if(!text||busy)return;
  busy=true;pingBtn.disabled=true;
  ask.value='';
  bigPing();
  spawnPendingEchoes(4+Math.floor(Math.random()*3));
  watchPing(()=>{
    thinking=true;
    setTimeout(()=>{
      thinking=false;
      archive(pick());
      setTimeout(()=>{busy=false;pingBtn.disabled=false;ask.focus()},700);
    },1500+Math.random()*1500);
  });
}
ask.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
pingBtn.addEventListener('click',send);
ask.addEventListener('focus',()=>origin.classList.add('lit'));
ask.addEventListener('blur',()=>origin.classList.remove('lit'));

/* ==================== 启动 ==================== */
setTimeout(()=>{
  ripples.push({r:0,sp:2.6,max:Math.max(W,H)*.75,a:.4});
  archive({az:0,dist:.0,str:88,t:[
    "回声定位阵列上线。换能器阵列自检完成，水域清澈，监听增益已推至 +12dB。",
    "在下方发射任意问询信号——全屏声呐将为你扫过整个空间，回波会自己浮现。",
    "每一次回答，都是一次回声的苏醒。"]});
  seq=0; /* 欢迎不计入编号 */
},900);
</script>
</body>
</html>
