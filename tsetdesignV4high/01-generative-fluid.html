<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>01 · 生成流体 / Generative Fluid</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #eef2ff;
    --dim: rgba(238, 242, 255, 0.55);
    --faint: rgba(238, 242, 255, 0.28);
  }
  html, body { height: 100%; }
  body {
    background: #06060c;
    color: var(--ink);
    font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #fluid { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* UI floats ON the fluid, emerging then dissolving */
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .core {
    text-align: center; max-width: 80vw;
    filter: drop-shadow(0 0 30px rgba(124, 92, 255, 0.25));
    animation: bob 12s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  .tag {
    font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 11px;
    letter-spacing: 0.6em; text-transform: uppercase; color: var(--dim); margin-bottom: 2.4vh;
  }
  .core h1 {
    font-size: clamp(3rem, 11vw, 10rem); font-weight: 100; letter-spacing: -0.03em; line-height: 0.95;
  }
  .core h1 .it { font-family: Georgia, serif; font-style: italic; font-weight: 300; }
  .core .mantra {
    margin-top: 4vh; font-weight: 200; color: var(--dim); font-size: clamp(0.9rem, 1.5vw, 1.2rem);
    letter-spacing: 0.08em; line-height: 2;
  }
  .core .mantra b { color: var(--ink); font-weight: 400; }
  .hint {
    position: fixed; bottom: 4vh; left: 50%; transform: translateX(-50%);
    font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: 0.3em; color: var(--faint);
    pointer-events: none;
  }
  .nav {
    position: fixed; top: 3vh; left: 4vw; right: 4vw; display: flex; justify-content: space-between;
    font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: 0.25em; color: var(--faint);
    pointer-events: none; z-index: 5;
  }
</style>
</head>
<body>
<canvas id="fluid"></canvas>
<div class="nav"><span>AI-NATIVE · 01 / 10</span><span>GENERATIVE FLUID</span></div>
<div class="stage">
  <div class="core">
    <div class="tag">哲学 · 生成流体</div>
    <h1>界面不是<span class="it">窗口</span><br>是一片场</h1>
    <p class="mantra">UI 从流体的扰动中<b>浮现</b>，<br>又在你的指尖离开后，重新<b>溶解</b>。</p>
  </div>
</div>
<div class="hint">移动 · 扰动这片流体</div>

<script>
  const canvas = document.getElementById('fluid');
  const ctx = canvas.getContext('2d');
  let W, H, blobs = [];
  const mouse = { x: -9999, y: -9999, px: -9999, py: -9999 };

  function resize() {
    W = canvas.width = innerWidth * devicePixelRatio;
    H = canvas.height = innerHeight * devicePixelRatio;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    seed();
  }

  function seed() {
    blobs = [];
    const n = Math.max(5, Math.floor(innerWidth / 320));
    for (let i = 0; i < n; i++) {
      blobs.push({
        x: Math.random() * W, y: Math.random() * H,
        r: (0.18 + Math.random() * 0.3) * Math.min(W, H),
        vx: (Math.random() - 0.5) * 0.35, vy: (Math.random() - 0.5) * 0.35,
        hue: 235 + Math.random() * 45,
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  function step() {
    for (const b of blobs) {
      b.x += b.vx; b.y += b.vy;
      b.phase += 0.01;
      // mouse repulsion -> perturbation
      const dx = b.x - mouse.x, dy = b.y - mouse.y;
      const d = Math.hypot(dx, dy);
      if (d < 260 * devicePixelRatio && d > 0.1) {
        const f = (1 - d / (260 * devicePixelRatio)) * 6;
        b.x += (dx / d) * f; b.y += (dy / d) * f;
      }
      if (b.x < -b.r) b.x = W + b.r; if (b.x > W + b.r) b.x = -b.r;
      if (b.y < -b.r) b.y = H + b.r; if (b.y > H + b.r) b.y = -b.r;
    }
  }

  function draw() {
    const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H) * 0.7);
    g.addColorStop(0, '#0a0a18'); g.addColorStop(1, '#04040a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    for (const b of blobs) {
      const rr = b.r * (1 + Math.sin(b.phase) * 0.04);
      const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, rr);
      grad.addColorStop(0, `hsla(${b.hue}, 90%, 60%, 0.20)`);
      grad.addColorStop(0.55, `hsla(${b.hue}, 90%, 55%, 0.07)`);
      grad.addColorStop(1, 'hsla(0,0%,0%,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(b.x, b.y, rr, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function loop() {
    step(); draw(); requestAnimationFrame(loop);
  }

  addEventListener('resize', resize);
  addEventListener('pointermove', e => {
    mouse.px = mouse.x; mouse.py = mouse.y;
    mouse.x = e.clientX * devicePixelRatio;
    mouse.y = e.clientY * devicePixelRatio;
  });
  addEventListener('pointerleave', () => { mouse.x = mouse.y = -9999; });

  resize(); loop();
</script>
</body>
</html>
