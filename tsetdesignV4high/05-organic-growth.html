<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>05 · 有机生长 / Organic Growth</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --ink: #eafaf1; --dim: #6f9a82; --accent: #58d68d; }
  body {
    background: #07100b; color: var(--ink);
    font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #growth { position: fixed; inset: 0; z-index: 1; }
  .hud {
    position: fixed; z-index: 5; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between; padding: 3vh 4vw;
  }
  .top { display: flex; justify-content: space-between; }
  .lab { font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: 0.35em; color: var(--dim); text-transform: uppercase; }
  .title { text-align: center; padding-bottom: 8vh; }
  .title h1 { font-weight: 200; font-size: clamp(2rem, 5vw, 4.5rem); letter-spacing: 0.04em; }
  .title h1 .it { font-family: Georgia, serif; font-style: italic; }
  .title p { color: var(--dim); font-size: 0.85rem; margin-top: 1rem; letter-spacing: 0.05em; }
  .tip {
    position: fixed; z-index: 6; pointer-events: none; transform: translate(-50%, -140%);
    background: rgba(8,20,13,0.9); border: 1px solid rgba(88,214,141,0.35); border-radius: 4px;
    padding: 0.7rem 0.9rem; font-size: 0.78rem; color: var(--ink); opacity: 0; transition: 0.2s;
  }
  .tip.on { opacity: 1; }
  .tip .n { color: var(--accent); font-weight: 500; }
  .tip .d { color: var(--dim); font-size: 0.72rem; margin-top: 0.2rem; }
  .spacer { height: 420vh; }
  .progress {
    position: fixed; left: 4vw; bottom: 6vh; z-index: 5; width: 140px; pointer-events: none;
  }
  .progress .bar { height: 2px; background: rgba(88,214,141,0.2); }
  .progress .fill { height: 2px; background: var(--accent); width: 0%; }
  .progress span { font-family: ui-monospace, monospace; font-size: 9px; letter-spacing: 0.2em; color: var(--dim); }
</style>
</head>
<body>
<canvas id="growth"></canvas>
<div class="hud">
  <div class="top"><span class="lab">AI-NATIVE · 05 / 10</span><span class="lab">ORGANIC GROWTH</span></div>
  <div class="title">
    <h1>界面像<span class="it">珊瑚</span>一样<br>自行分叉</h1>
    <p>滚动即是生长 · 触碰节点，让它开花</p>
  </div>
</div>
<div class="tip" id="tip"><div class="n"></div><div class="d"></div></div>
<div class="progress"><div class="bar"><div class="fill" id="fill"></div></div><span id="pct">GROWTH 0%</span></div>
<div class="spacer"></div>

<script>
  const cv = document.getElementById('growth'), ctx = cv.getContext('2d');
  const tip = document.getElementById('tip');
  let W, H, D = devicePixelRatio;
  const mouse = { x: -1e4, y: -1e4 };

  const CAPS = [
    { n: '感知', d: '接收世界，将其折叠为可理解的结构。' },
    { n: '推理', d: '在矛盾中推演，直至抵达一致。' },
    { n: '记忆', d: '让过去在场，成为此刻的养分。' },
    { n: '工具', d: '把外部世界当作延伸的肢体。' },
    { n: '生成', d: '从噪声中采样，结出尚未存在的果。' },
    { n: '规划', d: '把意图拆解为一条可走的路。' },
    { n: '共情', d: '对齐你的语气与目标。' },
    { n: '检索', d: '在知识的土壤里扎根取水。' },
    { n: '自省', d: '怀疑自己的输出，再长一次。' },
    { n: '自主', d: '无人盯守，依然向光生长。' },
  ];

  // deterministic branch tree
  let branches = [], leaves = [];
  function buildTree() {
    branches = []; leaves = [];
    const seed = (a, b) => { let x = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return x - Math.floor(x); };
    const root = { x: W/2, y: H + 20, a: -Math.PI/2, len: H * 0.22, depth: 0 };
    let id = 0;
    const stack = [root];
    while (stack.length) {
      const b = stack.pop();
      const ex = b.x + Math.cos(b.a) * b.len;
      const ey = b.y + Math.sin(b.a) * b.len;
      const isLeaf = b.depth >= 3 || b.len < H * 0.04;
      const cap = isLeaf ? CAPS[(id) % CAPS.length] : null;
      branches.push({ x1: b.x, y1: b.y, x2: ex, y2: ey, d: b.depth, cap });
      if (cap) leaves.push({ x: ex, y: ey, cap, id: id % CAPS.length });
      id++;
      if (!isLeaf) {
        const n = 2 + Math.floor(seed(id, 3) * 2); // 2-3 children
        for (let i = 0; i < n; i++) {
          const spread = 0.55 + seed(id, i) * 0.5;
          const aa = b.a + (i - (n - 1) / 2) * spread + (seed(id, i+7) - 0.5) * 0.3;
          stack.push({ x: ex, y: ey, a: aa, len: b.len * (0.68 + seed(id, i+13) * 0.1), depth: b.depth + 1 });
        }
      }
    }
  }

  let g = 0;
  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    // ambient gradient
    const bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.7);
    bg.addColorStop(0, '#0a1710'); bg.addColorStop(1, '#050a07');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    const total = branches.length;
    const visible = Math.floor(g * total);
    ctx.lineCap = 'round';
    for (let i = 0; i < visible; i++) {
      const b = branches[i];
      const sway = Math.sin(t/900 + b.y1 * 0.01) * (2 + b.d * 1.2);
      const x2 = b.x2 + sway;
      const w = Math.max(1, (3.4 - b.d) * D * 0.9);
      const alpha = b.d === 0 ? 0.9 : 0.55 - b.d * 0.08;
      ctx.strokeStyle = `rgba(88,214,141,${alpha})`;
      ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(x2, b.y2); ctx.stroke();
    }
    // bloom dots at leaves
    for (const l of leaves) {
      const idx = branches.indexOf(branches.find(bb => bb.cap === l.cap && bb.x2 === l.x && bb.y2 === l.y));
      const ri = branches.findIndex(bb => bb.cap === l.cap);
      if (ri < 0 || ri > visible) continue;
      const d = Math.hypot(l.x - mouse.x, l.y - mouse.y);
      const near = d < 50 * D;
      const r = (near ? 5 : 3) * D + Math.sin(t/500 + l.x) * D;
      ctx.fillStyle = near ? '#7feab0' : 'rgba(88,214,141,0.8)';
      ctx.beginPath(); ctx.arc(l.x, l.y, r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = near ? '#0a1710' : 'rgba(234,250,241,0.9)';
      ctx.font = `500 ${12*D}px "Inter","PingFang SC",sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(l.cap.n, l.x, l.y - 10*D);
    }
  }

  function hover() {
    let best = null, bd = 1e9;
    for (const l of leaves) {
      const ri = branches.findIndex(bb => bb.cap === l.cap);
      if (ri < 0 || ri > g * branches.length) continue;
      const d = Math.hypot(l.x - mouse.x, l.y - mouse.y);
      if (d < bd) { bd = d; best = l; }
    }
    if (best && bd < 50 * D) {
      tip.querySelector('.n').textContent = best.cap.n;
      tip.querySelector('.d').textContent = best.cap.d;
      tip.style.left = best.x / D + 'px'; tip.style.top = best.y / D + 'px';
      tip.classList.add('on');
    } else tip.classList.remove('on');
  }

  function resize() {
    W = cv.width = innerWidth * D; H = cv.height = innerHeight * D;
    cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
    buildTree();
  }
  addEventListener('resize', resize);
  addEventListener('pointermove', e => { mouse.x = e.clientX * D; mouse.y = e.clientY * D; });

  const spacer = document.querySelector('.spacer');
  const fill = document.getElementById('fill'), pct = document.getElementById('pct');
  function onScroll() {
    g = Math.min(1, scrollY / (spacer.offsetHeight - innerHeight));
    fill.style.width = (g * 100).toFixed(1) + '%';
    pct.textContent = 'GROWTH ' + Math.round(g * 100) + '%';
  }
  addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  function loop(t) { draw(t); hover(); requestAnimationFrame(loop); }
  resize(); requestAnimationFrame(loop);
</script>
</body>
</html>
