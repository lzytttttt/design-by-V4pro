<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>GENESIS · Recursive Prototype Agent</title>
<style>
  :root{
    --bg:#05070b; --ink:#e4ecf4; --dim:#55617a; --acc:#7cf3c0; --acc2:#ffb86c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,monospace}
  #hud{
    position:fixed;top:0;left:0;right:0;height:58px;z-index:40;
    display:flex;align-items:center;gap:26px;padding:0 26px;
    background:linear-gradient(rgba(5,7,11,.92),rgba(5,7,11,.45));
    border-bottom:1px solid rgba(124,243,192,.12);backdrop-filter:blur(8px);
  }
  #hud .logo{font-size:15px;letter-spacing:.2em;color:var(--acc);font-weight:700}
  #hud .philo{font-size:10px;color:var(--dim);letter-spacing:.16em;text-transform:uppercase}
  #hud .spacer{flex:1}
  #hud .iter{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.12em}
  #hud .iter b{color:var(--acc2);font-weight:400}
  #hud button{
    background:transparent;border:1px solid rgba(124,243,192,.4);color:var(--acc);
    padding:6px 16px;border-radius:5px;cursor:pointer;font-size:10px;letter-spacing:.14em;
  }
  #hud button:hover{background:rgba(124,243,192,.08)}
  #stage{position:fixed;inset:58px 0 0 0}
  .blk{position:absolute;border-radius:10px;transition:all 1s cubic-bezier(.2,.9,.25,1)}
  .blk.draft{border:1.5px dashed #3a4a5e;background:transparent}
  .blk.wire{border:1.5px dashed #44566e;background:rgba(15,21,30,.5)}
  .blk.done{border:1px solid rgba(124,243,192,.28);background:#0b1118}
  .blk .ascii{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:10px;color:#6b7c94;letter-spacing:.3em;transition:opacity .5s;
  }
  .blk .content{position:absolute;inset:0;opacity:0;transition:opacity .8s .2s;padding:26px 30px;overflow:hidden}
  .blk.show .content{opacity:1}
  .blk .content h1{font-size:clamp(20px,3vw,30px);letter-spacing:.22em;color:var(--ink)}
  .blk .content h1 span{color:var(--acc)}
  .blk .content .tag{margin-top:12px;font-size:11px;color:var(--dim);letter-spacing:.1em;line-height:2}
  .blk .content .tag b{color:var(--acc2);font-weight:400}
  .blk .content h3{font-size:12px;color:var(--acc);letter-spacing:.24em;margin-bottom:10px}
  .blk .content p{font-size:10px;color:#93a1b5;line-height:2;letter-spacing:.06em}
  .blk.hero.done{background:linear-gradient(140deg,#0c1620,#0a1018)}
  #tokens{
    position:fixed;right:24px;top:96px;width:250px;z-index:30;
    display:flex;flex-direction:column;gap:8px;
  }
  .tok{
    border:1px solid #223044;border-radius:9px;padding:10px 14px;
    background:rgba(10,15,24,.85);opacity:0;transform:translateX(26px);
    transition:all .6s cubic-bezier(.2,.9,.25,1);display:flex;align-items:center;gap:12px;
  }
  .tok.show{opacity:1;transform:none}
  .tok .t-name{font-size:9px;color:var(--dim);letter-spacing:.24em;min-width:44px}
  .tok .t-val{font-size:11px;color:var(--ink);letter-spacing:.08em;flex:1}
  .tok .t-conf{font-size:9px;color:var(--acc2);font-variant-numeric:tabular-nums}
  .tok .t-ok{color:var(--acc);opacity:0;transition:opacity .3s}
  .tok.picked .t-ok{opacity:1}
  #log{
    position:fixed;left:24px;bottom:22px;z-index:30;width:min(440px,60vw);
    display:flex;flex-direction:column;gap:5px;
  }
  #log .lg{
    font-size:9px;color:#5d6b80;letter-spacing:.1em;opacity:0;
    transition:opacity .5s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #log .lg.show{opacity:1}
  #log .lg b{color:var(--acc);font-weight:400}
  #phase{
    position:fixed;left:24px;top:96px;z-index:30;font-size:9px;color:#445066;
    letter-spacing:.34em;
  }
  #phase b{color:var(--acc);font-weight:400}
</style>
</head>
<body>

<div id="hud">
  <div class="logo">GENESIS</div>
  <div class="philo">recursive-prototype · watch the page design itself</div>
  <div class="spacer"></div>
  <div class="iter">iteration <b id="iterN">#1</b></div>
  <button id="redesign">↻ 重新设计</button>
</div>

<div id="phase">PHASE <b id="phaseN">0</b> · <span id="phaseT">scatter</span></div>

<div id="stage"></div>
<div id="tokens"></div>
<div id="log"></div>

<script>
  const TOKENS=[
    ['字体','等宽 mono'],['主色','#7CF3C0'],['次色','#FFB86C'],['网格','非对称 12 列'],
    ['密度','sparse'],['动效','ease .9s'],['圆角','12px'],['留白','慷慨']
  ];

  const CARDS=[
    ['自省', '每一轮迭代都会回看上一轮，把多余的组件删除，把歧义收敛。'],
    ['演化', '没有两版相同的 GENESIS。它的布局由随机种子和过往决策共同决定。'],
    ['透明', '所有设计决策都公开记录。你看到的不是成品，是它成为成品的过程。']
  ];

  const LOGS=[
    '决策 #1：布局放弃居中 —— 非对称网格传达“仍在生长”。置信度 0.87',
    '决策 #2：字体选择等宽族 —— 代码感即诚实感。置信度 0.93',
    '决策 #3：主色 #7CF3C0 —— 从迭代日志的荧光色取样。置信度 0.81',
    '决策 #4：动效统一 cubic-bezier(.2,.9,.25,1)。置信度 0.95',
    '决策 #5：密度设为 sparse —— 空白本身就是设计。置信度 0.72',
    '决策 #6：本轮方案自评 —— 通过 3/4 检查项，进入下一轮。置信度 0.88'
  ];

  let seed=Date.now()%100000;
  let iter=1;
  let timers=[];
  let rnd=()=>0.5;

  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  const stage=document.getElementById('stage');

  const BLKS=[
    {key:'hero',label:'[ HERO ]'},
    {key:'side',label:'[ PROFILE ]'},
    {key:'c1',label:'[ CAP-01 ]'}, {key:'c2',label:'[ CAP-02 ]'}, {key:'c3',label:'[ CAP-03 ]'},
    {key:'foot',label:'[ FOOT ]'}
  ];

  const LAYOUT={
    draft:{
      hero:{l:'22%',t:'6%',w:'56%',h:'10%'},
      side:{l:'22%',t:'19%',w:'56%',h:'8%'},
      c1:{l:'10%',t:'32%',w:'40%',h:'12%'},c2:{l:'52%',t:'32%',w:'40%',h:'12%'},c3:{l:'10%',t:'48%',w:'40%',h:'12%'},
      foot:{l:'22%',t:'66%',w:'56%',h:'6%'}
    },
    final:{
      hero:{l:'6%',t:'10%',w:'50%',h:'38%'},
      side:{l:'60%',t:'10%',w:'33%',h:'30%'},
      c1:{l:'6%',t:'54%',w:'26%',h:'24%'},c2:{l:'37%',t:'54%',w:'26%',h:'24%'},c3:{l:'68%',t:'54%',w:'26%',h:'24%'},
      foot:{l:'6%',t:'84%',w:'87%',h:'8%'}
    }
  };

  function build(){
    timers.forEach(clearTimeout);timers=[];
    stage.innerHTML='';
    document.getElementById('tokens').innerHTML='';
    document.getElementById('log').innerHTML='';

    const r=rnd;
    BLKS.forEach((b,i)=>{
      const el=document.createElement('div');
      el.className='blk';
      el.innerHTML='<div class="ascii">'+b.label+'</div>';
      stage.appendChild(el);
      const sc={l:(r()*60)+'%',t:(r()*70)+'%',w:(10+r()*25)+'%',h:(6+r()*12)+'%'};
      el.style.left=sc.l;el.style.top=sc.t;el.style.width=sc.w;el.style.height=sc.h;
      b.el=el;
      const d=LAYOUT.draft[b.key];
      b.draft=d;
      const f=LAYOUT.final[b.key];
      b.final=f;
    });

    const contents={
      hero:'<h1>GENESIS<span>_</span></h1><div class="tag">一个正在自我迭代的 agent<br/>本页即为它的迭代现场 —— 你刚才见证了它的第 <b>'+iter+'</b> 版设计</div>',
      side:'<h3>自述</h3><p>我不提供成品主页。我提供的是设计过程本身：每一次刷新，我重新决定自己长什么样，并把决定记录给你看。</p>',
      c1:'<h3>自省</h3><p>每一轮迭代都会回看上一轮，删除多余的组件，收敛歧义。</p>',
      c2:'<h3>演化</h3><p>没有两版相同的 GENESIS，布局由种子与过往决策共同决定。</p>',
      c3:'<h3>透明</h3><p>你看到的不是成品，是它成为成品的过程。</p>',
      foot:'<h3>接入</h3><p>向 GENESIS 提问，它会把回答连同回答的设计过程一起交给你。每一条回答都是新的一次迭代。</p>'
    };
    BLKS.forEach(b=>{
      const c=document.createElement('div');
      c.className='content';
      c.innerHTML=contents[b.key];
      b.el.appendChild(c);
    });
  }

  function setPhase(n,t){
    document.getElementById('phaseN').textContent=n;
    document.getElementById('phaseT').textContent=t;
  }

  function addLog(i,delay){
    timers.push(setTimeout(()=>{
      const lg=document.createElement('div');
      lg.className='lg';
      lg.innerHTML='▸ '+LOGS[i];
      const box=document.getElementById('log');
      box.appendChild(lg);
      requestAnimationFrame(()=>requestAnimationFrame(()=>lg.classList.add('show')));
      while(box.children.length>6)box.firstChild.remove();
    },delay));
  }

  function run(){
    document.getElementById('iterN').textContent='#'+iter;
    setPhase(0,'scatter');
    timers.push(setTimeout(()=>{
      setPhase(1,'wireframe');
      BLKS.forEach(b=>{
        b.el.classList.add('wire');
        b.el.style.left=b.draft.l;b.el.style.top=b.draft.t;
        b.el.style.width=b.draft.w;b.el.style.height=b.draft.h;
      });
    },900));

    timers.push(setTimeout(()=>{
      const box=document.getElementById('tokens');
      TOKENS.forEach((t,i)=>{
        const el=document.createElement('div');
        el.className='tok';
        el.innerHTML='<span class="t-name">'+t[0]+'</span><span class="t-val">'+t[1]+'</span><span class="t-conf">'+(0.72+rnd()*0.27).toFixed(2)+'</span><span class="t-ok">✓</span>';
        box.appendChild(el);
        timers.push(setTimeout(()=>el.classList.add('show'),i*260));
        timers.push(setTimeout(()=>el.classList.add('picked'),1200+i*260));
      });
      addLog(0,700);addLog(1,1500);addLog(2,2300);
    },2100));

    timers.push(setTimeout(()=>{
      setPhase(2,'structure');
      BLKS.forEach(b=>{
        b.el.classList.remove('wire');
        b.el.classList.add('done');
        b.el.style.left=b.final.l;b.el.style.top=b.final.t;
        b.el.style.width=b.final.w;b.el.style.height=b.final.h;
      });
      addLog(3,500);
    },5200));

    timers.push(setTimeout(()=>{
      setPhase(3,'complete');
      BLKS.forEach(b=>b.el.classList.add('show'));
      if(iter>1){
        timers.push(setTimeout(()=>{document.body.style.background='#05070b'},700));
      }
      addLog(4,700);addLog(5,1600);
    },6600));
  }

  function start(){
    rnd=mulberry32(seed);
    build();
    run();
    iter++;
    seed=(seed*1103515245+12345)%2147483647;
  }

  start();

  document.getElementById('redesign').addEventListener('click',()=>{
    document.getElementById('stage').style.transition='all .6s';
    start();
  });
</script>
</body>
</html>
