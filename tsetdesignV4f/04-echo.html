<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ECHO · Visible Thought Agent</title>
<style>
  :root{
    --bg:#070a0d; --ink:#dbe4ee; --dim:#4d5a68;
    --prem:#6a7a92; --inf:#5ff0e0; --contra:#ff8f9e; --conc:#ffc46b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,monospace}
  #hud{
    position:fixed;top:0;left:0;right:0;height:58px;z-index:30;
    display:flex;align-items:center;gap:26px;padding:0 26px;
    background:linear-gradient(rgba(7,10,13,.9),rgba(7,10,13,.5));
    border-bottom:1px solid rgba(95,240,224,.1);backdrop-filter:blur(8px);
  }
  #hud .logo{font-size:15px;letter-spacing:.2em;color:var(--inf);font-weight:700}
  #hud .philo{font-size:10px;color:var(--dim);letter-spacing:.16em;text-transform:uppercase}
  #hud .spacer{flex:1}
  #hud button{
    background:transparent;border:1px solid rgba(95,240,224,.4);color:var(--inf);
    padding:6px 16px;border-radius:5px;cursor:pointer;font-size:10px;letter-spacing:.14em;
  }
  #hud button:hover{background:rgba(95,240,224,.08)}
  #stage{position:fixed;inset:58px 0 0 0;overflow-y:auto;padding:60px 24px 30vh}
  #stage::-webkit-scrollbar{width:0}
  #rail{
    position:relative;width:min(860px,92vw);margin:0 auto;
    min-height:300px;
  }
  #lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .node{
    position:absolute;left:50%;min-width:240px;max-width:min(560px,80vw);
    padding:14px 18px;border-radius:10px;background:#0c1219;border:1px solid #1a2430;
    opacity:0;transform:translate(-50%,0) scale(.96);
    transition:opacity .5s ease,transform .5s cubic-bezier(.2,.9,.2,1);
  }
  .node.show{opacity:1;transform:translate(-50%,0) scale(1)}
  .node .chip{
    display:inline-block;font-size:9px;letter-spacing:.24em;padding:3px 9px;
    border-radius:3px;margin-bottom:9px;
  }
  .node .txt{font-size:13px;line-height:1.9;color:#c6d2de;min-height:1.2em}
  .node.prem{border-left:3px solid var(--prem)}
  .node.prem .chip{background:rgba(106,122,146,.14);color:var(--prem)}
  .node.inf{border-left:3px solid var(--inf)}
  .node.inf .chip{background:rgba(95,240,224,.12);color:var(--inf)}
  .node.contra{border-left:3px solid var(--contra)}
  .node.contra .chip{background:rgba(255,143,158,.12);color:var(--contra)}
  .node.conc{
    border-left:3px solid var(--conc);background:#0e1420;
    box-shadow:0 0 40px rgba(255,196,107,.08);
  }
  .node.conc .chip{background:rgba(255,196,107,.14);color:var(--conc)}
  .node.conc .txt{font-size:17px;letter-spacing:.06em;color:#f0ead8}
  .node.thinking .txt::after{
    content:'▍';animation:blink .7s infinite;
  }
  @keyframes blink{50%{opacity:0}}
  .node.thinking .chip{animation:breath 1.1s ease-in-out infinite}
  @keyframes breath{50%{filter:brightness(1.9)}}
  #meta{
    text-align:center;color:var(--dim);font-size:10px;letter-spacing:.2em;
    margin-top:44px;line-height:2;
  }
  #meta b{color:var(--conc);font-weight:400}
  #cursor{
    position:fixed;pointer-events:none;z-index:40;width:14px;height:14px;
    border:1px solid rgba(95,240,224,.7);border-radius:50%;
    transform:translate(-50%,-50%);transition:left .1s,top .1s;
  }
</style>
</head>
<body>

<div id="hud">
  <div class="logo">ECHO</div>
  <div class="philo">visible-thought · the page is a chain-of-thought</div>
  <div class="spacer"></div>
  <button id="rerun">↻ 重新推理</button>
</div>

<div id="stage"><div id="rail"><svg id="lines"></svg></div></div>

<script>
  const PREM=[
    '用户想要一个 agent 的主页。',
    '主页必须诚实 —— 否则它只是一张海报。',
    'ECHO 的全部价值，在于它的思维过程。'
  ];
  const INF=[
    '思考过程比结论更值得展示。',
    '结论可以被复制，而过程不能。',
    '展示过程，信任随之而来。',
    '页面应该是一次实时的推理，而不是静态的文案。',
    '每秒生长出的思维痕迹，就是最好的自我介绍。',
    '推理本身即内容：观众看见的不是结果，是发生。',
    '如果思考是可见的，错误也可以被原谅。',
    '静态页面是结论；动态推理是对话。'
  ];
  const CONTRA='也许直接展示结论更高效 —— 但那样它与任何营销页没有区别。';
  const CONC='ECHO —— 先想清楚，再开口。主页即思维链。';

  const rail=document.getElementById('rail');
  const lines=document.getElementById('lines');

  let timers=[];
  let running=true;

  function build(){
    timers.forEach(clearTimeout);timers=[];
    rail.innerHTML='<svg id="lines" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></svg>';
    const svg=rail.querySelector('svg');

    const infs=[...INF].sort(()=>Math.random()-0.5).slice(0,4+Math.floor(Math.random()*2));
    const steps=[];
    PREM.forEach((t,i)=>steps.push({text:t,type:'prem',parent:i-1,xoff:0}));
    infs.forEach((t,i)=>steps.push({text:t,type:'inf',parent:2+i,xoff:(i%2?120:0)}));
    if(Math.random()>0.45) steps.push({text:CONTRA,type:'contra',parent:steps.length-1,xoff:-140});
    steps.push({text:CONC,type:'conc',parent:steps.length-1,xoff:0});

    let y=0;
    const nodeGap=0,nodeH=92;
    const nodes=steps.map((s,i)=>{
      const el=document.createElement('div');
      el.className='node '+s.type;
      const label={prem:'前提',inf:'推断',contra:'矛盾',conc:'结论'}[s.type];
      el.innerHTML='<div class="chip">'+label+'</div><div class="txt"></div>';
      const top=y;
      rail.appendChild(el);
      y+=nodeH;
      return {el,top,xoff:s.xoff,text:s.text,parent:s.parent,type:s.type};
    });

    const R=rail.getBoundingClientRect();
    const h=y+nodeH+30;
    rail.style.height=h+'px';
    svg.setAttribute('viewBox','0 0 860 '+h);

    const centers=nodes.map(n=>({x:430+n.xoff,y:n.top+nodeH/2}));

    function drawLine(from,to){
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      const x1=centers[from].x,y1=centers[from].y,x2=centers[to].x,y2=centers[to].y;
      const my=(y1+y2)/2;
      path.setAttribute('d','M'+x1+' '+y1+' C'+x1+' '+my+','+x2+' '+my+','+x2+' '+y2);
      path.setAttribute('fill','none');
      path.setAttribute('stroke','#24303c');
      path.setAttribute('stroke-width','1.4');
      path.setAttribute('stroke-dasharray','6 6');
      const len=Math.hypot(x2-x1,y2-y1);
      path.style.strokeDasharray='600';
      path.style.strokeDashoffset='600';
      path.style.transition='stroke-dashoffset 1.4s ease, stroke .6s';
      svg.appendChild(path);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        path.style.strokeDashoffset='0';
        if(nodes[to].type==='conc') path.setAttribute('stroke','rgba(255,196,107,.5)');
      }));
    }

    nodes.forEach((n,i)=>{
      timers.push(setTimeout(()=>{
        n.el.classList.add('show');
        if(i>0) drawLine(n.parent,i);
      },500+i*1150));
      timers.push(setTimeout(()=>{
        n.el.classList.add('thinking');
        let k=0;
        const iv=setInterval(()=>{
          k++;
          n.el.querySelector('.txt').textContent=n.text.slice(0,k);
          if(k>=n.text.length){
            clearInterval(iv);
            n.el.classList.remove('thinking');
          }
        },26);
        timers.push(iv);
      },650+i*1150));
    });

    timers.push(setTimeout(()=>{
      const meta=document.createElement('div');
      meta.id='meta';
      meta.innerHTML='本轮推理消耗 <b>'+(1480+Math.floor(Math.random()*2400))+'</b> tokens · 终局置信度 <b>'+(0.88+Math.random()*0.1).toFixed(2)+'</b> · 你看见的每一个字，都是它想过的每一个字';
      rail.appendChild(meta);
      rail.style.height=(h+110)+'px';
      svg.setAttribute('viewBox','0 0 860 '+(h+110));
    },600+nodes.length*1150));

    const stage=document.getElementById('stage');
    stage.scrollTop=0;
  }

  build();
  document.getElementById('rerun').addEventListener('click',()=>{
    document.getElementById('stage').scrollTo({top:0,behavior:'smooth'});
    setTimeout(build,600);
  });

  const cursor=document.createElement('div');
  cursor.id='cursor';
  document.body.appendChild(cursor);
  addEventListener('mousemove',e=>{
    cursor.style.left=e.clientX+'px';
    cursor.style.top=e.clientY+'px';
  });
</script>
</body>
</html>
