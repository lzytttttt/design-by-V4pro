<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>GRADIENT · Reward Loop Agent</title>
<style>
  :root{
    --bg:#05070c; --ink:#dce6f2; --dim:#4f5c74; --acc:#8fe8ff; --acc2:#7dffa8; --acc3:#ff8fa8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,monospace}
  #hud{
    position:fixed;top:0;left:0;right:0;height:58px;z-index:40;
    display:flex;align-items:center;gap:26px;padding:0 26px;
    background:linear-gradient(rgba(5,7,12,.92),rgba(5,7,12,.45));
    border-bottom:1px solid rgba(143,232,255,.12);backdrop-filter:blur(8px);
  }
  #hud .logo{font-size:15px;letter-spacing:.2em;color:var(--acc);font-weight:700}
  #hud .philo{font-size:9px;color:var(--dim);letter-spacing:.16em;text-transform:uppercase}
  #hud .spacer{flex:1}
  #hud .stat{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.1em}
  #hud .stat b{color:var(--acc2);font-weight:400}
  #hud button{
    background:transparent;border:1px solid rgba(143,232,255,.4);color:var(--acc);
    padding:6px 16px;border-radius:5px;cursor:pointer;font-size:10px;letter-spacing:.14em;
  }
  #hud button:hover{background:rgba(143,232,255,.08)}
  #field{position:fixed;inset:58px 0 0 0;z-index:10}
  .elm{
    position:absolute;transform:translate(-50%,-50%);
    padding:16px 26px;border-radius:14px;cursor:pointer;user-select:none;
    border:1px solid rgba(143,232,255,.25);background:rgba(12,17,28,.8);
    transition:border-color .3s;will-change:transform,opacity,filter;
    text-align:center;
  }
  .elm:hover{border-color:rgba(143,232,255,.7)}
  .elm .nm{font-size:12px;letter-spacing:.14em;color:#c6d4e6}
  .elm .ft{font-size:9px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.14em;margin-top:6px}
  .elm .rnk{position:absolute;top:6px;left:10px;font-size:8px;color:var(--dim);letter-spacing:.2em}
  #panel{
    position:fixed;right:20px;top:78px;width:250px;z-index:30;
    background:rgba(10,14,24,.9);border:1px solid #1d2a3f;border-radius:14px;padding:18px 18px;
    backdrop-filter:blur(8px);
  }
  #panel h4{font-size:9px;color:var(--dim);letter-spacing:.3em;margin-bottom:12px}
  #panel canvas{width:100%;height:110px;background:#080c14;border-radius:6px}
  #panel .row{display:flex;justify-content:space-between;font-size:9px;color:var(--dim);letter-spacing:.1em;margin-top:10px;font-variant-numeric:tabular-nums}
  #panel .row b{color:var(--acc2);font-weight:400}
  #panel .note{font-size:8px;color:#3d4a5f;letter-spacing:.08em;line-height:1.9;margin-top:12px}
  #hint{
    position:fixed;left:26px;bottom:20px;z-index:30;font-size:9px;color:var(--dim);
    letter-spacing:.16em;line-height:2.2;pointer-events:none;
  }
  #hint b{color:var(--acc2);font-weight:400}
  #event{
    position:fixed;right:300px;bottom:30px;z-index:35;font-size:9px;color:var(--acc2);
    letter-spacing:.12em;opacity:0;transition:opacity .4s;
  }
</style>
</head>
<body>

<div id="hud">
  <div class="logo">GRADIENT</div>
  <div class="philo">reward-loop · the interface is optimizing itself</div>
  <div class="spacer"></div>
  <div class="stat">epoch <b id="epoch">0</b></div>
  <div class="stat">reward <b id="reward">0.00</b></div>
  <div class="stat">ε <b id="eps">0.10</b></div>
  <button id="reset">⟳ 重置分布</button>
</div>

<div id="field"></div>

<div id="panel">
  <h4>REWARD CURVE</h4>
  <canvas id="chart"></canvas>
  <div class="row"><span>best</span><b id="best">—</b></div>
  <div class="row"><span>coverage</span><b id="cov">0%</b></div>
  <div class="note">hover = 持续奖励<br/>click = 大幅奖励<br/>忽视 = 梯度衰减<br/>偶尔 ε 探索会随机扰动</div>
</div>

<div id="hint">这个主页在<b>进化</b>。<br/>你给予注意力的事物会上升；被冷落的会下沉。</div>
<div id="event"></div>

<script>
  const ITEMS=[
    '实时反馈','概率响应','强度自适应','时间折扣','探索-利用',
    '策略梯度','奖励塑形','经验回放','状态价值','累计回报'
  ];

  const field=document.getElementById('field');
  const items=ITEMS.map((name,i)=>{
    const el=document.createElement('div');
    el.className='elm';
    el.innerHTML='<span class="rnk">#'+(i+1)+'</span><div class="nm">'+name+'</div><div class="ft">fit '+(0.3+Math.random()*0.6).toFixed(2)+'</div>';
    field.appendChild(el);
    return {
      el,name,
      fit:0.3+Math.random()*0.6,
      rank:0.5+i/(ITEMS.length-1),
      x:innerWidth/2+(Math.random()-0.5)*300,
      y:innerHeight/2+(Math.random()-0.5)*200,
      hover:false
    };
  });

  const chart=document.getElementById('chart');
  const chCtx=chart.getContext('2d');
  function chartResize(){
    const dpr=Math.min(devicePixelRatio||1,2);
    chart.width=chart.clientWidth*dpr;
    chart.height=chart.clientHeight*dpr;
    chCtx.setTransform(dpr,0,0,dpr,0,0);
  }
  chartResize();addEventListener('resize',chartResize);

  const curve=[];
  let totalReward=0;
  let epoch=0;
  let eps=0.1;
  let frame=0;

  function flash(text){
    const ev=document.getElementById('event');
    ev.textContent='+ '+text;
    ev.style.opacity=1;
    setTimeout(()=>ev.style.opacity=0,900);
  }

  items.forEach(it=>{
    it.el.addEventListener('mouseenter',()=>{it.hover=true;it.el.style.borderColor='rgba(125,255,168,.9)';flash('attention reward');});
    it.el.addEventListener('mouseleave',()=>{it.hover=false;it.el.style.borderColor='';});
    it.el.addEventListener('click',()=>{
      it.fit=Math.min(1,it.fit+0.15);
      totalReward+=0.15;
      flash('click reward +0.15');
    });
  });

  document.getElementById('reset').addEventListener('click',()=>{
    items.forEach(it=>{it.fit=0.2+Math.random()*0.4;});
    curve.length=0;
    totalReward=0;
  });

  (function loop(){
    frame++;
    if(frame%60===0){epoch++;document.getElementById('epoch').textContent=epoch;}
    if(frame%20===0)curve.push(totalReward);
    if(curve.length>70)curve.shift();

    let sum=0;
    const sorted=[...items].sort((a,b)=>b.fit-a.fit);
    sorted.forEach((it,rank)=>{
      const frac=1-rank/(ITEMS.length-1);
      sum+=it.fit;
      it.targetRank=frac;
      if(it.hover){
        it.fit=Math.min(1,it.fit+0.0022);
        totalReward+=0.0022;
      }else{
        it.fit=Math.max(0.05,it.fit-0.0006);
      }
      if(Math.random()<eps*0.02){
        it.fit=Math.min(1,Math.max(0.05,it.fit+(Math.random()-0.5)*0.06));
      }
      it.rank+=(it.targetRank-it.rank)*0.05;
      const yT=88+(1-it.rank)*(innerHeight-200);
      const spread=140*(1-it.rank);
      const xT=innerWidth/2+(it.el.getBoundingClientRect().width*0+ (Math.sin(rank*2.7+frame*0.0003)*0.4)*(100+spread*0.6));
      it.x+=(xT-it.x)*0.06;
      it.y+=(yT-it.y)*0.05;
      const scale=0.7+0.5*it.rank;
      const hue=Math.round(it.rank*130);
      it.el.style.transform='translate(-50%,-50%) scale('+scale.toFixed(3)+')';
      it.el.style.opacity=(0.28+0.72*it.rank).toFixed(3);
      it.el.style.filter='blur('+Math.round((1-it.rank)*3)+'px)';
      it.el.style.zIndex=Math.round(it.rank*30);
      it.el.style.left=it.x+'px';
      it.el.style.top=it.y+'px';
      it.el.style.background='rgba('+Math.round(10+it.rank*14)+','+Math.round(16+it.rank*22)+','+Math.round(26+it.rank*30)+','+(0.55+it.rank*0.4)+')';
      it.el.querySelector('.ft').textContent='fit '+it.fit.toFixed(2)+' · '+Math.round(it.rank*100)+'%';
    });

    const best=sorted[0];
    document.getElementById('best').textContent=best.name+' '+best.fit.toFixed(2);
    document.getElementById('cov').textContent=Math.round(items.filter(i=>i.fit>0.5).length/items.length*100)+'%';
    document.getElementById('reward').textContent=totalReward.toFixed(2);
    document.getElementById('eps').textContent=eps.toFixed(2);

    const w=chart.clientWidth,h=chart.clientHeight;
    chCtx.clearRect(0,0,w,h);
    chCtx.strokeStyle='rgba(125,255,168,.9)';
    chCtx.lineWidth=1.4;
    const max=Math.max(0.5,...curve);
    chCtx.beginPath();
    let lastY=h-4;
    curve.forEach((v,i)=>{
      const x=i/(Math.max(1,curve.length-1))*(w-4)+2;
      lastY=h-4-(v/max)*(h-10);
      if(i===0)chCtx.moveTo(x,lastY);else chCtx.lineTo(x,lastY);
    });
    chCtx.stroke();
    chCtx.fillStyle='rgba(143,232,255,.9)';
    chCtx.beginPath();
    chCtx.arc(w-2,lastY,2,0,Math.PI*2);
    chCtx.fill();

    requestAnimationFrame(loop);
  })();
</script>
</body>
</html>
